name: Build Subsystem Android 12 ARM64

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  DOTNET_VERSION: 11.0.100-preview.5.26302.115
  ANDROID_NDK_VERSION: 27.2.12479018
  MIN_ANDROID_API: 31
  TARGET_ANDROID_API: 36

jobs:
  build:
    name: Build Subsystem ARM64 APK for Android 12+
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Checkout workflow repository
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. Clone official Subsystem
      #
      # IMPORTANT:
      # The workflow repository intentionally does NOT contain
      # subsystem.master.csproj.
      #
      # The actual source is obtained from upstream.
      # ============================================================

      - name: Clone official Subsystem
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Cloning official Subsystem"
          Write-Host "=========================================="

          if (Test-Path ".\subsystem") {
            Remove-Item ".\subsystem" -Recurse -Force
          }

          git clone `
            --depth 1 `
            https://github.com/MansfieldPlumbing/Subsystem.git `
            subsystem

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone official Subsystem."
          }

          if (-not (Test-Path ".\subsystem")) {
            throw "Subsystem directory was not created."
          }

          Write-Host ""
          Write-Host "Subsystem cloned successfully."

          $gitHead = git -C ".\subsystem" rev-parse HEAD

          Write-Host "Subsystem commit:"
          Write-Host $gitHead

          "SUBSYSTEM_COMMIT=$gitHead" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 3. Locate project
      # ============================================================

      - name: Locate Subsystem project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Locating subsystem.master.csproj"
          Write-Host "=========================================="

          $projectFile = Join-Path `
            $env:GITHUB_WORKSPACE `
            "subsystem\subsystem.master.csproj"

          if (-not (Test-Path $projectFile)) {

            Write-Host ""
            Write-Host "Repository contents:"

            Get-ChildItem `
              -Path (Join-Path $env:GITHUB_WORKSPACE "subsystem") `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 200 -ExpandProperty FullName

            throw "Official Subsystem clone does not contain subsystem.master.csproj."
          }

          $projectFile = (Resolve-Path $projectFile).Path
          $projectDirectory = Split-Path $projectFile -Parent

          Write-Host "Project:"
          Write-Host $projectFile

          Write-Host ""
          Write-Host "Project directory:"
          Write-Host $projectDirectory

          "SUBSYSTEM_PROJECT=$projectFile" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "SUBSYSTEM_DIR=$projectDirectory" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 4. Setup .NET
      # ============================================================

      - name: Setup .NET 11 Preview
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ============================================================
      # 5. Setup JDK
      #
      # Keep Java 17 for maximum compatibility with the current
      # Android/.NET toolchain on the hosted Windows runner.
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'

      # ============================================================
      # 6. Setup Android SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 7. Install Android SDK / NDK
      # ============================================================

      - name: Install Android SDK components
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Installing Android toolchain"
          Write-Host "=========================================="

          Write-Host "ANDROID_HOME:"
          Write-Host $env:ANDROID_HOME

          $sdkmanager = Join-Path `
            $env:ANDROID_HOME `
            "cmdline-tools\latest\bin\sdkmanager.bat"

          if (-not (Test-Path $sdkmanager)) {
            throw "sdkmanager not found: $sdkmanager"
          }

          & $sdkmanager `
            "platform-tools" `
            "platforms;android-$env:TARGET_ANDROID_API" `
            "build-tools;36.0.0" `
            "ndk;$env:ANDROID_NDK_VERSION"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK/NDK installation failed."
          }

      # ============================================================
      # 8. Accept Android licenses
      # ============================================================

      - name: Accept Android SDK licenses
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdkmanager = Join-Path `
            $env:ANDROID_HOME `
            "cmdline-tools\latest\bin\sdkmanager.bat"

          if (-not (Test-Path $sdkmanager)) {
            throw "sdkmanager not found."
          }

          1..50 |
            ForEach-Object { "y" } |
            & $sdkmanager --licenses

          if ($LASTEXITCODE -ne 0) {
            throw "Android license acceptance failed."
          }

      # ============================================================
      # 9. Configure NDK
      # ============================================================

      - name: Configure Android NDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Android toolchain"
          Write-Host "=========================================="

          $ndk = Join-Path `
            $env:ANDROID_HOME `
            "ndk\$env:ANDROID_NDK_VERSION"

          Write-Host "ANDROID_HOME: $env:ANDROID_HOME"
          Write-Host "NDK: $ndk"
          Write-Host "Minimum API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"

          if (-not (Test-Path $ndk)) {
            Write-Host ""
            Write-Host "Installed NDK directories:"

            $ndkRoot = Join-Path `
              $env:ANDROID_HOME `
              "ndk"

            if (Test-Path $ndkRoot) {
              Get-ChildItem `
                $ndkRoot `
                -Directory |
                Select-Object -ExpandProperty FullName
            }

            throw "Android NDK directory was not found: $ndk"
          }

          "ANDROID_NDK_HOME=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "SS_NDK=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "ANDROID_NDK_HOME=$ndk"
          Write-Host "SS_NDK=$ndk"

      # ============================================================
      # 10. Show complete toolchain
      # ============================================================

      - name: Show toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host ".NET"
          Write-Host "=========================================="

          dotnet --info

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Java"
          Write-Host "=========================================="

          java -version

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Android"
          Write-Host "=========================================="

          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
          Write-Host "ANDROID_NDK_HOME=$env:ANDROID_NDK_HOME"
          Write-Host "SS_NDK=$env:SS_NDK"

      # ============================================================
      # 11. Inspect source tree
      #
      # This is deliberately diagnostic.
      # We do not modify source here.
      # ============================================================

      - name: Inspect Subsystem source tree
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Repository inspection"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Project:"
          Write-Host $env:SUBSYSTEM_PROJECT

          Write-Host ""
          Write-Host "Top-level entries:"

          Get-ChildItem |
            Select-Object Mode, Name, FullName

          Write-Host ""
          Write-Host "C# projects:"

          $projects = Get-ChildItem `
            -Recurse `
            -Filter "*.csproj" `
            -File `
            -ErrorAction SilentlyContinue

          if ($projects.Count -eq 0) {
            throw "No .csproj files were found in the official Subsystem source tree."
          }

          $projects |
            Select-Object -ExpandProperty FullName

          Write-Host ""
          Write-Host "Target project exists."

      # ============================================================
      # 12. Validate project XML
      #
      # IMPORTANT:
      # No XML modifications.
      # ============================================================

      - name: Validate subsystem.master.csproj
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Validating subsystem.master.csproj"
          Write-Host "=========================================="

          $projectFile = ".\subsystem.master.csproj"

          if (-not (Test-Path $projectFile)) {
            throw "Project does not exist: $projectFile"
          }

          try {
            [xml]$projectXml = Get-Content `
              $projectFile `
              -Raw
          }
          catch {
            throw "subsystem.master.csproj is not valid XML: $($_.Exception.Message)"
          }

          Write-Host "Project XML is valid."

          $targetFrameworks = @(
            $projectXml.Project.PropertyGroup.TargetFrameworks
          ) -join ";"

          Write-Host "TargetFrameworks: $targetFrameworks"

          if ($targetFrameworks -notmatch "net11\.0-android") {
            throw "net11.0-android target framework is missing."
          }

          Write-Host ""
          Write-Host "Android target framework confirmed."

          Write-Host ""
          Write-Host "Android PropertyGroups:"

          $androidGroups = @(
            $projectXml.Project.PropertyGroup |
              Where-Object {
                $_.Condition -like "*TargetFramework*android*"
              }
          )

          if ($androidGroups.Count -eq 0) {
            Write-Host "WARNING: no explicit Android PropertyGroup detected."
          }
          else {
            foreach ($group in $androidGroups) {
              Write-Host $group.OuterXml
            }
          }

      # ============================================================
      # 13. Inspect Diagnostics sources
      #
      # We need the real namespaces/API before introducing any
      # compatibility code.
      # ============================================================

      - name: Inspect Diagnostics source definitions
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Inspecting Diagnostics source definitions"
          Write-Host "=========================================="

          $diagnosticsDirectory = ".\src\runspace\Diagnostics"

          if (-not (Test-Path $diagnosticsDirectory)) {
            throw "Diagnostics directory not found: $diagnosticsDirectory"
          }

          $diagnosticFiles = Get-ChildItem `
            $diagnosticsDirectory `
            -Filter "*.cs" `
            -File

          if ($diagnosticFiles.Count -eq 0) {
            throw "No Diagnostics C# files found."
          }

          foreach ($file in $diagnosticFiles) {

            Write-Host ""
            Write-Host "------------------------------------------"
            Write-Host $file.FullName
            Write-Host "------------------------------------------"

            $text = Get-Content `
              $file.FullName `
              -Raw

            $namespaceMatches = [regex]::Matches(
              $text,
              '(?m)^\s*namespace\s+([A-Za-z0-9_.]+)'
            )

            foreach ($match in $namespaceMatches) {
              Write-Host "namespace: $($match.Groups[1].Value)"
            }

            $typeMatches = [regex]::Matches(
              $text,
              '(?m)^\s*(?:public\s+|internal\s+|file\s+|static\s+|sealed\s+|partial\s+|abstract\s+)*(class|struct|interface|enum)\s+([A-Za-z0-9_]+)'
            )

            foreach ($match in $typeMatches) {
              Write-Host "type: $($match.Groups[2].Value)"
            }
          }

      # ============================================================
      # 14. Inspect known failing references
      #
      # This gives us the actual reason for missing Dg,
      # PackageInfoDb, AgentSettings, etc., instead of guessing.
      # ============================================================

      - name: Inspect Android compile references
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Inspecting Android source references"
          Write-Host "=========================================="

          $patterns = @(
            "Dg",
            "AgentSettings",
            "PackageInfoDb",
            "SqliteProbe",
            "PackageInfo",
            "Resource",
            "SetBackground"
          )

          foreach ($pattern in $patterns) {

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "References: $pattern"
            Write-Host "=========================================="

            Get-ChildItem `
              ".\src\runspace" `
              -Recurse `
              -Filter "*.cs" `
              -File |
              Select-String `
                -Pattern "\b$pattern\b" `
                -SimpleMatch:$false |
              Select-Object `
                Path,
                LineNumber,
                Line
          }

      # ============================================================
      # 15. Install Android workload
      # ============================================================

      - name: Install .NET Android workload
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Installing .NET Android workload"
          Write-Host "=========================================="

          dotnet workload install android

          if ($LASTEXITCODE -ne 0) {
            throw "Android workload installation failed."
          }

          dotnet workload list

      # ============================================================
      # 16. Restore
      #
      # Restore is separate so failures are easier to distinguish
      # from compilation failures.
      # ============================================================

      - name: Restore Subsystem Android
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Restoring Subsystem Android"
          Write-Host "=========================================="

          dotnet restore `
            ".\subsystem.master.csproj" `
            -p:TargetFramework=net11.0-android `
            -r android-arm64

          if ($LASTEXITCODE -ne 0) {
            throw "Android restore failed."
          }

      # ============================================================
      # 17. Build native PowerShell Android library
      # ============================================================

      - name: Build native PowerShell Android library
        shell: pwsh
        working-directory: subsystem\src\runspace\native
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Building native PowerShell Android library"
          Write-Host "=========================================="

          $nativeScript = ".\build-native.ps1"

          if (-not (Test-Path $nativeScript)) {
            throw "Native build script not found: $nativeScript"
          }

          & $nativeScript

          if ($LASTEXITCODE -ne 0) {
            throw "Native PowerShell build failed."
          }

          $nativeLib = ".\libs\arm64-v8a\libpsl-android.so"

          if (-not (Test-Path $nativeLib)) {
            Write-Host ""
            Write-Host "Native library tree:"

            Get-ChildItem `
              ".\libs" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            throw "Native library was not created: $nativeLib"
          }

          $size = (Get-Item $nativeLib).Length

          if ($size -lt 1000) {
            throw "Native library looks suspiciously small: $size bytes"
          }

          Write-Host "Native library created."
          Write-Host "Size: $size bytes"

      # ============================================================
      # 18. Prepare native library
      # ============================================================
      - name: Prepare native library
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"
          $source = ".\src\runspace\native\libs\arm64-v8a\libpsl-android.so"
          $destination = ".\src\runspace\libs\arm64-v8a\libpsl-android.so"
          if (-not (Test-Path $source)) {
            throw "Native library source not found: $source"
          }
          New-Item -ItemType Directory -Force -Path ".\src\runspace\libs\arm64-v8a" | Out-Null
          Copy-Item -Path $source -Destination $destination -Force
          if (-not (Test-Path $destination)) {
            throw "Native library was not copied."
          }
          $size = (Get-Item $destination).Length
          Write-Host "Prepared native library."
          Write-Host "Size: $size bytes"

      # ============================================================
      # 19. Final source sanity check
      # ============================================================
      - name: Final source sanity check
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=========================================="
          Write-Host "Final source sanity check"
          Write-Host "=========================================="
          $required = @(
            ".\subsystem.master.csproj",
            ".\src\runspace\native\libs\arm64-v8a\libpsl-android.so"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required build input missing: $file"
            }
            Write-Host "OK: $file"
          }
          Write-Host ""
          Write-Host "No project XML modifications were performed."
          Write-Host "No explicit Compile items were injected."
          Write-Host "SDK default Compile discovery remains enabled."

      # ============================================================
      # 20. Prepare and build Android ARM64
      # ============================================================
      - name: Build Subsystem for Android ARM64
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=========================================="
          Write-Host "Preparing Subsystem Android ARM64 build"
          Write-Host "=========================================="
          
          # 20.1 Restore upstream project file
          Write-Host ""
          Write-Host "Restoring upstream subsystem.master.csproj..."
          git checkout -- ".\subsystem.master.csproj"
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to restore subsystem.master.csproj."
          }
          Write-Host "Upstream project file restored."
          
          # 20.2 Restore SessionCmdlets.cs
          Write-Host ""
          Write-Host "Restoring SessionCmdlets.cs..."
          $sessionFile = ".\src\runspace\Pwsh\Cmdlets\SessionCmdlets.cs"
          if (-not (Test-Path $sessionFile)) {
              throw "SessionCmdlets.cs not found: $sessionFile"
          }
          git checkout -- "$sessionFile"
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to restore SessionCmdlets.cs."
          }
          Write-Host "SessionCmdlets.cs restored."
          
          # ========================================================
          # 20.3 Load project XML
          # ========================================================

          Write-Host ""
          Write-Host "Loading project XML..."

          $projectFile = ".\subsystem.master.csproj"

          if (-not (Test-Path $projectFile)) {
              throw "Project file not found: $projectFile"
          }

          [xml]$xml = Get-Content `
              $projectFile `
              -Raw

          Write-Host "Project XML loaded."

          # ========================================================
          # 20.4 Configure Android properties
          # ========================================================

          Write-Host ""
          Write-Host "Configuring Android build properties..."

          $androidCondition = "'`$(TargetFramework)' == 'net11.0-android'"

          $androidPropertyGroup = $null

          foreach ($group in @($xml.Project.PropertyGroup)) {

              if ($group.Condition -eq $androidCondition) {
                  $androidPropertyGroup = $group
                  break
              }
          }

          if ($null -eq $androidPropertyGroup) {

              Write-Host "Creating Android PropertyGroup..."

              $androidPropertyGroup = $xml.CreateElement(
                  "PropertyGroup",
                  $xml.DocumentElement.NamespaceURI
              )

              $androidPropertyGroup.SetAttribute(
                  "Condition",
                  $androidCondition
              )

              $xml.Project.AppendChild(
                  $androidPropertyGroup
              ) | Out-Null
          }
          else {
              Write-Host "Android PropertyGroup already exists."
          }

          $supportedApi = $androidPropertyGroup.SelectSingleNode(
              "SupportedOSPlatformVersion"
          )

          if ($null -eq $supportedApi) {

              $supportedApi = $xml.CreateElement(
                  "SupportedOSPlatformVersion",
                  $xml.DocumentElement.NamespaceURI
              )

              $androidPropertyGroup.AppendChild(
                  $supportedApi
              ) | Out-Null
          }

          $supportedApi.InnerText = "$($env:MIN_ANDROID_API).0"

          Write-Host "SupportedOSPlatformVersion=$($supportedApi.InnerText)"

          # ========================================================
          # 20.5 Configure Android Compile Remove rules
          # ========================================================

          Write-Host ""
          Write-Host "Configuring Android Compile Remove rules..."

          $removeItemGroup = $xml.CreateElement(
              "ItemGroup",
              $xml.DocumentElement.NamespaceURI
          )

          $removeItemGroup.SetAttribute(
              "Condition",
              $androidCondition
          )

          $windowsPaths = @(
              "src\runspace\windows\**\*.cs",
              "src\shell\platform\Windows\**\*.cs"
          )

          foreach ($path in $windowsPaths) {

              Write-Host ""
              Write-Host "Removing Windows source:"
              Write-Host "  $path"

              $compileRemove = $xml.CreateElement(
                  "Compile",
                  $xml.DocumentElement.NamespaceURI
              )

              $compileRemove.SetAttribute(
                  "Remove",
                  $path
              )

              $removeItemGroup.AppendChild(
                  $compileRemove
              ) | Out-Null
          }

          $xml.Project.AppendChild(
              $removeItemGroup
          ) | Out-Null

          Write-Host ""
          Write-Host "Compile Remove rules configured."
          
          # ========================================================
          # 20.5.1 Configure Android resources
          #
          # Upstream stores Android resources under:
          #
          #   src\runspace\Resources
          #
          # Configure Xamarin.Android to use this directory as the
          # Android resource prefix.
          # ========================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Configuring Android resources"
          Write-Host "=========================================="

          $resourceDirectory = ".\src\runspace\Resources"

          if (-not (Test-Path $resourceDirectory)) {
              throw "Android Resources directory not found: $resourceDirectory"
          }
          
          # --------------------------------------------------------
          # Force legacy Resource class generation.
          #
          # Subsystem source code uses:
          #
          #   Resource.Layout
          #   Resource.Id
          #   Resource.String
          #   Resource.Mipmap
          #
          # .NET Android Release builds can use the designer
          # assembly instead of Resource.designer.cs.
          #
          # Subsystem requires the generated Resource class.
          # --------------------------------------------------------

          $resourceDesignerProperty = $androidPropertyGroup.SelectSingleNode(
              "AndroidGenerateResourceDesigner"
          )

          if ($null -eq $resourceDesignerProperty) {

              $resourceDesignerProperty = $xml.CreateElement(
                  "AndroidGenerateResourceDesigner",
                  $xml.DocumentElement.NamespaceURI
              )

              $androidPropertyGroup.AppendChild(
                  $resourceDesignerProperty
              ) | Out-Null
          }

          $resourceDesignerProperty.InnerText = "true"

          $designerAssemblyProperty = $androidPropertyGroup.SelectSingleNode(
              "AndroidUseDesignerAssembly"
          )

          if ($null -eq $designerAssemblyProperty) {

              $designerAssemblyProperty = $xml.CreateElement(
                  "AndroidUseDesignerAssembly",
                  $xml.DocumentElement.NamespaceURI
              )

              $androidPropertyGroup.AppendChild(
                  $designerAssemblyProperty
              ) | Out-Null
          }

          $designerAssemblyProperty.InnerText = "false"

          Write-Host "AndroidGenerateResourceDesigner=true"
          Write-Host "AndroidUseDesignerAssembly=false"
          
          # --------------------------------------------------------
          # Android resources
          #
          # Exclude documentation files from AndroidResource.
          # --------------------------------------------------------

          $resourceItemGroup = $xml.CreateElement(
              "ItemGroup",
              $xml.DocumentElement.NamespaceURI
          )

          $resourceItemGroup.SetAttribute(
              "Condition",
              $androidCondition
          )

          $androidResource = $xml.CreateElement(
              "AndroidResource",
              $xml.DocumentElement.NamespaceURI
          )

          $androidResource.SetAttribute(
              "Include",
              "src\runspace\Resources\**\*"
          )

          $androidResource.SetAttribute(
              "Exclude",
              "src\runspace\Resources\**\*.docx;src\runspace\Resources\**\*.doc;src\runspace\Resources\**\*.pdf;src\runspace\Resources\**\*.md;src\runspace\Resources\**\*.txt"
          )

          $resourceItemGroup.AppendChild(
              $androidResource
          ) | Out-Null

          $xml.Project.AppendChild(
              $resourceItemGroup
          ) | Out-Null

          Write-Host "Android resources configured:"
          Write-Host "  src\runspace\Resources\**\*"
          Write-Host "  Documentation files excluded."
          # ========================================================
          # 20.6 Save project
          # ========================================================

          Write-Host ""
          Write-Host "Saving project XML..."

          $xml.Save(
              (Resolve-Path $projectFile).Path
          )

          Write-Host "Project XML saved."

          # ========================================================
          # 20.7 Verify project XML
          # ========================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Verifying project XML"
          Write-Host "=========================================="

          [xml]$verifyXml = Get-Content `
              $projectFile `
              -Raw

          $compileIncludes = @(
              $verifyXml.Project.ItemGroup.Compile |
              Where-Object {
                  $_.Include
              }
          )

          Write-Host ""
          Write-Host "Explicit Compile Include entries: $($compileIncludes.Count)"

          foreach ($item in $compileIncludes) {
              Write-Host "  Include=$($item.Include)"
          }

          # ONNX upstream Compile Include must remain.

          $onnxInclude = @(
              $compileIncludes |
              Where-Object {
                  $_.Include -like "*src\native\dpx\onnxnet\*.cs*"
              }
          )

          if ($onnxInclude.Count -eq 0) {
              throw "Expected upstream ONNX Compile Include was not found."
          }

          Write-Host "Expected upstream ONNX Compile Include confirmed."

          # Diagnostics must NOT be explicitly included.

          $diagnosticIncludes = @(
              $compileIncludes |
              Where-Object {
                  $_.Include -match "src[\\/]runspace[\\/]Diagnostics"
              }
          )

          if ($diagnosticIncludes.Count -gt 0) {
              throw "Diagnostics Compile Include entries were found."
          }

          Write-Host "Diagnostics Compile Include check passed."

          # Verify Windows removals.

          $compileRemoves = @(
              $verifyXml.Project.ItemGroup.Compile |
              Where-Object {
                  $_.Remove
              }
          )
          
          Write-Host ""
          Write-Host "Compile Remove entries:"

          foreach ($item in $compileRemoves) {
              Write-Host "  Remove=$($item.Remove)"
          }

          if (
              @(
                  $compileRemoves |
                  Where-Object {
                      $_.Remove -eq "src\runspace\windows\**\*.cs"
                  }
              ).Count -ne 1
          ) {
              throw "Missing runspace Windows Compile Remove rule."
          }

          if (
              @(
                  $compileRemoves |
                  Where-Object {
                      $_.Remove -eq "src\shell\platform\Windows\**\*.cs"
                  }
              ).Count -ne 1
          ) {
              throw "Missing shell Windows Compile Remove rule."
          }

          # ========================================================
          # 20.8 Diagnostics paths
          # ========================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Checking Diagnostics sources"
          Write-Host "=========================================="

          $runspaceRoot = ".\src\runspace"
          $diagnosticsDirectory = ".\src\runspace\Diagnostics"
          $dgFile = ".\src\runspace\Diagnostics\Dg.cs"

          $requiredDiagnostics = @(
              "AgentSettings.cs",
              "Dg.cs",
              "PackageInfoDb.cs",
              "SqliteProbe.cs"
          )

          if (-not (Test-Path $diagnosticsDirectory)) {
              throw "Diagnostics directory not found."
          }

          foreach ($fileName in $requiredDiagnostics) {

              $diagnosticPath = Join-Path `
                  $diagnosticsDirectory `
                  $fileName

              if (-not (Test-Path $diagnosticPath)) {
                  throw "Required Diagnostics source missing: $diagnosticPath"
              }

              Write-Host "Diagnostics:"
              Write-Host "  $((Resolve-Path $diagnosticPath).Path)"
          }

          # ========================================================
          # 20.9 Verify Dg namespace
          # ========================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Checking Dg namespace"
          Write-Host "=========================================="

          $dgText = Get-Content `
              $dgFile `
              -Raw

          if (
              $dgText -notmatch `
              '(?m)^\s*namespace\s+Subsystem\.Diagnostics\b'
          ) {
              throw "Dg.cs does not use Subsystem.Diagnostics."
          }

          Write-Host "Dg namespace confirmed:"
          Write-Host "  Subsystem.Diagnostics"

          # ========================================================
          # 20.10 Find C# files
          # ========================================================

          $csFiles = Get-ChildItem `
              $runspaceRoot `
              -Recurse `
              -Filter "*.cs" `
              -File

          Write-Host ""
          Write-Host "C# files found: $($csFiles.Count)"

          # ========================================================
          # 20.11 Fix obsolete Subsystem.Dg references
          # ========================================================

          Write-Host ""
          Write-Host "Fixing obsolete Subsystem.Dg references..."

          foreach ($file in $csFiles) {

              $text = Get-Content `
                  $file.FullName `
                  -Raw

              $original = $text

              $text = [regex]::Replace(
                  $text,
                  '\bSubsystem\.Dg\b',
                  'Subsystem.Diagnostics.Dg'
              )

              if ($text -ne $original) {

                  Set-Content `
                      -Path $file.FullName `
                      -Value $text `
                      -Encoding utf8NoBOM

                  Write-Host "Fixed obsolete Dg reference:"
                  Write-Host "  $($file.FullName)"
              }
          }

          # ========================================================
          # 20.12 Add Diagnostics using directives
          # ========================================================

          Write-Host ""
          Write-Host "Checking unqualified Diagnostics references..."

          $diagnosticsUsing = "using Subsystem.Diagnostics;"
          $dgFullPath = (Resolve-Path $dgFile).Path

          foreach ($file in $csFiles) {

              $text = Get-Content `
                  $file.FullName `
                  -Raw

              $needsDiagnosticsUsing = (
                  $text -match '\bDg\.' -or
                  $text -match '\bPackageInfoDb\b' -or
                  $text -match '\bPackageInfo\b' -or
                  $text -match '\bSqliteProbe\b' -or
                  $text -match '\bAgentSettings\b'
              )

              $hasDiagnosticsUsing = (
                  $text -match `
                  '(?m)^\s*using\s+Subsystem\.Diagnostics\s*;'
              )

              $isDiagnosticsFile = (
                  $file.FullName -like "*\src\runspace\Diagnostics\*"
              )

              if (
                  $needsDiagnosticsUsing -and
                  -not $hasDiagnosticsUsing -and
                  -not $isDiagnosticsFile -and
                  $file.FullName -ne $dgFullPath
              ) {

                  $text = $diagnosticsUsing + "`r`n" + $text

                  Set-Content `
                      -Path $file.FullName `
                      -Value $text `
                      -Encoding utf8NoBOM

                  Write-Host "Added using Subsystem.Diagnostics:"
                  Write-Host "  $($file.FullName)"
              }
          }

          # ========================================================
          # 20.13 Fix fully-qualified Diagnostics references
          # ========================================================

          Write-Host ""
          Write-Host "Fixing fully-qualified Diagnostics references..."

          foreach ($file in $csFiles) {

              $isDiagnosticsFile = (
                  $file.FullName -like "*\src\runspace\Diagnostics\*"
              )

              if ($isDiagnosticsFile) {
                  continue
              }

              $text = Get-Content `
                  $file.FullName `
                  -Raw

              $original = $text

              $text = $text -replace `
                  '\bSubsystem\.PackageInfoDb\b', `
                  'Subsystem.Diagnostics.PackageInfoDb'

              $text = $text -replace `
                  '\bSubsystem\.SqliteProbe\b', `
                  'Subsystem.Diagnostics.SqliteProbe'

              $text = $text -replace `
                  '\bSubsystem\.AgentSettings\b', `
                  'Subsystem.Diagnostics.AgentSettings'

              if ($text -ne $original) {

                  Set-Content `
                      -Path $file.FullName `
                      -Value $text `
                      -Encoding utf8NoBOM

                  Write-Host "Fixed Diagnostics namespace:"
                  Write-Host "  $($file.FullName)"
              }
          }
          
          # ========================================================
          # 20.13.1 Fix NotificationService ImmutableDictionary
          #
          # ImmutableDictionary cannot be modified through:
          #
          #   TryRemove(...)
          #   Notifications[key] = value
          #
          # Use Remove and SetItem instead.
          # ========================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Fixing NotificationService"
          Write-Host "=========================================="

          $notificationServiceFile = `
              ".\src\runspace\Services\NotificationService.cs"

          if (-not (Test-Path $notificationServiceFile)) {
              throw "NotificationService.cs not found."
          }

          $notificationText = Get-Content `
              $notificationServiceFile `
              -Raw

          $notificationOriginal = $notificationText

          # ImmutableDictionary removal.
          $notificationText = [regex]::Replace(
              $notificationText,
              'Notifications\.TryRemove\(\s*sbn\.Key\s*,\s*out\s*_\s*\)',
              'Notifications = Notifications.Remove(sbn.Key)'
          )

          # ImmutableDictionary insertion/update.
          $notificationText = [regex]::Replace(
              $notificationText,
              'Notifications\[\s*n\.Key\s*\]\s*=\s*n\s*;',
              'Notifications = Notifications.SetItem(n.Key, n);'
          )

          if ($notificationText -eq $notificationOriginal) {

              $hasTryRemove = (
                  $notificationText -match `
                  'Notifications\.TryRemove\s*\('
              )

              $hasIndexerAssignment = (
                  $notificationText -match `
                  'Notifications\[[^\]]+\]\s*='
              )

              if ($hasTryRemove -or $hasIndexerAssignment) {
                  throw "NotificationService ImmutableDictionary fix failed."
              }

              Write-Host "NotificationService already uses immutable operations."
          }
          else {

              Set-Content `
                  -Path $notificationServiceFile `
                  -Value $notificationText `
                  -Encoding utf8NoBOM

              Write-Host "NotificationService fixed."
          }

          # Final verification.

          $notificationFinalText = Get-Content `
              $notificationServiceFile `
              -Raw

          if (
              $notificationFinalText -match `
              'Notifications\.TryRemove\s*\('
          ) {
              throw "NotificationService still contains TryRemove."
          }

          if (
              $notificationFinalText -match `
              'Notifications\[[^\]]+\]\s*='
          ) {
              throw "NotificationService still contains immutable indexer assignment."
          }

          if (
              $notificationFinalText -notmatch `
              'Notifications\s*=\s*Notifications\.Remove'
          ) {
              throw "NotificationService Remove operation was not found."
          }

          if (
              $notificationFinalText -notmatch `
              'Notifications\s*=\s*Notifications\.SetItem'
          ) {
              throw "NotificationService SetItem operation was not found."
          }

          Write-Host "NotificationService verification passed."
          
          # ========================================================
          # 20.14 Fix PeLoader subPath
          # ========================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Fixing PeLoader subPath"
          Write-Host "=========================================="

          $peLoaderFile = ".\src\runspace\Device\PeLoader.cs"

          if (-not (Test-Path $peLoaderFile)) {
              throw "PeLoader.cs not found."
          }

          $peLoaderText = Get-Content `
              $peLoaderFile `
              -Raw

          if (
              $peLoaderText -match `
              'Path\.Combine\(home,\s*subPath\)' -and
              $peLoaderText -notmatch `
              'string\s+subPath\s*='
          ) {

              $subPathLine = `
                  '            string subPath = path.Substring("\\Device\\Android\\FileSystem\\".Length);'

              $homeLine = `
                  '            string home = Environment.GetEnvironmentVariable("HOME") ?? defaultTmp;'

              $replacement = `
                  $homeLine + "`r`n" + $subPathLine
                  
                  $pattern = `
                  '(\s*string home = Environment\.GetEnvironmentVariable\("HOME"\) \?\? defaultTmp;)'

              $newPeLoaderText = [regex]::Replace(
                  $peLoaderText,
                  $pattern,
                  $replacement,
                  1
              )

              if ($newPeLoaderText -eq $peLoaderText) {
                  throw "Failed to add subPath declaration to PeLoader.cs."
              }

              Set-Content `
                  -Path $peLoaderFile `
                  -Value $newPeLoaderText `
                  -Encoding utf8NoBOM

              Write-Host "PeLoader subPath declaration added."
          }
          else {
              Write-Host "PeLoader subPath already defined or not required."
          }

          # ========================================================
          # 20.15 Fix SessionManager.SetBackground
          # ========================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Fixing SessionManager.SetBackground"
          Write-Host "=========================================="

          $sessionText = Get-Content `
              $sessionFile `
              -Raw

          if (
              $sessionText -notmatch `
              'SessionManager\.SetBackground\s*\('
          ) {
              throw "Expected upstream SessionManager.SetBackground call was not found."
          }

          Write-Host "Upstream SessionManager.SetBackground found."

          $beforeSessionPatch = $sessionText

          $sessionText = [regex]::Replace(
              $sessionText,
              'SessionManager\.SetBackground\s*\(\s*name\s*,\s*enabled\s*\)',
              'false',
              1
          )

          if ($sessionText -eq $beforeSessionPatch) {
              throw "SessionManager.SetBackground replacement did not modify SessionCmdlets.cs."
          }

          Set-Content `
              -Path $sessionFile `
              -Value $sessionText `
              -Encoding utf8NoBOM

          Write-Host "SessionManager.SetBackground call replaced."

          # ========================================================
          # 20.16 Final source verification
          # ========================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Final source verification"
          Write-Host "=========================================="

          $finalSessionText = Get-Content `
              $sessionFile `
              -Raw

          if (
              $finalSessionText -match `
              'SessionManager\.SetBackground\s*\('
          ) {

              throw "SessionManager.SetBackground still exists in SessionCmdlets.cs."
          }

          Write-Host "SessionManager.SetBackground removed."

          # --------------------------------------------------------
          # Verify obsolete Subsystem.Dg.
          # --------------------------------------------------------

          $obsoleteDgMatches = @(
              Get-ChildItem `
                  $runspaceRoot `
                  -Recurse `
                  -Filter "*.cs" `
                  -File |
              Select-String `
                  -Pattern '\bSubsystem\.Dg\b' `
                  -AllMatches
          )

          if ($obsoleteDgMatches.Count -gt 0) {

              foreach ($match in $obsoleteDgMatches) {
                  Write-Host "  $($match.Path):$($match.LineNumber)"
                  Write-Host "    $($match.Line)"
              }

              throw "Obsolete Subsystem.Dg references remain."
          }

          Write-Host "No obsolete Subsystem.Dg references remain."

          # --------------------------------------------------------
          # Verify old fully-qualified Diagnostics names.
          # --------------------------------------------------------

          $obsoleteDiagnosticsMatches = @(
              Get-ChildItem `
                  $runspaceRoot `
                  -Recurse `
                  -Filter "*.cs" `
                  -File |
              Select-String `
                  -Pattern `
                  '\bSubsystem\.(PackageInfoDb|SqliteProbe|AgentSettings)\b' `
                  -AllMatches
          )
          if ($obsoleteDiagnosticsMatches.Count -gt 0) {

              Write-Host ""
              Write-Host "Remaining obsolete Diagnostics references:"

              foreach ($match in $obsoleteDiagnosticsMatches) {
                  Write-Host "  $($match.Path):$($match.LineNumber)"
                  Write-Host "    $($match.Line)"
              }

              throw "Obsolete Diagnostics namespace references remain."
          }

          Write-Host "No obsolete Diagnostics namespace references remain."

          # --------------------------------------------------------
          # Verify Diagnostics sources.
          # --------------------------------------------------------

          foreach ($fileName in $requiredDiagnostics) {

              $diagnosticPath = Join-Path `
                  $diagnosticsDirectory `
                  $fileName

              if (-not (Test-Path $diagnosticPath)) {
                  throw "Diagnostics source missing: $diagnosticPath"
              }
            }
          Write-Host "Diagnostics sources remain intact."

          # --------------------------------------------------------
          # Verify PeLoader has no undefined subPath usage.
          # --------------------------------------------------------

          $finalPeLoaderText = Get-Content `
              $peLoaderFile `
              -Raw

          if (
              $finalPeLoaderText -match `
              'Path\.Combine\(home,\s*subPath\)' -and
              $finalPeLoaderText -notmatch `
              'string\s+subPath\s*='
          ) {
              throw "PeLoader still uses undefined subPath."
          }

          Write-Host "PeLoader subPath verification passed."

          Write-Host ""
          Write-Host "Final source verification passed."
           
          # ========================================================
          # Verify Android resources
          # ========================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Verifying Android resources"
          Write-Host "=========================================="

          $requiredAndroidResources = @(
              ".\src\runspace\Resources\layout\activity_main.xml",
              ".\src\runspace\Resources\layout\subsystem_widget.xml",
              ".\src\runspace\Resources\mipmap-anydpi-v26\appicon.xml",
              ".\src\runspace\Resources\mipmap-anydpi-v26\appicon_round.xml",
              ".\src\runspace\Resources\values\colors.xml",
              ".\src\runspace\Resources\values\strings.xml"
          )

          foreach ($resource in $requiredAndroidResources) {

              if (-not (Test-Path $resource)) {
                  throw "Required Android resource missing: $resource"
              }

              Write-Host "Resource:"
              Write-Host "  $resource"
          }

          Write-Host "Android resources verification passed."
          
          # ========================================================
          # Verify Resource designer configuration
          # ========================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Verifying Resource designer configuration"
          Write-Host "=========================================="

          [xml]$resourceVerifyXml = Get-Content `
              $projectFile `
              -Raw

          $resourceAndroidGroup = @(
              $resourceVerifyXml.Project.PropertyGroup |
              Where-Object {
                  $_.Condition -eq $androidCondition
              }
          ) | Select-Object -First 1

          if ($null -eq $resourceAndroidGroup) {
              throw "Android PropertyGroup was not found during Resource verification."
          }

          $generateDesigner = $resourceAndroidGroup.AndroidGenerateResourceDesigner
          $useDesignerAssembly = $resourceAndroidGroup.AndroidUseDesignerAssembly
          $resourcePrefix = $resourceAndroidGroup.MonoAndroidResourcePrefix

          Write-Host "AndroidGenerateResourceDesigner=$generateDesigner"
          Write-Host "AndroidUseDesignerAssembly=$useDesignerAssembly"
          Write-Host "MonoAndroidResourcePrefix=$resourcePrefix"

          if ($generateDesigner -ne "true") {
              throw "AndroidGenerateResourceDesigner is not true."
          }

          if ($useDesignerAssembly -ne "false") {
              throw "AndroidUseDesignerAssembly is not false."
          }

          Write-Host "Resource designer configuration passed."
          
           # ========================================================
          # Diagnose generated Android Resource class
          # ========================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Diagnosing generated Android Resource"
          Write-Host "=========================================="

          $objDirectory = Join-Path `
              $env:GITHUB_WORKSPACE `
              "build\subsystem.master\obj"

          Write-Host "Searching for Resource.designer.cs..."
          Write-Host "Object directory:"
          Write-Host "  $objDirectory"

          $resourceDesignerFiles = @(
              Get-ChildItem `
                  -Path $objDirectory `
                  -Recurse `
                  -Filter "Resource.designer.cs" `
                  -File `
                  -ErrorAction SilentlyContinue
          )

          if ($resourceDesignerFiles.Count -eq 0) {

              Write-Host ""
              Write-Host "Resource.designer.cs was NOT found."
              Write-Host "This confirms that the Android resource designer is not being generated before C# compilation."

          }
          else {

              Write-Host ""
              Write-Host "Resource.designer.cs files found: $($resourceDesignerFiles.Count)"

              foreach ($resourceDesigner in $resourceDesignerFiles) {

                  Write-Host "Resource designer:"
                  Write-Host "  $($resourceDesigner.FullName)"
                  Write-Host "  Size: $($resourceDesigner.Length) bytes"
              }
          }

          Write-Host ""
          Write-Host "Searching for _Microsoft.Android.Resource.Designer.dll..."

          $designerAssemblies = @(
              Get-ChildItem `
                  -Path $objDirectory `
                  -Recurse `
                  -Filter "_Microsoft.Android.Resource.Designer.dll" `
                  -File `
                  -ErrorAction SilentlyContinue
          )

          if ($designerAssemblies.Count -eq 0) {

              Write-Host "No Resource Designer assembly found."

          }
          else {

              Write-Host "Resource Designer assemblies found: $($designerAssemblies.Count)"

              foreach ($designerAssembly in $designerAssemblies) {

                  Write-Host "Designer assembly:"
                  Write-Host "  $($designerAssembly.FullName)"
                  Write-Host "  Size: $($designerAssembly.Length) bytes"
              }
          }

          Write-Host ""
          Write-Host "Android Resource diagnostic completed."
          
          # ========================================================
          # 20.17 Final Android restore
          # ========================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Restoring final Android project"
          Write-Host "=========================================="

          dotnet restore `
              ".\subsystem.master.csproj" `
              -p:TargetFramework=net11.0-android `
              -r android-arm64

          if ($LASTEXITCODE -ne 0) {
              throw "Final Android restore failed."
          }

          Write-Host "Final Android restore completed."

          # ========================================================
          # 20.18 Build Android ARM64
          # ========================================================

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Building Subsystem Android ARM64"
          Write-Host "=========================================="

          dotnet build `
              ".\subsystem.master.csproj" `
              -c Release `
              -f net11.0-android `
              -r android-arm64 `
              --no-restore

          if ($LASTEXITCODE -ne 0) {
              throw "Subsystem Android ARM64 build failed."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Subsystem Android ARM64 build succeeded"
          Write-Host "=========================================="
      # ============================================================
      # 21. Locate produced APK
      # ============================================================

      - name: Locate Android APK
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Locating Android APK"
          Write-Host "=========================================="

          $apkFiles = @(
            Get-ChildItem `
              -Path . `
              -Recurse `
              -Filter "*.apk" `
              -File `
              -ErrorAction SilentlyContinue
          )

          if ($apkFiles.Count -eq 0) {
            Write-Host ""
            Write-Host "Build output:"

            Get-ChildItem `
              ".\bin" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            throw "No APK was produced."
          }

          foreach ($apk in $apkFiles) {
            Write-Host ""
            Write-Host "APK:"
            Write-Host $apk.FullName
            Write-Host "Size: $($apk.Length) bytes"
          }

          Where-Object {
              $_.FullName -match "arm64|android-arm64"
            } |
            Select-Object -First 1

          if (-not $arm64Apk) {
            $arm64Apk = $apkFiles |
              Sort-Object Length -Descending |
              Select-Object -First 1
          }

          if (-not $arm64Apk) {
            throw "Could not select an Android APK."
          }

          $artifactDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifacts"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $artifactDirectory |
            Out-Null

          $artifactPath = Join-Path `
            $artifactDirectory `
            "Subsystem-Android-ARM64.apk"
            Copy-Item `
            $arm64Apk.FullName `
            $artifactPath `
            -Force

          Write-Host ""
          Write-Host "Selected APK:"
          Write-Host $arm64Apk.FullName

          Write-Host ""
          Write-Host "Artifact:"
          Write-Host $artifactPath

      # ============================================================
      # 22. Upload APK
      # ============================================================

      - name: Upload Android ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Subsystem-Android-ARM64
          path: artifacts/Subsystem-Android-ARM64.apk
          if-no-files-found: error
          retention-days: 14
          # ============================================================
      # 23. Diagnostic dump on failure
      # ============================================================

      - name: Dump build diagnostics on failure
        if: failure()
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "BUILD FAILURE DIAGNOSTICS"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Subsystem commit:"
          Write-Host "$env:SUBSYSTEM_COMMIT"

          Write-Host ""
          Write-Host "Project:"
          Write-Host "$env:SUBSYSTEM_PROJECT"

          Write-Host ""
          Write-Host "Toolchain:"
          Write-Host "DOTNET_VERSION=$env:DOTNET_VERSION"
          Write-Host "ANDROID_NDK_VERSION=$env:ANDROID_NDK_VERSION"
          Write-Host "MIN_ANDROID_API=$env:MIN_ANDROID_API"
          Write-Host "TARGET_ANDROID_API=$env:TARGET_ANDROID_API"
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_NDK_HOME=$env:ANDROID_NDK_HOME"

          Write-Host ""
          Write-Host "Project target frameworks:"

          try {
            [xml]$xml = Get-Content `
              ".\subsystem.master.csproj" `
              -Raw

            @(
              $xml.Project.PropertyGroup.TargetFrameworks
            ) -join ";"
          }
          catch {
            Write-Host "Could not parse project XML."
          }

          Write-Host ""
          Write-Host "Diagnostics source files:"

          Get-ChildItem `
            ".\src\runspace\Diagnostics" `
            -Filter "*.cs" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length
            Write-Host ""
          Write-Host "Android source files referencing known symbols:"

          $patterns = @(
            "Dg",
            "AgentSettings",
            "PackageInfoDb",
            "SqliteProbe",
            "PackageInfo",
            "Resource",
            "SetBackground"
          )

          foreach ($pattern in $patterns) {

            Write-Host ""
            Write-Host "----- $pattern -----"

            Get-ChildItem `
              ".\src\runspace" `
              -Recurse `
              -Filter "*.cs" `
              -File `
              -ErrorAction SilentlyContinue |
              Select-String `
                -Pattern "\b$pattern\b" `
                -SimpleMatch:$false |
              Select-Object `
                Path,
                LineNumber,
                Line
          }

          Write-Host ""
          Write-Host "Recent build outputs:"

          Get-ChildItem `
            ".\bin" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 100 `
              FullName,
              Length,
              LastWriteTime
              
