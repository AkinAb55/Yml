name: Build Subsystem Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  DOTNET_VERSION: 11.0.100-preview.5.26302.115
  ANDROID_NDK_VERSION: 27.2.12479018
  MIN_ANDROID_API: 31
  TARGET_ANDROID_API: 36

jobs:
  build-android-arm64:
    name: Build Subsystem Android ARM64
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # .NET 11
      # ============================================================

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ============================================================
      # Android SDK / Java
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # Android SDK packages
      # ============================================================

      - name: Install Android SDK packages
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Installing Android SDK"
          Write-Host "=========================================="

          Write-Host "ANDROID_HOME: $env:ANDROID_HOME"

          if (-not $env:ANDROID_HOME) {
            throw "ANDROID_HOME is not defined."
          }

          sdkmanager --version

          sdkmanager `
            "platform-tools" `
            "platforms;android-$env:TARGET_ANDROID_API" `
            "build-tools;36.0.0" `
            "ndk;$env:ANDROID_NDK_VERSION"

          sdkmanager --licenses | Out-Null

      # ============================================================
      # Android toolchain validation
      # ============================================================

      - name: Validate Android toolchain
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Android toolchain"
          Write-Host "=========================================="

          Write-Host "ANDROID_HOME: $env:ANDROID_HOME"
          Write-Host "Minimum API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"
          Write-Host "Requested NDK: $env:ANDROID_NDK_VERSION"

          if (-not $env:ANDROID_HOME) {
            throw "ANDROID_HOME is not defined."
          }

          $ndk = Join-Path `
            $env:ANDROID_HOME `
            "ndk\$env:ANDROID_NDK_VERSION"

          Write-Host "Expected NDK: $ndk"

          if (-not (Test-Path $ndk)) {
            Write-Host ""
            Write-Host "Installed NDK directories:"
            Get-ChildItem `
              (Join-Path $env:ANDROID_HOME "ndk") `
              -Directory `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "Android NDK directory was not found: $ndk"
          }

          $env:ANDROID_NDK_HOME = $ndk
          $env:SS_NDK = $ndk

          "ANDROID_NDK_HOME=$ndk" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "SS_NDK=$ndk" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host "NDK found successfully."

          Write-Host ""
          Write-Host "NDK version:"
          & (Join-Path $ndk "source.properties") 2>$null

          Write-Host ""
          Write-Host "Android platforms:"
          Get-ChildItem `
            (Join-Path $env:ANDROID_HOME "platforms") `
            -Directory `
            -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name

      # ============================================================
      # Locate subsystem project
      # ============================================================

      - name: Locate subsystem project
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Locating subsystem.master.csproj"
          Write-Host "=========================================="

          $projectCandidates = @(
            ".\subsystem\subsystem.master.csproj",
            ".\subsystem.master.csproj"
          )

          $projectFile = $null

          foreach ($candidate in $projectCandidates) {
            if (Test-Path $candidate) {
              $projectFile = (Resolve-Path $candidate).Path
              break
            }
          }

          if (-not $projectFile) {
            Write-Host ""
            Write-Host "Repository structure:"
            Get-ChildItem `
              -Path . `
              -Recurse `
              -Filter "subsystem.master.csproj" `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "subsystem.master.csproj could not be located."
          }

          Write-Host "Project:"
          Write-Host $projectFile

          $projectDirectory = Split-Path $projectFile -Parent

          Write-Host "Project directory:"
          Write-Host $projectDirectory

          "SUBSYSTEM_PROJECT=$projectFile" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "SUBSYSTEM_DIR=$projectDirectory" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      # ============================================================
      # Validate project XML
      # ============================================================

      - name: Validate subsystem project
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Validating subsystem.master.csproj"
          Write-Host "=========================================="

          if (-not $env:SUBSYSTEM_PROJECT) {
            throw "SUBSYSTEM_PROJECT is not defined."
          }

          if (-not (Test-Path $env:SUBSYSTEM_PROJECT)) {
            throw "Project does not exist: $env:SUBSYSTEM_PROJECT"
          }

          Write-Host "Project: $env:SUBSYSTEM_PROJECT"

          try {
            [xml]$projectXml = Get-Content `
              -Path $env:SUBSYSTEM_PROJECT `
              -Raw
          }
          catch {
            throw "subsystem.master.csproj is not valid XML: $($_.Exception.Message)"
          }

          Write-Host "Project XML is valid."

          $targetFrameworks = `
            $projectXml.Project.PropertyGroup.TargetFrameworks

          if (-not $targetFrameworks) {
            throw "TargetFrameworks element was not found."
          }

          Write-Host "TargetFrameworks: $targetFrameworks"

          if ($targetFrameworks -notmatch "net11\.0-android") {
            throw "net11.0-android target framework is missing."
          }

          $androidPropertyGroups = @(
            $projectXml.Project.PropertyGroup |
              Where-Object {
                $_.Condition -eq "'`$(TargetFramework)' == 'net11.0-android'"
              }
          )

          if ($androidPropertyGroups.Count -eq 0) {
            throw "Android PropertyGroup was not found."
          }

          Write-Host "Android PropertyGroup confirmed."

          Write-Host ""
          Write-Host "Project validation succeeded."

      # ============================================================
      # Prepare Android build environment
      # ============================================================

      - name: Configure Android build environment
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Android build configuration"
          Write-Host "=========================================="

          Write-Host "Target framework: net11.0-android"
          Write-Host "Minimum Android API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"
          Write-Host "Runtime: android-arm64"
          Write-Host "ABI: arm64-v8a"

          $ndk = Join-Path `
            $env:ANDROID_HOME `
            "ndk\$env:ANDROID_NDK_VERSION"

          if (-not (Test-Path $ndk)) {
            throw "NDK does not exist: $ndk"
          }

          $nativeLibrary = Join-Path `
            $env:SUBSYSTEM_DIR `
            "src\runspace\libs\arm64-v8a\libpsl-android.so"

          if (Test-Path $nativeLibrary) {
            Write-Host "Native library: present"
            Write-Host $nativeLibrary
          }
          else {
            Write-Host "Native library: not present"
            Write-Host "Continuing because the project may generate/provide it separately."
          }

          "SS_ANDROID=$env:ANDROID_HOME" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      # ============================================================
      # Restore
      # ============================================================

      - name: Restore Android dependencies
        working-directory: ${{ env.SUBSYSTEM_DIR }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Restoring Android dependencies"
          Write-Host "=========================================="

          dotnet restore .\subsystem.master.csproj `
            -p:TargetFramework=net11.0-android `
            -r android-arm64 `
            -p:SupportedOSPlatformVersion=31.0 `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"

          if ($LASTEXITCODE -ne 0) {
            throw "Android dependency restore failed."
          }

      # ============================================================
      # Inspect Compile items
      #
      # IMPORTANT:
      # Do not manually add Diagnostics/*.cs.
      # SDK default Compile items already include them.
      # ============================================================

      - name: Verify Android Compile items
        working-directory: ${{ env.SUBSYSTEM_DIR }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Checking Android Compile items"
          Write-Host "=========================================="

          $compileList = dotnet msbuild `
            .\subsystem.master.csproj `
            -p:TargetFramework=net11.0-android `
            -p:SupportedOSPlatformVersion=31.0 `
            -getItem:Compile

          if ($LASTEXITCODE -ne 0) {
            throw "Could not query MSBuild Compile items."
          }

          $compileText = $compileList | Out-String

          $requiredCompileFiles = @(
            "Dg.cs",
            "AgentSettings.cs",
            "PackageInfoDb.cs",
            "SqliteProbe.cs"
          )

          foreach ($name in $requiredCompileFiles) {
            if ($compileText -notmatch [regex]::Escape($name)) {
              throw "$name is NOT part of the Android Compile items."
            }

            Write-Host "Compile item confirmed: $name"
          }

          Write-Host ""
          Write-Host "All required Diagnostics files are included."
          Write-Host "No explicit duplicate Compile entries will be added."

      # ============================================================
      # Build
      # ============================================================

      - name: Build Subsystem Android ARM64
        working-directory: ${{ env.SUBSYSTEM_DIR }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Building Subsystem for Android ARM64"
          Write-Host "=========================================="

          Write-Host "Minimum Android API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"
          Write-Host "Runtime: android-arm64"
          Write-Host "ABI: arm64-v8a"

          dotnet build .\subsystem.master.csproj `
            -c Release `
            -f net11.0-android `
            -r android-arm64 `
            --no-restore `
            -p:SubsystemRelease=true `
            -p:SupportedOSPlatformVersion=31.0 `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"

          if ($LASTEXITCODE -ne 0) {
            throw "Android ARM64 compilation failed."
          }

          Write-Host ""
          Write-Host "Android ARM64 compilation succeeded."

      # ============================================================
      # Locate output
      # ============================================================

      - name: Locate Android output
        working-directory: ${{ env.SUBSYSTEM_DIR }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Android build output"
          Write-Host "=========================================="

          $outputFiles = Get-ChildItem `
            -Path . `
            -Recurse `
            -File `
            -Include *.apk,*.aab,*.dll `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "bin" -and
              $_.FullName -notmatch "\\obj\\"
            }

          if ($outputFiles) {
            $outputFiles |
              Select-Object FullName, Length |
              Format-Table -AutoSize
          }
          else {
            Write-Host "No final APK/AAB/DLL output was found."
          }

      # ============================================================
      # Upload artifacts
      # ============================================================

      - name: Upload Android artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: subsystem-android-arm64
          path: |
            subsystem/bin/**/*.apk
            subsystem/bin/**/*.aab
            subsystem/bin/**/*.dll
          if-no-files-found: warn
