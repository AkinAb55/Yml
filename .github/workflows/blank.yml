name: Build GenieX Chat Android

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: apps/v0.34.0/geniex_chat_android
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.13"
  ANDROID_API: "34"
  ANDROID_NDK_VERSION: "27.3.13750724"

jobs:
  build:
    name: Build GenieX Chat APK
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout Qualcomm AI Hub Apps
      # ============================================================
      - name: Checkout Qualcomm AI Hub Apps
        uses: actions/checkout@v4
        with:
          repository: qualcomm/ai-hub-apps
          ref: apps/v0.34.0
          fetch-depth: 1

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ============================================================
      # 3. Gradle
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ============================================================
      # 4. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 5. Install required Android SDK components
      # ============================================================
      - name: Install Android SDK 34 and NDK
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ============================================================
      # 6. Verify project structure
      # ============================================================
      - name: Verify Qualcomm project
        shell: bash
        run: |
          set -euxo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Application directory:"
          ls -la "${APP_DIR}"

          echo
          echo "Required files:"
          test -f "${APP_DIR}/build.gradle"
          test -f "${APP_DIR}/settings.gradle"
          test -f "${APP_DIR}/gradle.properties"

          echo
          echo "Checking source:"
          test -d "${APP_DIR}/src"

          echo
          echo "Checking shared Android files:"
          find . -path "*/_shared/android/*" -maxdepth 8 -type f | sort || true

      # ============================================================
      # 7. Show toolchain versions
      # ============================================================
      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          java -version
          gradle --version

          echo
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          echo
          echo "Installed NDK:"
          ls -la "${ANDROID_SDK_ROOT}/ndk"

          echo
          echo "Installed Android platforms:"
          ls -la "${ANDROID_SDK_ROOT}/platforms"

      # ============================================================
      # 8. Check Gradle configuration
      # ============================================================
      - name: Gradle configuration check
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            tasks

      # ============================================================
      # 9. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            assembleDebug

      # ============================================================
      # 10. Verify APK
      # ============================================================
      - name: Verify APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "APK files:"
          find build/outputs/apk -type f -name "*.apk" -print

          APK="build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo
          echo "APK information:"
          ls -lh "$APK"

          echo
          echo "APK SHA256:"
          sha256sum "$APK"

      # ============================================================
      # 11. Upload APK
      # ============================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: geniex-chat-android-debug
          path: ${{ env.APP_DIR }}/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 12. Upload mapping/build outputs if present
      # ============================================================
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: geniex-chat-android-build-outputs
          path: |
            ${{ env.APP_DIR }}/build/outputs/**
            ${{ env.APP_DIR }}/build/intermediates/**/apk/**
          if-no-files-found: warn
          retention-days: 7