name: Build Subsystem Android 12 ARM64

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  DOTNET_VERSION: 11.0.100-preview.5.26302.115
  ANDROID_NDK_VERSION: 27.2.12479018
  MIN_ANDROID_API: 31
  TARGET_ANDROID_API: 36

jobs:
  build:
    name: Build Subsystem ARM64 APK for Android 12+
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Checkout workflow repository
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. Clone official Subsystem
      #
      # IMPORTANT:
      # The workflow repository intentionally does NOT contain
      # subsystem.master.csproj.
      #
      # The actual source is obtained from upstream.
      # ============================================================

      - name: Clone official Subsystem
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Cloning official Subsystem"
          Write-Host "=========================================="

          if (Test-Path ".\subsystem") {
            Remove-Item ".\subsystem" -Recurse -Force
          }

          git clone `
            --depth 1 `
            https://github.com/MansfieldPlumbing/Subsystem.git `
            subsystem

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone official Subsystem."
          }

          if (-not (Test-Path ".\subsystem")) {
            throw "Subsystem directory was not created."
          }

          Write-Host ""
          Write-Host "Subsystem cloned successfully."

          $gitHead = git -C ".\subsystem" rev-parse HEAD

          Write-Host "Subsystem commit:"
          Write-Host $gitHead

          "SUBSYSTEM_COMMIT=$gitHead" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 3. Locate project
      # ============================================================

      - name: Locate Subsystem project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Locating subsystem.master.csproj"
          Write-Host "=========================================="

          $projectFile = Join-Path `
            $env:GITHUB_WORKSPACE `
            "subsystem\subsystem.master.csproj"

          if (-not (Test-Path $projectFile)) {

            Write-Host ""
            Write-Host "Repository contents:"

            Get-ChildItem `
              -Path (Join-Path $env:GITHUB_WORKSPACE "subsystem") `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -First 200 -ExpandProperty FullName

            throw "Official Subsystem clone does not contain subsystem.master.csproj."
          }

          $projectFile = (Resolve-Path $projectFile).Path
          $projectDirectory = Split-Path $projectFile -Parent

          Write-Host "Project:"
          Write-Host $projectFile

          Write-Host ""
          Write-Host "Project directory:"
          Write-Host $projectDirectory

          "SUBSYSTEM_PROJECT=$projectFile" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "SUBSYSTEM_DIR=$projectDirectory" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 4. Setup .NET
      # ============================================================

      - name: Setup .NET 11 Preview
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ============================================================
      # 5. Setup JDK
      #
      # Keep Java 17 for maximum compatibility with the current
      # Android/.NET toolchain on the hosted Windows runner.
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'

      # ============================================================
      # 6. Setup Android SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 7. Install Android SDK / NDK
      # ============================================================

      - name: Install Android SDK components
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Installing Android toolchain"
          Write-Host "=========================================="

          Write-Host "ANDROID_HOME:"
          Write-Host $env:ANDROID_HOME

          $sdkmanager = Join-Path `
            $env:ANDROID_HOME `
            "cmdline-tools\latest\bin\sdkmanager.bat"

          if (-not (Test-Path $sdkmanager)) {
            throw "sdkmanager not found: $sdkmanager"
          }

          & $sdkmanager `
            "platform-tools" `
            "platforms;android-$env:TARGET_ANDROID_API" `
            "build-tools;36.0.0" `
            "ndk;$env:ANDROID_NDK_VERSION"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK/NDK installation failed."
          }

      # ============================================================
      # 8. Accept Android licenses
      # ============================================================

      - name: Accept Android SDK licenses
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdkmanager = Join-Path `
            $env:ANDROID_HOME `
            "cmdline-tools\latest\bin\sdkmanager.bat"

          if (-not (Test-Path $sdkmanager)) {
            throw "sdkmanager not found."
          }

          1..50 |
            ForEach-Object { "y" } |
            & $sdkmanager --licenses

          if ($LASTEXITCODE -ne 0) {
            throw "Android license acceptance failed."
          }

      # ============================================================
      # 9. Configure NDK
      # ============================================================

      - name: Configure Android NDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Android toolchain"
          Write-Host "=========================================="

          $ndk = Join-Path `
            $env:ANDROID_HOME `
            "ndk\$env:ANDROID_NDK_VERSION"

          Write-Host "ANDROID_HOME: $env:ANDROID_HOME"
          Write-Host "NDK: $ndk"
          Write-Host "Minimum API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"

          if (-not (Test-Path $ndk)) {
            Write-Host ""
            Write-Host "Installed NDK directories:"

            $ndkRoot = Join-Path `
              $env:ANDROID_HOME `
              "ndk"

            if (Test-Path $ndkRoot) {
              Get-ChildItem `
                $ndkRoot `
                -Directory |
                Select-Object -ExpandProperty FullName
            }

            throw "Android NDK directory was not found: $ndk"
          }

          "ANDROID_NDK_HOME=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "SS_NDK=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "ANDROID_NDK_HOME=$ndk"
          Write-Host "SS_NDK=$ndk"

      # ============================================================
      # 10. Show complete toolchain
      # ============================================================

      - name: Show toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host ".NET"
          Write-Host "=========================================="

          dotnet --info

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Java"
          Write-Host "=========================================="

          java -version

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Android"
          Write-Host "=========================================="

          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
          Write-Host "ANDROID_NDK_HOME=$env:ANDROID_NDK_HOME"
          Write-Host "SS_NDK=$env:SS_NDK"

      # ============================================================
      # 11. Inspect source tree
      #
      # This is deliberately diagnostic.
      # We do not modify source here.
      # ============================================================

      - name: Inspect Subsystem source tree
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Repository inspection"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Project:"
          Write-Host $env:SUBSYSTEM_PROJECT

          Write-Host ""
          Write-Host "Top-level entries:"

          Get-ChildItem |
            Select-Object Mode, Name, FullName

          Write-Host ""
          Write-Host "C# projects:"

          $projects = Get-ChildItem `
            -Recurse `
            -Filter "*.csproj" `
            -File `
            -ErrorAction SilentlyContinue

          if ($projects.Count -eq 0) {
            throw "No .csproj files were found in the official Subsystem source tree."
          }

          $projects |
            Select-Object -ExpandProperty FullName

          Write-Host ""
          Write-Host "Target project exists."

      # ============================================================
      # 12. Validate project XML
      #
      # IMPORTANT:
      # No XML modifications.
      # ============================================================

      - name: Validate subsystem.master.csproj
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Validating subsystem.master.csproj"
          Write-Host "=========================================="

          $projectFile = ".\subsystem.master.csproj"

          if (-not (Test-Path $projectFile)) {
            throw "Project does not exist: $projectFile"
          }

          try {
            [xml]$projectXml = Get-Content `
              $projectFile `
              -Raw
          }
          catch {
            throw "subsystem.master.csproj is not valid XML: $($_.Exception.Message)"
          }

          Write-Host "Project XML is valid."

          $targetFrameworks = @(
            $projectXml.Project.PropertyGroup.TargetFrameworks
          ) -join ";"

          Write-Host "TargetFrameworks: $targetFrameworks"

          if ($targetFrameworks -notmatch "net11\.0-android") {
            throw "net11.0-android target framework is missing."
          }

          Write-Host ""
          Write-Host "Android target framework confirmed."

          Write-Host ""
          Write-Host "Android PropertyGroups:"

          $androidGroups = @(
            $projectXml.Project.PropertyGroup |
              Where-Object {
                $_.Condition -like "*TargetFramework*android*"
              }
          )

          if ($androidGroups.Count -eq 0) {
            Write-Host "WARNING: no explicit Android PropertyGroup detected."
          }
          else {
            foreach ($group in $androidGroups) {
              Write-Host $group.OuterXml
            }
          }

      # ============================================================
      # 13. Inspect Diagnostics sources
      #
      # We need the real namespaces/API before introducing any
      # compatibility code.
      # ============================================================

      - name: Inspect Diagnostics source definitions
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Inspecting Diagnostics source definitions"
          Write-Host "=========================================="

          $diagnosticsDirectory = ".\src\runspace\Diagnostics"

          if (-not (Test-Path $diagnosticsDirectory)) {
            throw "Diagnostics directory not found: $diagnosticsDirectory"
          }

          $diagnosticFiles = Get-ChildItem `
            $diagnosticsDirectory `
            -Filter "*.cs" `
            -File

          if ($diagnosticFiles.Count -eq 0) {
            throw "No Diagnostics C# files found."
          }

          foreach ($file in $diagnosticFiles) {

            Write-Host ""
            Write-Host "------------------------------------------"
            Write-Host $file.FullName
            Write-Host "------------------------------------------"

            $text = Get-Content `
              $file.FullName `
              -Raw

            $namespaceMatches = [regex]::Matches(
              $text,
              '(?m)^\s*namespace\s+([A-Za-z0-9_.]+)'
            )

            foreach ($match in $namespaceMatches) {
              Write-Host "namespace: $($match.Groups[1].Value)"
            }

            $typeMatches = [regex]::Matches(
              $text,
              '(?m)^\s*(?:public\s+|internal\s+|file\s+|static\s+|sealed\s+|partial\s+|abstract\s+)*(class|struct|interface|enum)\s+([A-Za-z0-9_]+)'
            )

            foreach ($match in $typeMatches) {
              Write-Host "type: $($match.Groups[2].Value)"
            }
          }

      # ============================================================
      # 14. Inspect known failing references
      #
      # This gives us the actual reason for missing Dg,
      # PackageInfoDb, AgentSettings, etc., instead of guessing.
      # ============================================================

      - name: Inspect Android compile references
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Inspecting Android source references"
          Write-Host "=========================================="

          $patterns = @(
            "Dg",
            "AgentSettings",
            "PackageInfoDb",
            "SqliteProbe",
            "PackageInfo",
            "Resource",
            "SetBackground"
          )

          foreach ($pattern in $patterns) {

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "References: $pattern"
            Write-Host "=========================================="

            Get-ChildItem `
              ".\src\runspace" `
              -Recurse `
              -Filter "*.cs" `
              -File |
              Select-String `
                -Pattern "\b$pattern\b" `
                -SimpleMatch:$false |
              Select-Object `
                Path,
                LineNumber,
                Line
          }

      # ============================================================
      # 15. Install Android workload
      # ============================================================

      - name: Install .NET Android workload
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Installing .NET Android workload"
          Write-Host "=========================================="

          dotnet workload install android

          if ($LASTEXITCODE -ne 0) {
            throw "Android workload installation failed."
          }

          dotnet workload list

      # ============================================================
      # 16. Restore
      #
      # Restore is separate so failures are easier to distinguish
      # from compilation failures.
      # ============================================================

      - name: Restore Subsystem Android
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Restoring Subsystem Android"
          Write-Host "=========================================="

          dotnet restore `
            ".\subsystem.master.csproj" `
            -p:TargetFramework=net11.0-android `
            -r android-arm64

          if ($LASTEXITCODE -ne 0) {
            throw "Android restore failed."
          }

      # ============================================================
      # 17. Build native PowerShell Android library
      # ============================================================

      - name: Build native PowerShell Android library
        shell: pwsh
        working-directory: subsystem\src\runspace\native
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Building native PowerShell Android library"
          Write-Host "=========================================="

          $nativeScript = ".\build-native.ps1"

          if (-not (Test-Path $nativeScript)) {
            throw "Native build script not found: $nativeScript"
          }

          & $nativeScript

          if ($LASTEXITCODE -ne 0) {
            throw "Native PowerShell build failed."
          }

          $nativeLib = ".\libs\arm64-v8a\libpsl-android.so"

          if (-not (Test-Path $nativeLib)) {
            Write-Host ""
            Write-Host "Native library tree:"

            Get-ChildItem `
              ".\libs" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            throw "Native library was not created: $nativeLib"
          }

          $size = (Get-Item $nativeLib).Length

          if ($size -lt 1000) {
            throw "Native library looks suspiciously small: $size bytes"
          }

          Write-Host "Native library created."
          Write-Host "Size: $size bytes"

      # ============================================================
      # 18. Prepare native library
      # ============================================================

      - name: Prepare native library
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          $source = `
            ".\src\runspace\native\libs\arm64-v8a\libpsl-android.so"

          $destination = `
            ".\src\runspace\libs\arm64-v8a\libpsl-android.so"

          if (-not (Test-Path $source)) {
            throw "Native library source not found: $source"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\src\runspace\libs\arm64-v8a" |
            Out-Null

          Copy-Item `
            -Path $source `
            -Destination $destination `
            -Force

          if (-not (Test-Path $destination)) {
            throw "Native library was not copied."
          }

          $size = (Get-Item $destination).Length

          Write-Host "Prepared native library."
          Write-Host "Size: $size bytes"

      # ============================================================
      # 19. Final source sanity check
      # ============================================================

      - name: Final source sanity check
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Final source sanity check"
          Write-Host "=========================================="

          $required = @(
            ".\subsystem.master.csproj",
            ".\src\runspace\native\libs\arm64-v8a\libpsl-android.so"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required build input missing: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "No project XML modifications were performed."
          Write-Host "No explicit Compile items were injected."
          Write-Host "SDK default Compile discovery remains enabled."
        
       # ============================================================
      # 20. Prepare and build Android ARM64
      #
      # IMPORTANT:
      # - SDK default Compile discovery remains ENABLED.
      # - Diagnostics/*.cs are NOT explicitly included.
      # - Only Windows source files are removed for Android.
      # - Dg and other Diagnostics namespaces are corrected.
      # ============================================================

      - name: Build Subsystem for Android ARM64
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Preparing Subsystem Android ARM64 build"
          Write-Host "=========================================="

          # --------------------------------------------------------
          # 20.1 Restore original project file
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Restoring upstream subsystem.master.csproj..."

          git checkout -- subsystem.master.csproj

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to restore subsystem.master.csproj."
          }

          if (-not (Test-Path ".\subsystem.master.csproj")) {
            throw "subsystem.master.csproj was not found."
          }

          Write-Host "Upstream project file restored."

          # --------------------------------------------------------
          # 20.2 Load project XML
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Loading project XML..."

          $projectFile = ".\subsystem.master.csproj"

          [xml]$projectXml = Get-Content `
            $projectFile `
            -Raw

          $projectRoot = $projectXml.DocumentElement

          if ($null -eq $projectRoot) {
            throw "Project XML root element was not found."
          }

          $namespaceUri = $projectRoot.NamespaceURI

          Write-Host "Project XML loaded."

          # --------------------------------------------------------
          # 20.3 Find or create Android PropertyGroup
          #
          # We use a literal XML condition.
          # This is NOT interpreted by PowerShell.
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Configuring Android build properties..."

          $androidCondition = "'`$(TargetFramework)' == 'net11.0-android'"

          $androidPropertyGroup = $projectRoot.PropertyGroup |
            Where-Object {
              $_.Condition -eq $androidCondition
            } |
            Select-Object -First 1

          if ($null -eq $androidPropertyGroup) {

            $androidPropertyGroup = $projectXml.CreateElement(
              "PropertyGroup",
              $namespaceUri
            )

            $androidPropertyGroup.SetAttribute(
              "Condition",
              $androidCondition
            )

            [void]$projectRoot.AppendChild(
              $androidPropertyGroup
            )

            Write-Host "Created Android PropertyGroup."
          }
          else {
            Write-Host "Android PropertyGroup already exists."
          }

          # --------------------------------------------------------
          # 20.4 Configure Android API
          # --------------------------------------------------------

          $supportedApi = "$env:MIN_ANDROID_API.0"

          $supportedElement = $androidPropertyGroup.SelectSingleNode(
            "*[local-name()='SupportedOSPlatformVersion']"
          )

          if ($null -eq $supportedElement) {

            $supportedElement = $projectXml.CreateElement(
              "SupportedOSPlatformVersion",
              $namespaceUri
            )

            [void]$androidPropertyGroup.AppendChild(
              $supportedElement
            )
          }

          $supportedElement.InnerText = $supportedApi

          Write-Host "SupportedOSPlatformVersion=$supportedApi"

          # --------------------------------------------------------
          # 20.5 Configure ONLY Compile Remove rules
          #
          # DO NOT add Compile Include here.
          #
          # Diagnostics files are already discovered automatically
          # by the .NET SDK.
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Configuring Android Compile Remove rules..."

          $removePaths = @(
            "src\runspace\windows\**\*.cs",
            "src\shell\platform\Windows\**\*.cs"
          )

          $compileItemGroup = $null

          foreach ($group in $projectRoot.ItemGroup) {

            $hasAndroidRemove = $false

            foreach ($compileNode in @(
              $group.ChildNodes |
                Where-Object {
                  $_.LocalName -eq "Compile"
                }
            )) {

              $removeValue = $compileNode.GetAttribute("Remove")

              if ($removeValue -in $removePaths) {
                $hasAndroidRemove = $true
                break
              }
            }

            if ($hasAndroidRemove) {
              $compileItemGroup = $group
              break
            }
          }

          if ($null -eq $compileItemGroup) {

            $compileItemGroup = $projectXml.CreateElement(
              "ItemGroup",
              $namespaceUri
            )

            $compileItemGroup.SetAttribute(
              "Condition",
              $androidCondition
            )

            [void]$projectRoot.AppendChild(
              $compileItemGroup
            )

            Write-Host "Created Android Compile Remove ItemGroup."
          }

          foreach ($removePath in $removePaths) {

            $alreadyExists = $false

            foreach ($compileNode in @(
              $compileItemGroup.ChildNodes |
                Where-Object {
                  $_.LocalName -eq "Compile"
                }
            )) {

              if ($compileNode.GetAttribute("Remove") -eq $removePath) {
                $alreadyExists = $true
                break
              }
            }

            if (-not $alreadyExists) {

              Write-Host ""
              Write-Host "Removing Windows source:"
              Write-Host "  $removePath"

              $compile = $projectXml.CreateElement(
                "Compile",
                $namespaceUri
              )

              $compile.SetAttribute(
                "Remove",
                $removePath
              )

              [void]$compileItemGroup.AppendChild(
                $compile
              )
            }
            else {
              Write-Host ""
              Write-Host "Compile Remove already exists:"
              Write-Host "  $removePath"
            }
          }

          # --------------------------------------------------------
          # 20.6 Save project XML
          # --------------------------------------------------------

          $projectXml.Save(
            (Resolve-Path $projectFile).Path
          )

          Write-Host ""
          Write-Host "Compile Remove rules configured."

          # --------------------------------------------------------
          # 20.7 Verify Compile rules
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Verifying project XML"
          Write-Host "=========================================="

          [xml]$verifyXml = Get-Content `
            $projectFile `
            -Raw

          $allCompileNodes = @(
            $verifyXml.Project.ItemGroup.Compile
          )

          $compileIncludes = @(
            $allCompileNodes |
              Where-Object {
                $_.Include
              }
          )

          $compileRemoves = @(
            $allCompileNodes |
              Where-Object {
                $_.Remove
              }
          )

          Write-Host ""
          Write-Host "Compile Include entries:"
          Write-Host $compileIncludes.Count

          Write-Host ""
          Write-Host "Compile Remove entries:"

          foreach ($node in $compileRemoves) {
            Write-Host "  Remove=$($node.Remove)"
          }

          # --------------------------------------------------------
          # IMPORTANT:
          # We deliberately do NOT add Diagnostics files as
          # Compile Include entries.
          #
          # This prevents NETSDK1022.
          # --------------------------------------------------------

          $diagnosticsFiles = @(
            "AgentSettings.cs",
            "Dg.cs",
            "PackageInfoDb.cs",
            "SqliteProbe.cs"
          )

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Checking Diagnostics sources"
          Write-Host "=========================================="

          foreach ($fileName in $diagnosticsFiles) {

            $filePath = Join-Path `
              ".\src\runspace\Diagnostics" `
              $fileName

            if (-not (Test-Path $filePath)) {
              throw "Required Diagnostics file not found: $filePath"
            }

            Write-Host "Diagnostics:"
            Write-Host "  $((Resolve-Path $filePath).Path)"
          }

          # --------------------------------------------------------
          # 20.8 Inspect Dg namespace
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Checking Dg namespace"
          Write-Host "=========================================="

          $dgFile = ".\src\runspace\Diagnostics\Dg.cs"

          $dgText = Get-Content `
            $dgFile `
            -Raw

          if ($dgText -notmatch '(?m)^\s*namespace\s+Subsystem\.Diagnostics\b') {
            throw "Dg.cs does not declare namespace Subsystem.Diagnostics."
          }

          Write-Host "Dg namespace confirmed:"
          Write-Host "  Subsystem.Diagnostics"

          # --------------------------------------------------------
          # 20.9 Helper: add using directive when necessary
          # --------------------------------------------------------

          function Add-DiagnosticsUsing {
            param(
              [Parameter(Mandatory = $true)]
              [string]$FilePath
            )

            if (-not (Test-Path $FilePath)) {
              return
            }

            $text = Get-Content `
              $FilePath `
              -Raw

            if ($text -match '(?m)^\s*using\s+Subsystem\.Diagnostics\s*;') {
              return
            }

            if (
              $text -match '\bDg\b' -or
              $text -match '\bAgentSettings\b' -or
              $text -match '\bPackageInfoDb\b' -or
              $text -match '\bPackageInfo\b' -or
              $text -match '\bSqliteProbe\b'
            ) {

              $usingLine = "using Subsystem.Diagnostics;"

              $match = [regex]::Match(
                $text,
                '(?m)^(?:using\s+[^\r\n;]+;\s*\r?\n)+'
              )

              if ($match.Success) {

                $insertPosition = $match.Index + $match.Length

                $text =
                  $text.Insert(
                    $insertPosition,
                    $usingLine + [Environment]::NewLine
                  )
              }
              else {

                $text =
                  $usingLine +
                  [Environment]::NewLine +
                  [Environment]::NewLine +
                  $text
              }

              Set-Content `
                -Path $FilePath `
                -Value $text `
                -Encoding utf8 `
                -NoNewline

              Write-Host "Added using Subsystem.Diagnostics:"
              Write-Host "  $FilePath"
            }
          }

          # --------------------------------------------------------
          # 20.10 Fix obsolete fully-qualified Dg references
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Fixing Diagnostics references"
          Write-Host "=========================================="

          $sourceFiles = @(
            Get-ChildItem `
              ".\src\runspace" `
              -Recurse `
              -Filter "*.cs" `
              -File `
              -ErrorAction SilentlyContinue
          )

          foreach ($file in $sourceFiles) {

            $text = Get-Content `
              $file.FullName `
              -Raw

            $originalText = $text

            # Fix namespace-qualified obsolete references.
            $text = $text.Replace(
              "Subsystem.Dg.",
              "Subsystem.Diagnostics.Dg."
            )

            # Fix explicit type references.
            $text = $text.Replace(
              "Subsystem.PackageInfoDb",
              "Subsystem.Diagnostics.PackageInfoDb"
            )

            $text = $text.Replace(
              "Subsystem.PackageInfo",
              "Subsystem.Diagnostics.PackageInfo"
            )

            $text = $text.Replace(
              "Subsystem.SqliteProbe",
              "Subsystem.Diagnostics.SqliteProbe"
            )

            if ($text -ne $originalText) {

              Set-Content `
                -Path $file.FullName `
                -Value $text `
                -Encoding utf8 `
                -NoNewline

              Write-Host "Fixed Diagnostics namespace references:"
              Write-Host "  $($file.FullName)"
            }
          }

          # --------------------------------------------------------
          # 20.11 Add Diagnostics using directives
          # --------------------------------------------------------

          foreach ($file in $sourceFiles) {
            Add-DiagnosticsUsing `
              -FilePath $file.FullName
          }

          # --------------------------------------------------------
          # 20.12 Fix Android SessionManager.SetBackground
          #
          # This API is unavailable in the Android build.
          # Remove only the actual call, not the whole method.
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Checking SessionManager.SetBackground"
          Write-Host "=========================================="

          $sessionFile = ".\src\runspace\Pwsh\Cmdlets\SessionCmdlets.cs"

          if (Test-Path $sessionFile) {

            $sessionText = Get-Content `
              $sessionFile `
              -Raw

            if ($sessionText -match 'SessionManager\.SetBackground\s*\(') {

              $sessionText = [regex]::Replace(
                $sessionText,
                '(?m)^[ \t]*SessionManager\.SetBackground\s*\([^;]*\);\s*\r?\n?',
                ''
              )

              Set-Content `
                -Path $sessionFile `
                -Value $sessionText `
                -Encoding utf8 `
                -NoNewline

              Write-Host "Removed Android-incompatible SetBackground call."
            }
            else {
              Write-Host "No SessionManager.SetBackground call found."
            }
          }

          # --------------------------------------------------------
          # 20.13 Verify no obsolete namespaces remain
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Final Diagnostics reference verification"
          Write-Host "=========================================="

          $obsoletePatterns = @(
            "Subsystem\.Dg\b",
            "Subsystem\.PackageInfoDb\b",
            "Subsystem\.PackageInfo\b",
            "Subsystem\.SqliteProbe\b"
          )

          foreach ($pattern in $obsoletePatterns) {

            $matches = @(
              Get-ChildItem `
                ".\src\runspace" `
                -Recurse `
                -Filter "*.cs" `
                -File `
                -ErrorAction SilentlyContinue |
                Select-String `
                  -Pattern $pattern `
                  -AllMatches
            )

            if ($matches.Count -gt 0) {

              Write-Host ""
              Write-Host "OBSOLETE REFERENCE FOUND:"
              $matches |
                Select-Object Path, LineNumber, Line

              throw "Obsolete Diagnostics namespace reference remains: $pattern"
            }
          }

          Write-Host "No obsolete Diagnostics namespace references remain."

          # --------------------------------------------------------
          # 20.14 Verify Diagnostics files are NOT explicitly
          # included.
          #
          # This is critical to prevent NETSDK1022.
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Checking duplicate Compile entries"
          Write-Host "=========================================="

          [xml]$finalXml = Get-Content `
            $projectFile `
            -Raw

          $diagnosticRelativePaths = @(
            "src\runspace\Diagnostics\AgentSettings.cs",
            "src\runspace\Diagnostics\Dg.cs",
            "src\runspace\Diagnostics\PackageInfoDb.cs",
            "src\runspace\Diagnostics\SqliteProbe.cs"
          )

          foreach ($diagnosticPath in $diagnosticRelativePaths) {

            $duplicateInclude = @(
              $finalXml.Project.ItemGroup.Compile |
                Where-Object {
                  $_.Include -eq $diagnosticPath
                }
            )

            if ($duplicateInclude.Count -gt 0) {

              throw (
                "Duplicate Compile Include found for Diagnostics file: " +
                $diagnosticPath
              )
            }

            Write-Host "OK:"
            Write-Host "  $diagnosticPath"
            Write-Host "  SDK default Compile discovery will include it."
          }

          # --------------------------------------------------------
          # 20.15 Final source verification
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Final Android source verification"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Diagnostics files:"
          foreach ($fileName in $diagnosticsFiles) {
            Write-Host "  $fileName"
          }

          Write-Host ""
          Write-Host "Windows Compile Remove rules:"
          Write-Host "  src\runspace\windows\**\*.cs"
          Write-Host "  src\shell\platform\Windows\**\*.cs"

          Write-Host ""
          Write-Host "SDK default Compile discovery:"
          Write-Host "  ENABLED"

          Write-Host ""
          Write-Host "Explicit Diagnostics Compile Include:"
          Write-Host "  NONE"

          # --------------------------------------------------------
          # 20.16 Check target frameworks
          # --------------------------------------------------------

          $frameworks = @(
            $finalXml.Project.PropertyGroup.TargetFrameworks
          ) -join ";"

          Write-Host ""
          Write-Host "TargetFrameworks:"
          Write-Host "  $frameworks"

          if ($frameworks -notmatch "net11\.0-android") {
            throw "net11.0-android target framework is missing."
          }
          
          # --------------------------------------------------------
          # 20.17 Build Android ARM64
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Building Subsystem for Android ARM64"
          Write-Host "=========================================="

          Write-Host "Minimum Android API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"
          Write-Host "Runtime: android-arm64"
          Write-Host "ABI: arm64-v8a"

          dotnet build `
            ".\subsystem.master.csproj" `
            -c Release `
            -f net11.0-android `
            -r android-arm64 `
            --no-restore `
            -p:SubsystemRelease=true `
            -p:SupportedOSPlatformVersion="$env:MIN_ANDROID_API.0" `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME" `
            -p:EnableDefaultCompileItems=true

          if ($LASTEXITCODE -ne 0) {
            throw "Android ARM64 compilation failed."
          }
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Android ARM64 compilation succeeded."
          Write-Host "=========================================="
     
 # ============================================================
      # 21. Locate produced APK
      # ============================================================

      - name: Locate Android APK
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Locating Android APK"
          Write-Host "=========================================="

          $apkFiles = @(
            Get-ChildItem `
              -Path . `
              -Recurse `
              -Filter "*.apk" `
              -File `
              -ErrorAction SilentlyContinue
          )

          if ($apkFiles.Count -eq 0) {
            Write-Host ""
            Write-Host "Build output:"

            Get-ChildItem `
              ".\bin" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object FullName, Length

            throw "No APK was produced."
          }

          foreach ($apk in $apkFiles) {
            Write-Host ""
            Write-Host "APK:"
            Write-Host $apk.FullName
            Write-Host "Size: $($apk.Length) bytes"
          }

          Where-Object {
              $_.FullName -match "arm64|android-arm64"
            } |
            Select-Object -First 1

          if (-not $arm64Apk) {
            $arm64Apk = $apkFiles |
              Sort-Object Length -Descending |
              Select-Object -First 1
          }

          if (-not $arm64Apk) {
            throw "Could not select an Android APK."
          }

          $artifactDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "artifacts"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $artifactDirectory |
            Out-Null

          $artifactPath = Join-Path `
            $artifactDirectory `
            "Subsystem-Android-ARM64.apk"
            Copy-Item `
            $arm64Apk.FullName `
            $artifactPath `
            -Force

          Write-Host ""
          Write-Host "Selected APK:"
          Write-Host $arm64Apk.FullName

          Write-Host ""
          Write-Host "Artifact:"
          Write-Host $artifactPath

      # ============================================================
      # 22. Upload APK
      # ============================================================

      - name: Upload Android ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Subsystem-Android-ARM64
          path: artifacts/Subsystem-Android-ARM64.apk
          if-no-files-found: error
          retention-days: 14
          # ============================================================
      # 23. Diagnostic dump on failure
      # ============================================================

      - name: Dump build diagnostics on failure
        if: failure()
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "BUILD FAILURE DIAGNOSTICS"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Subsystem commit:"
          Write-Host "$env:SUBSYSTEM_COMMIT"

          Write-Host ""
          Write-Host "Project:"
          Write-Host "$env:SUBSYSTEM_PROJECT"

          Write-Host ""
          Write-Host "Toolchain:"
          Write-Host "DOTNET_VERSION=$env:DOTNET_VERSION"
          Write-Host "ANDROID_NDK_VERSION=$env:ANDROID_NDK_VERSION"
          Write-Host "MIN_ANDROID_API=$env:MIN_ANDROID_API"
          Write-Host "TARGET_ANDROID_API=$env:TARGET_ANDROID_API"
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_NDK_HOME=$env:ANDROID_NDK_HOME"

          Write-Host ""
          Write-Host "Project target frameworks:"

          try {
            [xml]$xml = Get-Content `
              ".\subsystem.master.csproj" `
              -Raw

            @(
              $xml.Project.PropertyGroup.TargetFrameworks
            ) -join ";"
          }
          catch {
            Write-Host "Could not parse project XML."
          }

          Write-Host ""
          Write-Host "Diagnostics source files:"

          Get-ChildItem `
            ".\src\runspace\Diagnostics" `
            -Filter "*.cs" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length
            Write-Host ""
          Write-Host "Android source files referencing known symbols:"

          $patterns = @(
            "Dg",
            "AgentSettings",
            "PackageInfoDb",
            "SqliteProbe",
            "PackageInfo",
            "Resource",
            "SetBackground"
          )

          foreach ($pattern in $patterns) {

            Write-Host ""
            Write-Host "----- $pattern -----"

            Get-ChildItem `
              ".\src\runspace" `
              -Recurse `
              -Filter "*.cs" `
              -File `
              -ErrorAction SilentlyContinue |
              Select-String `
                -Pattern "\b$pattern\b" `
                -SimpleMatch:$false |
              Select-Object `
                Path,
                LineNumber,
                Line
          }

          Write-Host ""
          Write-Host "Recent build outputs:"

          Get-ChildItem `
            ".\bin" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 100 `
              FullName,
              Length,
              LastWriteTime
