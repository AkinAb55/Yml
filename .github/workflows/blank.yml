name: Build Subsystem Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "11.0.100-preview.5.26302.115"
  ANDROID_NDK_VERSION: "27.2.12479018"
  MIN_ANDROID_API: "31"
  TARGET_ANDROID_API: "36"

jobs:
  build-android:
    name: Build Subsystem Android ARM64
    runs-on: windows-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # .NET
      # ============================================================

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}


      # ============================================================
      # Java
      # ============================================================

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "25"


      # ============================================================
      # Diagnostics
      # ============================================================

      - name: Show build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Build environment"
          Write-Host "=========================================="

          Write-Host "OS:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version

          Write-Host ""
          Write-Host "dotnet:"
          dotnet --info

          Write-Host ""
          Write-Host "Java:"
          java -version

          Write-Host ""
          Write-Host "ANDROID_HOME: $env:ANDROID_HOME"

          Write-Host ""
          Write-Host "DOTNET_VERSION: $env:DOTNET_VERSION"
          Write-Host "ANDROID_NDK_VERSION: $env:ANDROID_NDK_VERSION"
          Write-Host "MIN_ANDROID_API: $env:MIN_ANDROID_API"
          Write-Host "TARGET_ANDROID_API: $env:TARGET_ANDROID_API"


      # ============================================================
      # Android SDK / NDK
      #
      # Do NOT assume the requested NDK already exists.
      # GitHub hosted runners may have a different NDK installed.
      # ============================================================

      - name: Configure Android toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Android toolchain"
          Write-Host "=========================================="

          $sdk = $env:ANDROID_HOME

          if ([string]::IsNullOrWhiteSpace($sdk)) {
            throw "ANDROID_HOME is not defined."
          }

          if (-not (Test-Path $sdk)) {
            throw "Android SDK directory was not found: $sdk"
          }

          Write-Host "ANDROID_HOME: $sdk"
          Write-Host "Required NDK: $env:ANDROID_NDK_VERSION"
          Write-Host "Minimum API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"

          # ----------------------------------------------------------
          # Locate sdkmanager
          # ----------------------------------------------------------

          $sdkManagerCandidates = @(
            (Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"),
            (Join-Path $sdk "cmdline-tools\bin\sdkmanager.bat")
          )

          $sdkManager = $sdkManagerCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $sdkManager) {
            Write-Host ""
            Write-Host "Available command-line tools:"

            $cmdlineTools = Join-Path $sdk "cmdline-tools"

            if (Test-Path $cmdlineTools) {
              Get-ChildItem $cmdlineTools -Directory |
                ForEach-Object {
                  Write-Host "  $($_.FullName)"
                }
            }

            throw "sdkmanager.bat was not found."
          }

          Write-Host ""
          Write-Host "sdkmanager: $sdkManager"

          # ----------------------------------------------------------
          # Accept licenses
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Android SDK licenses"
          Write-Host "=========================================="

          1..20 |
            ForEach-Object { "y" } |
            & $sdkManager --licenses 2>$null |
            Out-Null

          # ----------------------------------------------------------
          # Install required Android components
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Installing Android SDK components"
          Write-Host "=========================================="

          $packages = @(
            "platform-tools",
            "platforms;android-$env:TARGET_ANDROID_API",
            "build-tools;35.0.0",
            "ndk;$env:ANDROID_NDK_VERSION"
          )

          Write-Host "Packages:"
          $packages |
            ForEach-Object {
              Write-Host "  $_"
            }

          & $sdkManager $packages

          if ($LASTEXITCODE -ne 0) {
            throw "sdkmanager failed with exit code $LASTEXITCODE."
          }

          # ----------------------------------------------------------
          # Verify requested NDK
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Verifying Android NDK"
          Write-Host "=========================================="

          $ndk = Join-Path `
            $sdk `
            "ndk\$env:ANDROID_NDK_VERSION"

          Write-Host "Expected NDK:"
          Write-Host $ndk

          if (-not (Test-Path $ndk)) {
            Write-Host ""
            Write-Host "Installed NDK directories:"

            $ndkRoot = Join-Path $sdk "ndk"

            if (Test-Path $ndkRoot) {
              Get-ChildItem $ndkRoot -Directory |
                ForEach-Object {
                  Write-Host "  $($_.FullName)"
                }
            }

            throw "Android NDK directory was not found after sdkmanager installation: $ndk"
          }

          $sourceProperties = Join-Path `
            $ndk `
            "source.properties"

          if (-not (Test-Path $sourceProperties)) {
            throw "NDK source.properties was not found: $sourceProperties"
          }

          Write-Host "NDK directory exists."
          Write-Host "source.properties exists."

          Write-Host ""
          Write-Host "NDK version:"
          Get-Content $sourceProperties

          # ----------------------------------------------------------
          # Export environment for following GitHub Actions steps
          # ----------------------------------------------------------

          "ANDROID_NDK_HOME=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "ANDROID_NDK_ROOT=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "SS_NDK=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          # Also expose SDK explicitly.
          "ANDROID_HOME=$sdk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "ANDROID_SDK_ROOT=$sdk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "Android toolchain configured successfully."


      # ============================================================
      # Verify Android toolchain
      # ============================================================

      - name: Verify Android toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Verifying Android toolchain"
          Write-Host "=========================================="

          Write-Host "ANDROID_HOME:"
          Write-Host $env:ANDROID_HOME

          Write-Host ""
          Write-Host "ANDROID_NDK_HOME:"
          Write-Host $env:ANDROID_NDK_HOME

          Write-Host ""
          Write-Host "ANDROID_NDK_ROOT:"
          Write-Host $env:ANDROID_NDK_ROOT

          Write-Host ""
          Write-Host "SS_NDK:"
          Write-Host $env:SS_NDK

          if (-not (Test-Path $env:ANDROID_HOME)) {
            throw "ANDROID_HOME does not exist."
          }

          if (-not (Test-Path $env:ANDROID_NDK_HOME)) {
            throw "ANDROID_NDK_HOME does not exist: $env:ANDROID_NDK_HOME"
          }

          $sourceProperties = Join-Path `
            $env:ANDROID_NDK_HOME `
            "source.properties"

          if (-not (Test-Path $sourceProperties)) {
            throw "NDK source.properties does not exist."
          }

          Write-Host ""
          Write-Host "NDK:"
          Get-Content $sourceProperties

          $adb = Join-Path `
            $env:ANDROID_HOME `
            "platform-tools\adb.exe"

          if (-not (Test-Path $adb)) {
            throw "adb.exe was not found: $adb"
          }

          Write-Host ""
          Write-Host "ADB:"
          & $adb version

          if ($LASTEXITCODE -ne 0) {
            throw "ADB verification failed."
          }

          $androidJar = Join-Path `
            $env:ANDROID_HOME `
            "platforms\android-$env:TARGET_ANDROID_API\android.jar"

          if (-not (Test-Path $androidJar)) {
            throw "Android API $env:TARGET_ANDROID_API android.jar was not found."
          }

          Write-Host ""
          Write-Host "Android SDK platform verified:"
          Write-Host $androidJar

          Write-Host ""
          Write-Host "Android toolchain verification succeeded."


      # ============================================================
      # Validate project
      # ============================================================

      - name: Validate subsystem project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Validating subsystem.master.csproj"
          Write-Host "=========================================="

          $projectFile = `
            (Resolve-Path ".\subsystem.master.csproj").Path

          Write-Host "Project:"
          Write-Host $projectFile

          try {
            [xml]$projectXml = Get-Content `
              $projectFile `
              -Raw
          }
          catch {
            throw "subsystem.master.csproj is not valid XML: $($_.Exception.Message)"
          }

          Write-Host "Project XML is valid."

          $targetFrameworks = `
            $projectXml.Project.PropertyGroup.TargetFrameworks

          if (-not $targetFrameworks) {
            throw "TargetFrameworks element was not found."
          }

          Write-Host ""
          Write-Host "TargetFrameworks:"
          Write-Host $targetFrameworks

          if ($targetFrameworks -notmatch 'net11\.0-android') {
            throw "net11.0-android target framework is missing."
          }

          $androidPropertyGroups = @(
            $projectXml.Project.PropertyGroup |
              Where-Object {
                $_.Condition -eq "'`$(TargetFramework)' == 'net11.0-android'"
              }
          )

          if ($androidPropertyGroups.Count -eq 0) {
            throw "Android PropertyGroup was not found."
          }

          Write-Host "Android PropertyGroup confirmed."

          # ----------------------------------------------------------
          # Important:
          #
          # We deliberately DO NOT require explicit Compile Include
          # entries for normal .cs files.
          #
          # Microsoft.NET.Sdk automatically includes:
          #
          #     **\*.cs
          #
          # Adding those files manually causes NETSDK1022.
          # ----------------------------------------------------------

          $explicitCompile = Select-String `
            -Path $projectFile `
            -Pattern '<Compile\s+Include='

          if ($explicitCompile) {
            Write-Host ""
            Write-Host "Explicit Compile entries currently present:"

            $explicitCompile |
              ForEach-Object {
                Write-Host "  $($_.Line.Trim())"
              }

            Write-Host ""
            Write-Host "These entries are not automatically an error,"
            Write-Host "but normal source files must not be duplicated."
          }

          Write-Host ""
          Write-Host "Project validation succeeded."


      # ============================================================
      # Inspect MSBuild Compile items
      #
      # This is diagnostic only.
      # It does NOT modify the project.
      # ============================================================

      - name: Verify Android Compile items
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Checking Android Compile items"
          Write-Host "=========================================="

          $compileList = `
            dotnet msbuild .\subsystem.master.csproj `
              -p:TargetFramework=net11.0-android `
              -p:RuntimeIdentifier=android-arm64 `
              -getItem:Compile

          if ($LASTEXITCODE -ne 0) {
            throw "Could not query MSBuild Compile items."
          }

          $compileText = $compileList | Out-String

          Write-Host $compileText

          $requiredCompileFiles = @(
            "AgentSettings.cs",
            "Dg.cs",
            "PackageInfoDb.cs",
            "SqliteProbe.cs"
          )

          foreach ($name in $requiredCompileFiles) {

            if ($compileText -notmatch [regex]::Escape($name)) {
              throw "$name is NOT part of the Android Compile items."
            }

            Write-Host "Compile item confirmed: $name"
          }

          Write-Host ""
          Write-Host "All required Diagnostics files are included by MSBuild."


      # ============================================================
      # Restore
      # ============================================================

      - name: Restore Android project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Restoring Subsystem for Android"
          Write-Host "=========================================="

          dotnet restore `
            .\subsystem.master.csproj `
            -p:TargetFramework=net11.0-android `
            -p:RuntimeIdentifier=android-arm64 `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"

          if ($LASTEXITCODE -ne 0) {
            throw "Android restore failed."
          }

          Write-Host ""
          Write-Host "Android restore succeeded."


      # ============================================================
      # Build ARM64
      # ============================================================

      - name: Build Subsystem for Android ARM64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Building Subsystem for Android ARM64"
          Write-Host "=========================================="

          Write-Host "Target framework: net11.0-android"
          Write-Host "Minimum Android API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"
          Write-Host "Runtime: android-arm64"
          Write-Host "ABI: arm64-v8a"
          Write-Host ""
          Write-Host "ANDROID_HOME: $env:ANDROID_HOME"
          Write-Host "ANDROID_NDK_HOME: $env:ANDROID_NDK_HOME"

          if (-not (Test-Path $env:ANDROID_NDK_HOME)) {
            throw "ANDROID_NDK_HOME does not exist: $env:ANDROID_NDK_HOME"
          }

          dotnet build `
            .\subsystem.master.csproj `
            -c Release `
            -f net11.0-android `
            -r android-arm64 `
            --no-restore `
            -p:SubsystemRelease=true `
            -p:SupportedOSPlatformVersion=31.0 `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"

          if ($LASTEXITCODE -ne 0) {
            throw "Android ARM64 compilation failed."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Android ARM64 compilation succeeded."
          Write-Host "=========================================="


      # ============================================================
      # Locate generated artifacts
      # ============================================================

      - name: Locate Android artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Android build artifacts"
          Write-Host "=========================================="

          $apkFiles = Get-ChildItem `
            -Path . `
            -Recurse `
            -File `
            -Filter "*.apk" `
            -ErrorAction SilentlyContinue

          $aabFiles = Get-ChildItem `
            -Path . `
            -Recurse `
            -File `
            -Filter "*.aab" `
            -ErrorAction SilentlyContinue

          if ($apkFiles.Count -eq 0 -and $aabFiles.Count -eq 0) {
            Write-Host "No APK/AAB artifacts were found."

            Write-Host ""
            Write-Host "Recent build directories:"

            Get-ChildItem . `
              -Recurse `
              -Directory `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match '\\bin\\' -or
                $_.FullName -match '\\obj\\'
              } |
              Select-Object -First 100 |
              ForEach-Object {
                Write-Host $_.FullName
              }

            exit 0
          }

          if ($apkFiles.Count -gt 0) {
            Write-Host ""
            Write-Host "APK files:"

            $apkFiles |
              ForEach-Object {
                Write-Host "  $($_.FullName)"
              }
          }

          if ($aabFiles.Count -gt 0) {
            Write-Host ""
            Write-Host "AAB files:"

            $aabFiles |
              ForEach-Object {
                Write-Host "  $($_.FullName)"
              }
          }


      # ============================================================
      # Upload artifacts
      # ============================================================

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: subsystem-android-arm64
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn
