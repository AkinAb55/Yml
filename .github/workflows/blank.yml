name: Build Subsystem Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_VERSION: 11.0.100-preview.5.26302.115
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_API_LEVEL: 36

jobs:
  build:
    name: Build Subsystem ARM64 APK
    runs-on: windows-latest
    steps:
      # ------------------------------------------------------------
      # 1. Checkout our repository
      # ------------------------------------------------------------
      - name: Checkout workflow repository
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # 2. Clone the official Subsystem repository
      # ------------------------------------------------------------
      - name: Clone official Subsystem
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/MansfieldPlumbing/Subsystem.git subsystem

      # ------------------------------------------------------------
      # 3. Install exact .NET SDK required by Subsystem
      # ------------------------------------------------------------
      - name: Setup .NET 11 Preview
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ------------------------------------------------------------
      # 4. JDK 21
      # ------------------------------------------------------------
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      # ------------------------------------------------------------
      # 5. Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------------
      # 6. Install Android SDK / NDK components
      # ------------------------------------------------------------
      - name: Install Android SDK components
        shell: pwsh
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          & $sdkmanager `
            "platform-tools" `
            "platforms;android-${env:ANDROID_API_LEVEL}" `
            "ndk;${env:ANDROID_NDK_VERSION}"
          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK/NDK installation failed."
          }

      # ------------------------------------------------------------
      # 7. Accept Android licenses
      # ------------------------------------------------------------
      - name: Accept Android SDK licenses
        shell: pwsh
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          1..20 | ForEach-Object {
            "y"
          } | & $sdkmanager --licenses
          if ($LASTEXITCODE -ne 0) {
            throw "Android license acceptance failed."
          }

      # ------------------------------------------------------------
      # 8. Verify toolchain
      # ------------------------------------------------------------
      - name: Show toolchain
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "===== .NET ====="
          dotnet --info
          Write-Host ""
          Write-Host "===== Java ====="
          java -version
          Write-Host ""
          Write-Host "===== Android ====="
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_NDK_HOME=$env:ANDROID_NDK_HOME"
          Write-Host ""
          Write-Host "===== SDK ====="
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --list |
            Select-String "platforms;android-${env:ANDROID_API_LEVEL}|ndk;${env:ANDROID_NDK_VERSION}"

      # ------------------------------------------------------------
      # 9. Install .NET Android workload
      # ------------------------------------------------------------
      - name: Install .NET Android workload
        shell: pwsh
        working-directory: subsystem
        run: |
          dotnet workload install android
          if ($LASTEXITCODE -ne 0) {
            throw ".NET Android workload installation failed."
          }
          dotnet workload list

      # ------------------------------------------------------------
      # 10. Prepare native build environment
      # ------------------------------------------------------------
      - name: Set Android NDK environment
        shell: pwsh
        run: |
          $ndk = Join-Path $env:ANDROID_HOME "ndk\${env:ANDROID_NDK_VERSION}"
          if (-not (Test-Path $ndk)) {
            throw "NDK not found: $ndk"
          }
          "ANDROID_NDK_HOME=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SS_NDK=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using NDK:"
          Write-Host $ndk

      # ------------------------------------------------------------
      # 11. Build PowerShell native Android shim
      # ------------------------------------------------------------
      - name: Build native PowerShell Android library
        shell: pwsh
        working-directory: subsystem\src\runspace\native
        run: |
          Write-Host "Running native build..."
          & .\build-native.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Native library build failed."
          }
          $lib = "libs\arm64-v8a\libpsl-android.so"
          if (-not (Test-Path $lib)) {
            throw "Expected native library was not produced: $lib"
          }
          Write-Host ""
          Write-Host "Native library created:"
          Get-Item $lib | Format-List FullName,Length,LastWriteTime

      # ------------------------------------------------------------
      # 12. Restore NuGet dependencies
      # ------------------------------------------------------------
      - name: Restore Subsystem
        shell: pwsh
        working-directory: subsystem
        run: |
          dotnet restore .\subsystem.master.csproj
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed."
          }

      # ------------------------------------------------------------
      # 13. Publish ARM64 Android APK
      # ------------------------------------------------------------
      - name: Publish Android ARM64
        shell: pwsh
        working-directory: subsystem
        run: |
          dotnet publish .\subsystem.master.csproj `
            -c Release `
            -f net11.0-android `
            -r android-arm64 `
            --self-contained true `
            -p:SubsystemRelease=true `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          if ($LASTEXITCODE -ne 0) {
            throw "Android publish failed."
          }

      # ------------------------------------------------------------
      # 14. Locate APK
      # ------------------------------------------------------------
      - name: Find generated APK
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "Searching for APK files..."
          $apks = Get-ChildItem `
            -Path . `
            -Filter *.apk `
            -Recurse `
            -File
          if (-not $apks) {
            throw "No APK was produced."
          }
          Write-Host ""
          Write-Host "===== APK FILES ====="
          foreach ($apk in $apks) {
            Write-Host ""
            Write-Host "FILE: $($apk.FullName)"
            Write-Host "SIZE: $([math]::Round($apk.Length / 1MB, 2)) MB"
          }

      # ------------------------------------------------------------
      # 15. Copy final APK to a clean artifact directory
      # ------------------------------------------------------------
      - name: Prepare APK artifact
        shell: pwsh
        working-directory: subsystem
        run: |
          New-Item -ItemType Directory -Force ..\artifacts | Out-Null
          $apk = Get-ChildItem `
            -Path . `
            -Filter *.apk `
            -Recurse `
            -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $apk) {
            throw "Could not locate final APK."
          }
          Copy-Item `
            $apk.FullName `
            "..\artifacts\Subsystem-arm64.apk" `
            -Force
          Write-Host "Artifact:"
          Get-Item "..\artifacts\Subsystem-arm64.apk" |
            Format-List FullName,Length,LastWriteTime

      # ------------------------------------------------------------
      # 16. Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Subsystem-Android-ARM64
          path: artifacts/Subsystem-arm64.apk
          if-no-files-found: error
          retention-days: 14
