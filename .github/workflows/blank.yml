name: Build Subsystem Android 12 ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 11.0.100-preview.5.26302.115
  ANDROID_NDK_VERSION: 27.2.12479018
  # Android 12 = API 31.
  MIN_ANDROID_API: 31
  # We compile against a modern Android SDK.
  TARGET_ANDROID_API: 36

jobs:
  build:
    name: Build Subsystem ARM64 APK for Android 12+
    runs-on: windows-latest
    steps:
      # ============================================================
      # 1. Checkout our repository
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. Clone official Subsystem
      # ============================================================
      - name: Clone official Subsystem
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/MansfieldPlumbing/Subsystem.git subsystem
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Subsystem."
          }
          Write-Host "Subsystem cloned successfully."

      # ============================================================
      # 3. Install exact .NET SDK
      # ============================================================
      - name: Setup .NET 11 Preview
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ============================================================
      # 4. JDK 21
      # ============================================================
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      # ============================================================
      # 5. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 6. Install Android SDK / NDK
      # ============================================================
      - name: Install Android SDK components
        shell: pwsh
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          & $sdkmanager `
            "platform-tools" `
            "platforms;android-${env:TARGET_ANDROID_API}" `
            "build-tools;36.0.0" `
            "ndk;${env:ANDROID_NDK_VERSION}"
          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK/NDK installation failed."
          }

      # ============================================================
      # 7. Accept Android licenses
      # ============================================================
      - name: Accept Android SDK licenses
        shell: pwsh
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          1..30 | ForEach-Object {
            "y"
          } | & $sdkmanager --licenses
          if ($LASTEXITCODE -ne 0) {
            throw "Android license acceptance failed."
          }

      # ============================================================
      # 8. Configure NDK
      # ============================================================
      - name: Configure Android NDK
        shell: pwsh
        run: |
          $ndk = Join-Path `
            $env:ANDROID_HOME `
            "ndk\${env:ANDROID_NDK_VERSION}"
          if (-not (Test-Path $ndk)) {
            throw "NDK not found: $ndk"
          }
          "ANDROID_NDK_HOME=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append
          "SS_NDK=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append
          Write-Host "ANDROID_NDK_HOME=$ndk"
          Write-Host "SS_NDK=$ndk"

      # ============================================================
      # 9. Show toolchain
      # ============================================================
      - name: Show toolchain
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=============================="
          Write-Host ".NET"
          Write-Host "=============================="
          dotnet --info
          Write-Host ""
          Write-Host "=============================="
          Write-Host "Java"
          Write-Host "=============================="
          java -version
          Write-Host ""
          Write-Host "=============================="
          Write-Host "Android"
          Write-Host "=============================="
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_NDK_HOME=$env:ANDROID_NDK_HOME"
          Write-Host ""
          Write-Host "=============================="
          Write-Host "Installed Android SDK"
          Write-Host "=============================="
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --list_installed |
            Select-String "platforms;android|build-tools|ndk;"

      # ============================================================
      # 10. Install .NET Android workload
      # ============================================================
      - name: Install .NET Android workload
        shell: pwsh
        working-directory: subsystem
        run: |
          dotnet workload install android
          if ($LASTEXITCODE -ne 0) {
            throw "Android workload installation failed."
          }
          Write-Host ""
          Write-Host "Installed workloads:"
          dotnet workload list

      # ============================================================
      # 11. Build native PowerShell Android library
      # ============================================================
      - name: Build native PowerShell Android library
        shell: pwsh
        working-directory: subsystem\src\runspace\native
        run: |
          Write-Host "Building native PowerShell Android library..."
          & .\build-native.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Native build failed."
          }
          $nativeLib = ".\libs\arm64-v8a\libpsl-android.so"
          if (-not (Test-Path $nativeLib)) {
            throw "Native library was not created: $nativeLib"
          }
          Write-Host ""
          Write-Host "Native library:"
          Get-Item $nativeLib |
            Format-List FullName,Length,LastWriteTime

      # ============================================================
      # 12. Put native library where the project expects it
      # ============================================================
      - name: Prepare native library
        shell: pwsh
        working-directory: subsystem
        run: |
          $source = ".\src\runspace\native\libs\arm64-v8a\libpsl-android.so"
          $destination = ".\src\runspace\libs\arm64-v8a\libpsl-android.so"
          if (-not (Test-Path $source)) {
            throw "Native library source not found: $source"
          }
          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\src\runspace\libs\arm64-v8a" |
            Out-Null
          Copy-Item `
            $source `
            $destination `
            -Force
          if (-not (Test-Path $destination)) {
            throw "Native library was not copied."
          }
          Write-Host "Native library installed at:"
          Get-Item $destination |
            Format-List FullName,Length,LastWriteTime

      # ============================================================
      # 13. Apply CI compatibility fixes
      # ============================================================
      - name: Apply CI compatibility fixes
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "Applying CI compatibility fixes..."
          
          # A. Global diagnostics namespace
          $globalUsings = "global using Subsystem.Diagnostics;"
          Set-Content `
            -Path ".\src\runspace\GlobalUsings.Build.cs" `
            -Value $globalUsings `
            -Encoding UTF8
          
          # B. ImmutableDictionary fixes
          $notificationFile = ".\src\runspace\Services\NotificationService.cs"
          if (-not (Test-Path $notificationFile)) {
            throw "NotificationService.cs not found."
          }
          $notification = Get-Content `
            $notificationFile `
            -Raw
          $notification = $notification.Replace(
            'Notifications.TryRemove(sbn.Key, out _);',
            'Notifications = Notifications.Remove(sbn.Key);'
          )
          $notification = $notification.Replace(
            'Notifications[n.Key] = n;',
            'Notifications = Notifications.SetItem(n.Key, n);'
          )
          Set-Content `
            -Path $notificationFile `
            -Value $notification `
            -Encoding UTF8
          
          # C. Android 12 minimum (Targeting exact csproj line)
          $projectFile = ".\subsystem.master.csproj"
          $project = Get-Content `
            $projectFile `
            -Raw
          $project = $project -replace `
            '<SupportedOSPlatformVersion Condition="\''\$\(SupportedOSPlatformVersion\)\'' == \'\'\'\'">36\.0</SupportedOSPlatformVersion>', `
            '<SupportedOSPlatformVersion Condition="$([MSBuild]::GetTargetPlatformIdentifier(''$(TargetFramework)'')) == ''android''">31.0</SupportedOSPlatformVersion><SupportedOSPlatformVersion Condition="$([MSBuild]::GetTargetPlatformIdentifier(''$(TargetFramework)'')) != ''android''">36.0</SupportedOSPlatformVersion>'
          Set-Content `
            -Path $projectFile `
            -Value $project `
            -Encoding UTF8
          
          # D. Display resulting configuration
          Write-Host ""
          Write-Host "=============================="
          Write-Host "Patched project configuration"
          Write-Host "=============================="
          Select-String `
            -Path $projectFile `
            -Pattern "SupportedOSPlatformVersion"
          Write-Host ""
          Write-Host "CI compatibility patches applied."

      # ============================================================
      # 14. Verify native library and Android minimum
      # ============================================================
      - name: Verify build inputs
        shell: pwsh
        working-directory: subsystem
        run: |
          $lib = ".\src\runspace\libs\arm64-v8a\libpsl-android.so"
          if (-not (Test-Path $lib)) {
            throw "Required ARM64 native library is missing."
          }
          $size = (Get-Item $lib).Length
          if ($size -lt 1000) {
            throw "Native library looks suspiciously small: $size bytes."
          }
          Write-Host "libpsl-android.so size: $size bytes"
          $project = Get-Content `
            ".\subsystem.master.csproj" `
            -Raw
          if ($project -notmatch "SupportedOSPlatformVersion.*31\.0") {
            throw "Android minimum API 31 was not configured."
          }
          Write-Host "Android minimum API: 31"
          Write-Host "Android target/compile API: $env:TARGET_ANDROID_API"
          Write-Host "ABI: arm64-v8a"

      # ============================================================
      # 15. Restore
      # ============================================================
      - name: Restore Subsystem
        shell: pwsh
        working-directory: subsystem
        run: |
          dotnet restore .\subsystem.master.csproj
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed."
          }

      # ============================================================
      # 16. Compile only
      # ============================================================
      - name: Build Android ARM64
        shell: pwsh
        working-directory: subsystem
        run: |
          dotnet build .\subsystem.master.csproj `
            -c Release `
            -f net11.0-android `
            -r android-arm64 `
            --no-restore `
            -p:SupportedOSPlatformVersion=31.0 `
            -p:AndroidSupportedAbis=arm64-v8a `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          if ($LASTEXITCODE -ne 0) {
            throw "Android ARM64 compilation failed."
          }

      # ============================================================
      # 17. Publish APK
      # ============================================================
      - name: Publish Android 12+ ARM64 APK
        shell: pwsh
        working-directory: subsystem
        run: |
          dotnet publish .\subsystem.master.csproj `
            -c Release `
            -f net11.0-android `
            -r android-arm64 `
            --self-contained true `
            --no-restore `
            -p:SubsystemRelease=true `
            -p:SupportedOSPlatformVersion=31.0 `
            -p:AndroidSupportedAbis=arm64-v8a `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          if ($LASTEXITCODE -ne 0) {
            throw "Android publish failed."
          }

      # ============================================================
      # 18. Find APK
      # ============================================================
      - name: Find generated APK
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "Searching for APK files..."
          $apks = Get-ChildItem `
            -Path . `
            -Filter *.apk `
            -Recurse `
            -File
          if (-not $apks) {
            throw "No APK was produced."
          }
          Write-Host ""
          Write-Host "=============================="
          Write-Host "APK FILES"
          Write-Host "=============================="
          foreach ($apk in $apks) {
            Write-Host ""
            Write-Host "FILE: $($apk.FullName)"
            Write-Host "SIZE: $([math]::Round($apk.Length / 1MB, 2)) MB"
          }

      # ============================================================
      # 19. Prepare artifact
      # ============================================================
      - name: Prepare APK artifact
        shell: pwsh
        working-directory: subsystem
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "..\artifacts" |
            Out-Null
          $apks = Get-ChildItem `
            -Path . `
            -Filter *.apk `
            -Recurse `
            -File
          $apk = $apks |
            Where-Object {
              $_.FullName -notmatch "\\obj\\"
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $apk) {
            throw "Could not locate final APK."
          }
          Copy-Item `
            $apk.FullName `
            "..\artifacts\Subsystem-Android12-ARM64.apk" `
            -Force
          Write-Host ""
          Write-Host "Final APK:"
          Get-Item `
            "..\artifacts\Subsystem-Android12-ARM64.apk" |
            Format-List FullName,Length,LastWriteTime

      # ============================================================
      # 20. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Subsystem-Android12-ARM64
          path: artifacts/Subsystem-Android12-ARM64.apk
          if-no-files-found: error
          retention-days: 14
