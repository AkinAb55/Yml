name: Build Subsystem Android 12 ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  DOTNET_VERSION: 11.0.100-preview.5.26302.115
  ANDROID_NDK_VERSION: 27.2.12479018

  # Android 12 = API 31
  MIN_ANDROID_API: 31

  # Compile SDK
  TARGET_ANDROID_API: 36

jobs:
  build:
    name: Build Subsystem ARM64 APK for Android 12+
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Checkout workflow repository
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. Clone official Subsystem
      # ============================================================
      - name: Clone official Subsystem
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Cloning official Subsystem"
          Write-Host "=========================================="

          git clone --depth 1 `
            https://github.com/MansfieldPlumbing/Subsystem.git `
            subsystem

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Subsystem."
          }

          Write-Host "Subsystem cloned successfully."

      # ============================================================
      # 3. Setup exact .NET SDK
      # ============================================================
      - name: Setup .NET 11 Preview
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ============================================================
      # 4. Setup JDK 25
      #
      # The current Subsystem project expects/supports Java 25.
      # ============================================================
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'

      # ============================================================
      # 5. Setup Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 6. Install Android SDK / Build Tools / NDK
      # ============================================================
      - name: Install Android SDK components
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Installing Android SDK components"
          Write-Host "=========================================="

          $sdkmanager = Join-Path `
            $env:ANDROID_HOME `
            "cmdline-tools\latest\bin\sdkmanager.bat"

          if (-not (Test-Path $sdkmanager)) {
            throw "sdkmanager not found: $sdkmanager"
          }

          & $sdkmanager `
            "platform-tools" `
            "platforms;android-${env:TARGET_ANDROID_API}" `
            "build-tools;36.0.0" `
            "ndk;${env:ANDROID_NDK_VERSION}"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK/NDK installation failed."
          }

          Write-Host "Android SDK components installed."

      # ============================================================
      # 7. Accept Android licenses
      # ============================================================
      - name: Accept Android SDK licenses
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Accepting Android licenses"
          Write-Host "=========================================="

          $sdkmanager = Join-Path `
            $env:ANDROID_HOME `
            "cmdline-tools\latest\bin\sdkmanager.bat"

          1..100 |
            ForEach-Object { "y" } |
            & $sdkmanager --licenses

          if ($LASTEXITCODE -ne 0) {
            throw "Android license acceptance failed."
          }

      # ============================================================
      # 8. Configure NDK
      # ============================================================
      - name: Configure Android NDK
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Configuring Android NDK"
          Write-Host "=========================================="

          $ndk = Join-Path `
            $env:ANDROID_HOME `
            "ndk\${env:ANDROID_NDK_VERSION}"

          if (-not (Test-Path $ndk)) {
            throw "NDK not found: $ndk"
          }

          "ANDROID_NDK_HOME=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "SS_NDK=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "ANDROID_NDK_HOME=$ndk"
          Write-Host "SS_NDK=$ndk"

      # ============================================================
      # 9. Show toolchain
      # ============================================================
      - name: Show toolchain
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host ".NET"
          Write-Host "=========================================="
          dotnet --info

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Java"
          Write-Host "=========================================="
          java -version

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Android"
          Write-Host "=========================================="
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_NDK_HOME=$env:ANDROID_NDK_HOME"
          Write-Host "SS_NDK=$env:SS_NDK"

      # ============================================================
      # 10. Verify source tree
      # ============================================================
      - name: Verify Subsystem source tree
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Checking Subsystem source tree"
          Write-Host "=========================================="

          $requiredFiles = @(
            ".\subsystem.master.csproj",
            ".\src\runspace\Diagnostics\Dg.cs",
            ".\src\runspace\Diagnostics\AgentSettings.cs",
            ".\src\runspace\Diagnostics\PackageInfoDb.cs",
            ".\src\runspace\Diagnostics\SqliteProbe.cs",
            ".\src\runspace\native\build-native.ps1"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required source file is missing: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "All required source files are present."

      # ============================================================
      # 11. Install .NET Android workload
      # ============================================================
      - name: Install .NET Android workload
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Installing .NET Android workload"
          Write-Host "=========================================="

          dotnet workload install android

          if ($LASTEXITCODE -ne 0) {
            throw "Android workload installation failed."
          }

          dotnet workload list

      # ============================================================
      # 12. Build native PowerShell library
      # ============================================================
      - name: Build native PowerShell Android library
        shell: pwsh
        working-directory: subsystem\src\runspace\native
        run: |
          Write-Host "=========================================="
          Write-Host "Building native PowerShell Android library"
          Write-Host "=========================================="

          & .\build-native.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "Native PowerShell build failed."
          }

          $nativeLib = ".\libs\arm64-v8a\libpsl-android.so"

          if (-not (Test-Path $nativeLib)) {
            throw "Native library was not created: $nativeLib"
          }

          $size = (Get-Item $nativeLib).Length

          if ($size -lt 1000) {
            throw "Native library looks suspiciously small: $size bytes"
          }

          Write-Host "Native library size: $size bytes"

      # ============================================================
      # 13. Prepare native library
      # ============================================================
      - name: Prepare native library
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Preparing native library"
          Write-Host "=========================================="

          $source = `
            ".\src\runspace\native\libs\arm64-v8a\libpsl-android.so"

          $destination = `
            ".\src\runspace\libs\arm64-v8a\libpsl-android.so"

          if (-not (Test-Path $source)) {
            throw "Native library source not found: $source"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\src\runspace\libs\arm64-v8a" |
            Out-Null

          Copy-Item `
            -Path $source `
            -Destination $destination `
            -Force

          if (-not (Test-Path $destination)) {
            throw "Native library was not copied."
          }

          $size = (Get-Item $destination).Length

          Write-Host "Prepared native library: $size bytes"

      # ============================================================
      # 14. Apply CI compatibility fixes
      #
      # IMPORTANT:
      # Do NOT edit the project file using string replacement.
      # XML is modified through XmlDocument instead.
      # ============================================================
      - name: Apply CI compatibility fixes
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Applying CI compatibility fixes"
          Write-Host "=========================================="

          # --------------------------------------------------------
          # A. ImmutableDictionary compatibility
          # --------------------------------------------------------

          $notificationFile = `
            ".\src\runspace\Services\NotificationService.cs"

          if (-not (Test-Path $notificationFile)) {
            throw "NotificationService.cs not found."
          }

          $notification = Get-Content `
            $notificationFile `
            -Raw

          $notification = $notification.Replace(
            'Notifications.TryRemove(sbn.Key, out _);',
            'Notifications = Notifications.Remove(sbn.Key);'
          )

          $notification = $notification.Replace(
            'Notifications[n.Key] = n;',
            'Notifications = Notifications.SetItem(n.Key, n);'
          )

          Set-Content `
            -Path $notificationFile `
            -Value $notification `
            -Encoding UTF8

          Write-Host "NotificationService.cs patched."

          # --------------------------------------------------------
          # B. Modify subsystem.master.csproj using XML DOM
          # --------------------------------------------------------

          $projectFile = `
            (Resolve-Path ".\subsystem.master.csproj").Path

          Write-Host ""
          Write-Host "Loading subsystem.master.csproj..."

          $xml = New-Object System.Xml.XmlDocument
          $xml.PreserveWhitespace = $true

          try {
            $xml.Load($projectFile)
          }
          catch {
            throw `
              "Could not load subsystem.master.csproj as XML: $($_.Exception.Message)"
          }

          $projectElement = $xml.DocumentElement

          if ($null -eq $projectElement) {
            throw "Project XML has no root element."
          }

          if ($projectElement.Name -ne "Project") {
            throw "Unexpected project root element: $($projectElement.Name)"
          }

          # --------------------------------------------------------
          # C. Verify Android target exists
          # --------------------------------------------------------

          $targetFrameworksNode = `
            $projectElement.SelectSingleNode("./PropertyGroup/TargetFrameworks")

          if ($null -eq $targetFrameworksNode) {
            throw "TargetFrameworks element was not found."
          }

          $targetFrameworks = $targetFrameworksNode.InnerText

          Write-Host "TargetFrameworks: $targetFrameworks"

          if ($targetFrameworks -notmatch "net11\.0-android") {
            throw "net11.0-android target framework is missing."
          }

          # --------------------------------------------------------
          # D. Remove ONLY our previously generated Diagnostics
          #    ItemGroup if one exists.
          #
          # This makes the step idempotent.
          # --------------------------------------------------------

          $existingGroups = @(
            $projectElement.SelectNodes("./ItemGroup")
          )

          foreach ($group in $existingGroups) {
            $condition = $group.GetAttribute("Condition")

            if (
              $condition -eq "'`$(TargetFramework)' == 'net11.0-android'"
            ) {
              $compileNodes = @(
                $group.SelectNodes("./Compile")
              )

              $diagnosticNames = @(
                "AgentSettings.cs",
                "Dg.cs",
                "PackageInfoDb.cs",
                "SqliteProbe.cs"
              )

              foreach ($compile in $compileNodes) {
                $include = $compile.GetAttribute("Include")

                if (
                  $include -match `
                    "src[\\/]runspace[\\/]Diagnostics[\\/]" `
                  -and
                  $diagnosticNames | Where-Object {
                    $include -like "*$_"
                  }
                ) {
                  [void]$group.RemoveChild($compile)
                }
              }
            }
          }

          # --------------------------------------------------------
          # E. Find the Android ItemGroup
          # --------------------------------------------------------

          $androidItemGroup = $null

          foreach ($group in @($projectElement.SelectNodes("./ItemGroup"))) {
            $condition = $group.GetAttribute("Condition")

            if (
              $condition -eq "'`$(TargetFramework)' == 'net11.0-android'"
            ) {
              $hasAndroidItems = `
                $null -ne $group.SelectSingleNode("./AndroidNativeLibrary") `
                -or `
                $null -ne $group.SelectSingleNode("./AndroidEnvironment") `
                -or `
                $null -ne $group.SelectSingleNode("./AndroidAsset")

              if ($hasAndroidItems) {
                $androidItemGroup = $group
                break
              }
            }
          }

          # --------------------------------------------------------
          # F. If no suitable Android ItemGroup exists, create one.
          # --------------------------------------------------------

          if ($null -eq $androidItemGroup) {
            $androidItemGroup = $xml.CreateElement("ItemGroup")
            $androidItemGroup.SetAttribute(
              "Condition",
              "'`$(TargetFramework)' == 'net11.0-android'"
            )

            [void]$projectElement.AppendChild($androidItemGroup)

            Write-Host "Created Android ItemGroup."
          }
          else {
            Write-Host "Existing Android ItemGroup found."
          }

          # --------------------------------------------------------
          # G. Add the four Diagnostics Compile items.
          #
          # This is the important part.
          # No string XML injection.
          # No malformed quotes.
          # --------------------------------------------------------

          $diagnostics = @(
            "src\runspace\Diagnostics\AgentSettings.cs",
            "src\runspace\Diagnostics\Dg.cs",
            "src\runspace\Diagnostics\PackageInfoDb.cs",
            "src\runspace\Diagnostics\SqliteProbe.cs"
          )

          foreach ($path in $diagnostics) {

            $alreadyPresent = $false

            foreach ($compile in @(
              $androidItemGroup.SelectNodes("./Compile")
            )) {
              if ($compile.GetAttribute("Include") -eq $path) {
                $alreadyPresent = $true
                break
              }
            }

            if (-not $alreadyPresent) {
              $compile = $xml.CreateElement("Compile")
              $compile.SetAttribute("Include", $path)

              [void]$androidItemGroup.AppendChild($compile)

              Write-Host "Added Compile item: $path"
            }
            else {
              Write-Host "Compile item already exists: $path"
            }
          }

          # --------------------------------------------------------
          # H. Save XML
          # --------------------------------------------------------

          $xml.Save($projectFile)

          Write-Host ""
          Write-Host "subsystem.master.csproj saved."

          # --------------------------------------------------------
          # I. Re-load XML to prove it is valid.
          # --------------------------------------------------------

          $verifyXml = New-Object System.Xml.XmlDocument

          try {
            $verifyXml.Load($projectFile)
          }
          catch {
            throw `
              "subsystem.master.csproj became invalid XML: $($_.Exception.Message)"
          }

          Write-Host "Project XML successfully revalidated."

          # --------------------------------------------------------
          # J. Verify exact Compile entries through XML itself.
          # --------------------------------------------------------

          $verifyAndroidGroup = $null

          foreach ($group in @(
            $verifyXml.DocumentElement.SelectNodes("./ItemGroup")
          )) {
            if (
              $group.GetAttribute("Condition") `
                -eq "'`$(TargetFramework)' == 'net11.0-android'"
            ) {
              foreach ($compile in @(
                $group.SelectNodes("./Compile")
              )) {
                $include = $compile.GetAttribute("Include")

                if (
                  $include -eq `
                    "src\runspace\Diagnostics\Dg.cs"
                ) {
                  $verifyAndroidGroup = $group
                  break
                }
              }
            }

            if ($null -ne $verifyAndroidGroup) {
              break
            }
          }

          if ($null -eq $verifyAndroidGroup) {
            throw `
              "Could not verify Android Diagnostics ItemGroup."
          }

          foreach ($path in $diagnostics) {
            $found = $false

            foreach ($compile in @(
              $verifyAndroidGroup.SelectNodes("./Compile")
            )) {
              if ($compile.GetAttribute("Include") -eq $path) {
                $found = $true
                break
              }
            }

            if (-not $found) {
              throw `
                "Diagnostics Compile item is missing: $path"
            }

            Write-Host "Verified Compile item: $path"
          }

          Write-Host ""
          Write-Host "Android Diagnostics Compile items configured successfully."
          # ============================================================
      # 15. Validate project
      # ============================================================
      - name: Validate subsystem.master.csproj
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Validating subsystem.master.csproj"
          Write-Host "=========================================="

          $projectFile = `
            (Resolve-Path ".\subsystem.master.csproj").Path

          $xml = New-Object System.Xml.XmlDocument

          try {
            $xml.Load($projectFile)
          }
          catch {
            throw `
              "subsystem.master.csproj is invalid XML: $($_.Exception.Message)"
          }

          Write-Host "Project XML is valid."
          $targetFrameworksNode = `
            $xml.DocumentElement.SelectSingleNode(
              "./PropertyGroup/TargetFrameworks"
            )

          if ($null -eq $targetFrameworksNode) {
            throw "TargetFrameworks element was not found."
          }

          $targetFrameworks = $targetFrameworksNode.InnerText

          Write-Host "TargetFrameworks: $targetFrameworks"

          if ($targetFrameworks -notmatch "net11\.0-android") {
            throw "net11.0-android target framework is missing."
          }

          Write-Host "Android target framework confirmed."

          $required = @(
            "src\runspace\Diagnostics\AgentSettings.cs",
            "src\runspace\Diagnostics\Dg.cs",
            "src\runspace\Diagnostics\PackageInfoDb.cs",
            "src\runspace\Diagnostics\SqliteProbe.cs"
          )

          $androidGroupFound = $false

          foreach ($group in @(
          $xml.DocumentElement.SelectNodes("./ItemGroup")
          )) {

            if (
              $group.GetAttribute("Condition") `
                -ne "'`$(TargetFramework)' == 'net11.0-android'"
            ) {
              continue
            }

            $compileItems = @(
              $group.SelectNodes("./Compile")
            )

            foreach ($path in $required) {
              foreach ($compile in $compileItems) {

                if ($compile.GetAttribute("Include") -eq $path) {
                  Write-Host "Compile item confirmed: $path"
                  $androidGroupFound = $true
                  break
                }
              }
            }
          }
          if (-not $androidGroupFound) {
            throw `
              "Android Diagnostics Compile items could not be verified."
          }

          Write-Host ""
          Write-Host "Project validation successful."

      # ============================================================
      # 16. Restore
      # ============================================================
      - name: Restore Subsystem
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Restoring Subsystem"
          Write-Host "=========================================="

          dotnet restore .\subsystem.master.csproj

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed."
          }
          Write-Host "Restore succeeded."

      # ============================================================
      # 17. Verify Android Compile items through MSBuild
      #
      # This time we don't modify XML anymore.
      # We only inspect what MSBuild actually sees.
      # ============================================================
      - name: Verify Android Compile items through MSBuild
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Checking MSBuild Compile items"
          Write-Host "=========================================="

          $compileList = `
            dotnet msbuild .\subsystem.master.csproj `
              -p:TargetFramework=net11.0-android `
              -p:SupportedOSPlatformVersion=31.0 `
              -getItem:Compile
              if ($LASTEXITCODE -ne 0) {
            throw "Could not query MSBuild Compile items."
          }

          $compileText = $compileList | Out-String

          $requiredCompileFiles = @(
            "Dg.cs",
            "AgentSettings.cs",
            "PackageInfoDb.cs",
            "SqliteProbe.cs"
          )

          foreach ($name in $requiredCompileFiles) {

            if ($compileText -notmatch [regex]::Escape($name)) {
              throw `
                "$name is NOT present in MSBuild Compile items."
            }

            Write-Host "MSBuild Compile confirmed: $name"
          }

          Write-Host ""
          Write-Host "All Diagnostics files are visible to MSBuild."

          # ============================================================
      # 18. Verify Android build configuration
      # ============================================================
      - name: Verify Android build configuration
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Android build configuration"
          Write-Host "=========================================="

          if (-not (Test-Path `
              ".\src\runspace\libs\arm64-v8a\libpsl-android.so")) {
            throw "ARM64 native library is missing."
          }

          Write-Host "Target framework: net11.0-android"
          Write-Host "Minimum Android API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"
          Write-Host "Runtime: android-arm64"
          Write-Host "ABI: arm64-v8a"
          Write-Host "Native library: present"

          # ============================================================
      # 19. Build Android ARM64
      # ============================================================
      - name: Build Android ARM64
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Building Subsystem for Android ARM64"
          Write-Host "=========================================="

          Write-Host "Minimum Android API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"
          Write-Host "Runtime: android-arm64"
          Write-Host "ABI: arm64-v8a"

          dotnet build .\subsystem.master.csproj `
            -c Release `
            -f net11.0-android `
            -r android-arm64 `
            --no-restore `
            -p:SubsystemRelease=true `
            -p:SupportedOSPlatformVersion=31.0 `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"

          if ($LASTEXITCODE -ne 0) {
            throw "Android ARM64 compilation failed."
          }
          Write-Host ""
          Write-Host "Android ARM64 compilation succeeded."

      # ============================================================
      # 20. Publish APK
      # ============================================================
      - name: Publish Android 12+ ARM64 APK
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Publishing Android ARM64 APK"
          Write-Host "=========================================="

          dotnet publish .\subsystem.master.csproj `
            -c Release `
            -f net11.0-android `
            -r android-arm64 `
            --self-contained true `
            --no-restore `
            -p:SubsystemRelease=true `
            -p:SupportedOSPlatformVersion=31.0 `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"

          if ($LASTEXITCODE -ne 0) {
            throw "Android publish failed."
          }
          Write-Host ""
          Write-Host "Android publish succeeded."

      # ============================================================
      # 21. Find generated APK
      # ============================================================
      - name: Find generated APK
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Searching for APK files"
          Write-Host "=========================================="

          $apks = Get-ChildItem `
            -Path . `
            -Filter *.apk `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -notmatch "\\obj\\"
            }

          if (-not $apks) {
            throw "No APK was produced."
          }
          foreach ($apk in $apks) {
            Write-Host ""
            Write-Host "FILE: $($apk.FullName)"
            Write-Host "SIZE: $([math]::Round($apk.Length / 1MB, 2)) MB"
          }

      # ============================================================
      # 22. Prepare final artifact
      # ============================================================
      - name: Prepare APK artifact
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Preparing final APK artifact"
          Write-Host "=========================================="

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "..\artifacts" |
            Out-Null

          $apks = Get-ChildItem `
            -Path . `
            -Filter *.apk `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -notmatch "\\obj\\"
            }

          if (-not $apks) {
            throw "Could not locate final APK."
          }

          $apk = $apks |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $apk) {
            throw "Could not select final APK."
          }

          $destination = `
            "..\artifacts\Subsystem-Android12-ARM64.apk"
            Copy-Item `
            -Path $apk.FullName `
            -Destination $destination `
            -Force

          if (-not (Test-Path $destination)) {
            throw "Final APK was not copied."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FINAL APK"
          Write-Host "=========================================="

          Get-Item $destination |
            Format-List FullName,Length,LastWriteTime

      # ============================================================
      # 23. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Subsystem-Android12-ARM64
          path: artifacts/Subsystem-Android12-ARM64.apk
          if-no-files-found: error
          retention-days: 14
