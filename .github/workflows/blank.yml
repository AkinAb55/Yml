name: Build Subsystem Android 12 ARM64

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  DOTNET_VERSION: 11.0.100-preview.5.26302.115
  ANDROID_NDK_VERSION: 27.2.12479018

  # Android 12 = API 31.
  MIN_ANDROID_API: 31

  # Compile with modern Android SDK.
  TARGET_ANDROID_API: 36

jobs:
  build:
    name: Build Subsystem ARM64 APK for Android 12+
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Checkout workflow repository
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. Clone official Subsystem
      # ============================================================

      - name: Clone official Subsystem
        shell: pwsh
        run: |
          git clone --depth 1 `
            https://github.com/MansfieldPlumbing/Subsystem.git `
            subsystem

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Subsystem."
          }

          Write-Host "Subsystem cloned successfully."

      # ============================================================
      # 3. Setup exact .NET SDK
      # ============================================================

      - name: Setup .NET 11 Preview
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ============================================================
      # 4. Setup JDK 25
      #
      # Current Subsystem project explicitly expects Java 25.
      # ============================================================

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'

      # ============================================================
      # 5. Setup Android SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 6. Install Android SDK / Build Tools / NDK
      # ============================================================

      - name: Install Android SDK components
        shell: pwsh
        run: |
          $sdkmanager = Join-Path `
            $env:ANDROID_HOME `
            "cmdline-tools\latest\bin\sdkmanager.bat"

          if (-not (Test-Path $sdkmanager)) {
            throw "sdkmanager not found: $sdkmanager"
          }

          & $sdkmanager `
            "platform-tools" `
            "platforms;android-${env:TARGET_ANDROID_API}" `
            "build-tools;36.0.0" `
            "ndk;${env:ANDROID_NDK_VERSION}"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK/NDK installation failed."
          }

      # ============================================================
      # 7. Accept Android licenses
      # ============================================================

      - name: Accept Android SDK licenses
        shell: pwsh
        run: |
          $sdkmanager = Join-Path `
            $env:ANDROID_HOME `
            "cmdline-tools\latest\bin\sdkmanager.bat"

          1..50 | ForEach-Object {
            "y"
          } | & $sdkmanager --licenses

          if ($LASTEXITCODE -ne 0) {
            throw "Android license acceptance failed."
          }

      # ============================================================
      # 8. Configure NDK
      # ============================================================

      - name: Configure Android NDK
        shell: pwsh
        run: |
          $ndk = Join-Path `
            $env:ANDROID_HOME `
            "ndk\${env:ANDROID_NDK_VERSION}"

          if (-not (Test-Path $ndk)) {
            throw "NDK not found: $ndk"
          }

          "ANDROID_NDK_HOME=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "SS_NDK=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "ANDROID_NDK_HOME=$ndk"
          Write-Host "SS_NDK=$ndk"

      # ============================================================
      # 9. Show toolchain
      # ============================================================

      - name: Show toolchain
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host ".NET"
          Write-Host "=========================================="

          dotnet --info

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Java"
          Write-Host "=========================================="

          java -version

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Android"
          Write-Host "=========================================="

          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_NDK_HOME=$env:ANDROID_NDK_HOME"
          Write-Host "SS_NDK=$env:SS_NDK"

      # ============================================================
      # 10. Verify source tree
      # ============================================================

      - name: Verify Subsystem source tree
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "Checking required source files..."

          $requiredFiles = @(
            ".\subsystem.master.csproj",
            ".\src\runspace\Diagnostics\Dg.cs",
            ".\src\runspace\Diagnostics\AgentSettings.cs",
            ".\src\runspace\Diagnostics\PackageInfoDb.cs",
            ".\src\runspace\Diagnostics\SqliteProbe.cs",
            ".\src\runspace\native\build-native.ps1"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required source file is missing: $file"
            }

            Write-Host "OK: $file"
          }

      # ============================================================
      # 11. Verify project XML and Android target
      #
      # IMPORTANT:
      # We DO NOT modify subsystem.master.csproj here.
      # ============================================================

      - name: Validate subsystem.master.csproj
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Validating subsystem.master.csproj"
          Write-Host "=========================================="

          $projectFile = Resolve-Path ".\subsystem.master.csproj"

          try {
            [xml]$projectXml = Get-Content `
              $projectFile `
              -Raw
          }
          catch {
            throw "subsystem.master.csproj is not valid XML: $($_.Exception.Message)"
          }

          Write-Host "Project XML is valid."

          $targetFrameworks = @(
            $projectXml.Project.PropertyGroup.TargetFrameworks
          ) -join ";"

          Write-Host "TargetFrameworks: $targetFrameworks"

          if ($targetFrameworks -notmatch "net11\.0-android") {
            throw "net11.0-android target framework is missing."
          }

          $androidPropertyGroups = @(
            $projectXml.Project.PropertyGroup |
              Where-Object {
                $_.Condition -eq "'`$(TargetFramework)' == 'net11.0-android'"
              }
          )

          if ($androidPropertyGroups.Count -eq 0) {
            throw "Android PropertyGroup was not found."
          }

          Write-Host "Android PropertyGroup confirmed."

          Write-Host ""
          Write-Host "Diagnostics source files:"
          Write-Host "  Dg.cs              = $(Test-Path '.\src\runspace\Diagnostics\Dg.cs')"
          Write-Host "  AgentSettings.cs   = $(Test-Path '.\src\runspace\Diagnostics\AgentSettings.cs')"
          Write-Host "  PackageInfoDb.cs   = $(Test-Path '.\src\runspace\Diagnostics\PackageInfoDb.cs')"
          Write-Host "  SqliteProbe.cs     = $(Test-Path '.\src\runspace\Diagnostics\SqliteProbe.cs')"

          Write-Host ""
          Write-Host "Project validation succeeded."

      # ============================================================
      # 12. Install .NET Android workload
      # ============================================================

      - name: Install .NET Android workload
        shell: pwsh
        working-directory: subsystem
        run: |
          dotnet workload install android

          if ($LASTEXITCODE -ne 0) {
            throw "Android workload installation failed."
          }

          dotnet workload list

      # ============================================================
      # 13. Build native PowerShell library
      # ============================================================

      - name: Build native PowerShell Android library
        shell: pwsh
        working-directory: subsystem\src\runspace\native
        run: |
          Write-Host "=========================================="
          Write-Host "Building native PowerShell Android library"
          Write-Host "=========================================="

          & .\build-native.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "Native PowerShell build failed."
          }

          $nativeLib = ".\libs\arm64-v8a\libpsl-android.so"

          if (-not (Test-Path $nativeLib)) {
            throw "Native library was not created: $nativeLib"
          }

          $size = (Get-Item $nativeLib).Length

          if ($size -lt 1000) {
            throw "Native library looks suspiciously small: $size bytes"
          }

          Write-Host "Native library size: $size bytes"

      # ============================================================
      # 14. Prepare native library
      # ============================================================

      - name: Prepare native library
        shell: pwsh
        working-directory: subsystem
        run: |
          $source = `
            ".\src\runspace\native\libs\arm64-v8a\libpsl-android.so"

          $destination = `
            ".\src\runspace\libs\arm64-v8a\libpsl-android.so"

          if (-not (Test-Path $source)) {
            throw "Native library source not found: $source"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\src\runspace\libs\arm64-v8a" |
            Out-Null

          Copy-Item `
            -Path $source `
            -Destination $destination `
            -Force

          if (-not (Test-Path $destination)) {
            throw "Native library was not copied."
          }

          $size = (Get-Item $destination).Length

          Write-Host "Prepared native library: $size bytes"

      # ============================================================
      # 15. Apply CI compatibility fixes
      #
      # IMPORTANT:
      #  - Do NOT edit subsystem.master.csproj.
      #  - Do NOT add explicit Compile items.
      #  - Do NOT use XML manipulation.
      #
      # The official source declares diagnostics in:
      #     Subsystem.Diagnostics
      #
      # Some existing callers expect:
      #     Subsystem.Dg
      #     Subsystem.SqliteProbe
      #
      # We provide a small Android-only compatibility bridge.
      # ============================================================

      - name: Apply CI compatibility fixes
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Applying CI compatibility fixes"
          Write-Host "=========================================="

          # --------------------------------------------------------
          # A. ImmutableDictionary compatibility
          # --------------------------------------------------------

          $notificationFile = `
            ".\src\runspace\Services\NotificationService.cs"

          if (-not (Test-Path $notificationFile)) {
            throw "NotificationService.cs not found."
          }

          $notification = Get-Content `
            $notificationFile `
            -Raw

          $notification = $notification.Replace(
            'Notifications.TryRemove(sbn.Key, out _);',
            'Notifications = Notifications.Remove(sbn.Key);'
          )

          $notification = $notification.Replace(
            'Notifications[n.Key] = n;',
            'Notifications = Notifications.SetItem(n.Key, n);'
          )

          Set-Content `
            -Path $notificationFile `
            -Value $notification `
            -Encoding UTF8

          Write-Host "NotificationService.cs patched."

          # --------------------------------------------------------
          # B. Android diagnostics compatibility source
          #
          # We intentionally create this as a normal .cs source file.
          # No csproj modification is required because the SDK-style
          # project already includes .cs files automatically.
          # --------------------------------------------------------

          $compatFile = `
            ".\src\runspace\AndroidDiagnosticsCompat.cs"

          $compatLines = @(
            '#if ANDROID'
            'using Android.Content;'
            ''
            '// CI compatibility bridge for the current upstream source tree.'
            '// The real implementations live in Subsystem.Diagnostics.'
            ''
            'namespace Subsystem;'
            ''
            'public static class Dg'
            '{'
            '    public static void Initialize(Context context) => Diagnostics.Dg.Initialize(context);'
            '    public static void Log(string source, string message) => Diagnostics.Dg.Log(source, message);'
            '    public static void Trace(string source, string message) => Diagnostics.Dg.Trace(source, message);'
            '    public static void Debug(string source, string message) => Diagnostics.Dg.Debug(source, message);'
            '    public static void Info(string source, string message) => Diagnostics.Dg.Info(source, message);'
            '    public static void Warn(string source, string message) => Diagnostics.Dg.Warn(source, message);'
            '    public static void Warn(string source, System.Exception ex) => Diagnostics.Dg.Warn(source, ex);'
            '    public static void Error(string source, string message) => Diagnostics.Dg.Error(source, message);'
            '    public static void Error(string source, System.Exception ex) => Diagnostics.Dg.Error(source, ex);'
            '    public static void Write(Diagnostics.DgLevel level, string source, string message) => Diagnostics.Dg.Write(level, source, message);'
            '    public static string Snapshot() => Diagnostics.Dg.Snapshot();'
            '    public static string[] Recent(int n) => Diagnostics.Dg.Recent(n);'
            '    public static void RefreshStateTexture() => Diagnostics.Dg.RefreshStateTexture();'
            '}'
            ''
            'public static class SqliteProbe'
            '{'
            '    public static object SmokeTest() => Diagnostics.SqliteProbe.SmokeTest();'
            '}'
            '#endif'
          )

          [System.IO.File]::WriteAllText(
            $compatFile,
            ($compatLines -join [Environment]::NewLine),
            [System.Text.UTF8Encoding]::new($false)
          )

          if (-not (Test-Path $compatFile)) {
            throw "Android diagnostics compatibility file was not created."
          }

          Write-Host "AndroidDiagnosticsCompat.cs created."

          # --------------------------------------------------------
          # C. Add global using for Diagnostics namespace.
          #
          # This makes unqualified:
          #   Dg
          #   AgentSettings
          #   PackageInfoDb
          #   PackageInfo
          #
          # resolve correctly from Android sources.
          # --------------------------------------------------------

          $globalUsingsFile = `
            ".\src\runspace\AndroidDiagnosticsGlobalUsings.cs"

          $globalUsingLines = @(
            '#if ANDROID'
            'global using Subsystem.Diagnostics;'
            '#endif'
          )

          [System.IO.File]::WriteAllText(
            $globalUsingsFile,
            ($globalUsingLines -join [Environment]::NewLine),
            [System.Text.UTF8Encoding]::new($false)
          )

          if (-not (Test-Path $globalUsingsFile)) {
            throw "Android diagnostics global using file was not created."
          }

          Write-Host "AndroidDiagnosticsGlobalUsings.cs created."

          # --------------------------------------------------------
          # D. Verify generated compatibility files.
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Compatibility files:"
          Write-Host "  $compatFile"
          Write-Host "  $globalUsingsFile"

          Write-Host ""
          Write-Host "CI compatibility fixes completed."

      # ============================================================
      # 16. Verify Android diagnostics sources
      #
      # No manual Compile Include is used.
      # ============================================================

      - name: Verify Android diagnostics sources
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Verifying Android diagnostics sources"
          Write-Host "=========================================="

          $files = @(
            ".\src\runspace\Diagnostics\Dg.cs",
            ".\src\runspace\Diagnostics\AgentSettings.cs",
            ".\src\runspace\Diagnostics\PackageInfoDb.cs",
            ".\src\runspace\Diagnostics\SqliteProbe.cs",
            ".\src\runspace\AndroidDiagnosticsCompat.cs",
            ".\src\runspace\AndroidDiagnosticsGlobalUsings.cs"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Required diagnostics source is missing: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "No explicit Compile Include entries are being injected."
          Write-Host "SDK default Compile discovery remains enabled."

      # ============================================================
      # 17. Verify Android build configuration
      # ============================================================

      - name: Verify Android build configuration
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Android build configuration"
          Write-Host "=========================================="

          $project = Get-Content `
            ".\subsystem.master.csproj" `
            -Raw

          if ($project -notmatch "net11\.0-android") {
            throw "Android target framework not found."
          }

          $nativeLib = `
            ".\src\runspace\libs\arm64-v8a\libpsl-android.so"

          if (-not (Test-Path $nativeLib)) {
            throw "ARM64 native library is missing."
          }

          Write-Host "Target framework: net11.0-android"
          Write-Host "Minimum Android API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"
          Write-Host "Runtime: android-arm64"
          Write-Host "ABI: arm64-v8a"
          Write-Host "Native library: present"

      # ============================================================
      # 18. Restore
      # ============================================================

      - name: Restore Subsystem
        shell: pwsh
        working-directory: subsystem
        run: |
          dotnet restore .\subsystem.master.csproj `
            -p:TargetFramework=net11.0-android `
            -p:SupportedOSPlatformVersion=31.0 `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed."
          }

      # ============================================================
      # 19. Build Android ARM64
      # ============================================================

      - name: Build Android ARM64
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Building Subsystem for Android ARM64"
          Write-Host "=========================================="

          Write-Host "Minimum Android API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"
          Write-Host "Runtime: android-arm64"
          Write-Host "ABI: arm64-v8a"

          dotnet build .\subsystem.master.csproj `
            -c Release `
            -f net11.0-android `
            -r android-arm64 `
            --no-restore `
            -p:SubsystemRelease=true `
            -p:SupportedOSPlatformVersion=31.0 `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"

          if ($LASTEXITCODE -ne 0) {
            throw "Android ARM64 compilation failed."
          }

          Write-Host ""
          Write-Host "Android ARM64 compilation succeeded."

      # ============================================================
      # 20. Publish APK
      # ============================================================

      - name: Publish Android 12+ ARM64 APK
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "=========================================="
          Write-Host "Publishing Android ARM64 APK"
          Write-Host "=========================================="

          dotnet publish .\subsystem.master.csproj `
            -c Release `
            -f net11.0-android `
            -r android-arm64 `
            --self-contained true `
            --no-restore `
            -p:SubsystemRelease=true `
            -p:SupportedOSPlatformVersion=31.0 `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"

          if ($LASTEXITCODE -ne 0) {
            throw "Android publish failed."
          }

          Write-Host ""
          Write-Host "Android publish succeeded."

      # ============================================================
      # 21. Find generated APK
      # ============================================================

      - name: Find generated APK
        shell: pwsh
        working-directory: subsystem
        run: |
          Write-Host "Searching for APK files..."

          $apks = Get-ChildItem `
            -Path . `
            -Filter *.apk `
            -Recurse `
            -File

          if (-not $apks) {
            throw "No APK was produced."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "APK FILES"
          Write-Host "=========================================="

          foreach ($apk in $apks) {
            Write-Host ""
            Write-Host "FILE: $($apk.FullName)"
            Write-Host "SIZE: $([math]::Round($apk.Length / 1MB, 2)) MB"
          }

      # ============================================================
      # 22. Prepare final artifact
      # ============================================================

      - name: Prepare APK artifact
        shell: pwsh
        working-directory: subsystem
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "..\artifacts" |
            Out-Null

          $apks = Get-ChildItem `
            -Path . `
            -Filter *.apk `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -notmatch "\\obj\\"
            }

          if (-not $apks) {
            throw "Could not locate final APK."
          }

          $apk = $apks |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $apk) {
            throw "Could not select final APK."
          }

          $destination = `
            "..\artifacts\Subsystem-Android12-ARM64.apk"

          Copy-Item `
            -Path $apk.FullName `
            -Destination $destination `
            -Force

          if (-not (Test-Path $destination)) {
            throw "Final APK was not copied."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FINAL APK"
          Write-Host "=========================================="

          Get-Item $destination |
            Format-List FullName,Length,LastWriteTime

      # ============================================================
      # 23. Upload APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Subsystem-Android12-ARM64
          path: artifacts/Subsystem-Android12-ARM64.apk
          if-no-files-found: error
          retention-days: 14
