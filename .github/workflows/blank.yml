name: Build Subsystem Android 12 ARM64

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  DOTNET_VERSION: 11.0.100-preview.5.26302.115
  ANDROID_NDK_VERSION: 27.2.12479018

  MIN_ANDROID_API: 31
  TARGET_ANDROID_API: 36

jobs:
  build:
    name: Build Subsystem ARM64 APK for Android 12+
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Checkout workflow repository
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. Clone official Subsystem
      # ============================================================

      - name: Clone official Subsystem
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Cloning official Subsystem"
          Write-Host "=========================================="

          if (Test-Path ".\subsystem") {
            Remove-Item ".\subsystem" -Recurse -Force
          }

          git clone --depth 1 `
            https://github.com/MansfieldPlumbing/Subsystem.git `
            subsystem

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Subsystem."
          }

          if (-not (Test-Path ".\subsystem")) {
            throw "Subsystem directory was not created."
          }

          Write-Host "Subsystem cloned successfully."

      # ============================================================
      # 3. Setup exact .NET 11 Preview 5 SDK
      # ============================================================

      - name: Setup .NET 11 Preview 5
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ============================================================
      # 4. Setup JDK 17
      #
      # Use the Java version supported by the current Android
      # toolchain rather than forcing JDK 25.
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'

      # ============================================================
      # 5. Setup Android SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 6. Install Android SDK / Build Tools / NDK
      # ============================================================

      - name: Install Android SDK components
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Installing Android SDK components"
          Write-Host "=========================================="

          Write-Host "ANDROID_HOME:"
          Write-Host $env:ANDROID_HOME

          $sdkmanager = Join-Path `
            $env:ANDROID_HOME `
            "cmdline-tools\latest\bin\sdkmanager.bat"

          if (-not (Test-Path $sdkmanager)) {
            throw "sdkmanager not found: $sdkmanager"
          }

          & $sdkmanager `
            "platform-tools" `
            "platforms;android-${env:TARGET_ANDROID_API}" `
            "build-tools;36.0.0" `
            "ndk;${env:ANDROID_NDK_VERSION}"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK/NDK installation failed."
          }

          Write-Host ""
          Write-Host "Android SDK components installed successfully."

      # ============================================================
      # 7. Accept Android licenses
      # ============================================================

      - name: Accept Android SDK licenses
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Accepting Android licenses"
          Write-Host "=========================================="

          $sdkmanager = Join-Path `
            $env:ANDROID_HOME `
            "cmdline-tools\latest\bin\sdkmanager.bat"

          if (-not (Test-Path $sdkmanager)) {
            throw "sdkmanager not found: $sdkmanager"
          }

          1..100 |
            ForEach-Object { "y" } |
            & $sdkmanager --licenses

          if ($LASTEXITCODE -ne 0) {
            throw "Android license acceptance failed."
          }

      # ============================================================
      # 8. Configure Android NDK
      # ============================================================

      - name: Configure Android NDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Android NDK"
          Write-Host "=========================================="

          $ndk = Join-Path `
            $env:ANDROID_HOME `
            "ndk\${env:ANDROID_NDK_VERSION}"

          Write-Host "Expected NDK:"
          Write-Host $ndk

          if (-not (Test-Path $ndk)) {
            Write-Host ""
            Write-Host "Installed NDK directories:"

            $ndkRoot = Join-Path $env:ANDROID_HOME "ndk"

            if (Test-Path $ndkRoot) {
              Get-ChildItem $ndkRoot -Directory |
                Select-Object -ExpandProperty FullName
            }

            throw "Android NDK directory was not found: $ndk"
          }

          "ANDROID_NDK_HOME=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "ANDROID_NDK_ROOT=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "SS_NDK=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "ANDROID_NDK_HOME=$ndk"
          Write-Host "ANDROID_NDK_ROOT=$ndk"
          Write-Host "SS_NDK=$ndk"

      # ============================================================
      # 9. Pin .NET SDK for this repository
      #
      # This is the important fix.
      #
      # The previous failure used:
      #   36.1.99-preview.1
      #
      # We need:
      #   11.0.100-preview.5
      #
      # and the corresponding Android workload:
      #   36.99.0-preview.5
      # ============================================================

      - name: Pin .NET SDK 11 Preview 5
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Pinning .NET SDK"
          Write-Host "=========================================="

          $globalJson = @"
          {
            "sdk": {
              "version": "$env:DOTNET_VERSION",
              "rollForward": "disable",
              "allowPrerelease": true
            }
          }
          "@

          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "global.json"),
            $globalJson,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Created:"
          Write-Host (Join-Path (Get-Location) "global.json")

          Write-Host ""
          Write-Host "Requested SDK:"
          Write-Host $env:DOTNET_VERSION

          Write-Host ""
          Write-Host "Actual dotnet version:"
          dotnet --version

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet --version failed."
          }

          $actual = dotnet --version

          if ($actual.Trim() -ne $env:DOTNET_VERSION) {
            throw "Wrong .NET SDK selected. Expected $env:DOTNET_VERSION but got $actual"
          }

          Write-Host ""
          Write-Host "Correct .NET SDK is active."

      # ============================================================
      # 10. Inspect .NET SDK and workload manifests
      #
      # This step deliberately runs BEFORE workload installation.
      # ============================================================

      - name: Inspect .NET workload environment
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host ".NET SDK / workload environment"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "dotnet version:"
          dotnet --version

          Write-Host ""
          Write-Host "dotnet info:"
          dotnet --info

          Write-Host ""
          Write-Host "Existing workloads:"
          dotnet workload list

          Write-Host ""
          Write-Host "Workload manifests:"
          dotnet workload --info

      # ============================================================
      # 11. Remove stale Android workload installation
      #
      # Do NOT touch the SDK itself.
      # We only repair workloads belonging to the selected SDK.
      # ============================================================

      - name: Repair .NET workload installation
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Repairing .NET workload installation"
          Write-Host "=========================================="

          Write-Host "SDK:"
          dotnet --version

          Write-Host ""
          Write-Host "Running workload repair..."

          dotnet workload repair

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet workload repair failed."
          }

          Write-Host ""
          Write-Host "Workload repair completed."

      # ============================================================
      # 12. Install .NET Android workload
      #
      # IMPORTANT:
      # global.json forces preview.5.
      #
      # --skip-manifest-update prevents the command from replacing
      # the preview.5 manifest with another manifest.
      # ============================================================

      - name: Install .NET Android workload
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Installing .NET Android workload"
          Write-Host "=========================================="

          $sdk = dotnet --version

          Write-Host "Active SDK:"
          Write-Host $sdk

          if ($sdk.Trim() -ne $env:DOTNET_VERSION) {
            throw "Android workload installation attempted with wrong SDK: $sdk"
          }

          Write-Host ""
          Write-Host "Installing android workload..."

          dotnet workload install android --skip-manifest-update

          if ($LASTEXITCODE -ne 0) {
            throw "Android workload installation failed."
          }

          Write-Host ""
          Write-Host "Installed workloads:"
          dotnet workload list

      # ============================================================
      # 13. Verify Android workload
      # ============================================================

      - name: Verify Android workload
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Verifying Android workload"
          Write-Host "=========================================="

          $workloads = dotnet workload list | Out-String

          if ($workloads -notmatch "(?m)^\s*android\s+") {
            throw "Android workload is not installed."
          }

          Write-Host "Android workload is installed."

      # ============================================================
      # 14. Locate project
      # ============================================================

      - name: Locate subsystem.master.csproj
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Locating subsystem.master.csproj"
          Write-Host "=========================================="

          $project = Join-Path `
            (Get-Location) `
            "subsystem.master.csproj"

          if (-not (Test-Path $project)) {
            Write-Host ""
            Write-Host "Repository contents:"
            Get-ChildItem -Force

            Write-Host ""
            Write-Host "Searching recursively..."

            Get-ChildItem `
              -Path . `
              -Recurse `
              -Filter "subsystem.master.csproj" `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "subsystem.master.csproj was not found."
          }

          Write-Host "Project found:"
          Write-Host $project

          "SUBSYSTEM_PROJECT=$project" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 15. Verify source tree
      # ============================================================

      - name: Verify Subsystem source tree
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Verifying Subsystem source tree"
          Write-Host "=========================================="

          $requiredFiles = @(
            ".\subsystem.master.csproj",
            ".\src\runspace\native\build-native.ps1"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required source file is missing: $file"
            }

            Write-Host "OK: $file"
          }

      # ============================================================
      # 16. Validate project
      #
      # We do NOT modify the project file.
      # ============================================================

      - name: Validate subsystem.master.csproj
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Validating subsystem.master.csproj"
          Write-Host "=========================================="

          $projectFile = Join-Path `
            (Get-Location) `
            "subsystem.master.csproj"

          if (-not (Test-Path $projectFile)) {
            throw "Project file does not exist: $projectFile"
          }

          try {
            [xml]$projectXml = Get-Content `
              $projectFile `
              -Raw
          }
          catch {
            throw "Invalid project XML: $($_.Exception.Message)"
          }

          Write-Host "Project XML is valid."

          $projectText = Get-Content `
            $projectFile `
            -Raw

          if ($projectText -notmatch "net11\.0-android") {
            throw "net11.0-android target framework was not found."
          }

          Write-Host "Target framework net11.0-android confirmed."

          Write-Host ""
          Write-Host "Project:"
          Write-Host $projectFile

      # ============================================================
      # 17. Restore
      # ============================================================

      - name: Restore Subsystem Android
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Restoring Subsystem Android"
          Write-Host "=========================================="

          dotnet restore `
            ".\subsystem.master.csproj" `
            --framework net11.0-android

          if ($LASTEXITCODE -ne 0) {
            throw "Android restore failed."
          }

          Write-Host ""
          Write-Host "Restore completed successfully."

      # ============================================================
      # 18. Build native PowerShell Android library
      # ============================================================

      - name: Build native PowerShell Android library
        shell: pwsh
        working-directory: subsystem\src\runspace\native
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Building native PowerShell Android library"
          Write-Host "=========================================="

          if (-not (Test-Path ".\build-native.ps1")) {
            throw "build-native.ps1 was not found."
          }

          & .\build-native.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "Native PowerShell build failed."
          }

          $nativeLib = Join-Path `
            (Get-Location) `
            "libs\arm64-v8a\libpsl-android.so"

          if (-not (Test-Path $nativeLib)) {
            throw "Native library was not created: $nativeLib"
          }

          $size = (Get-Item $nativeLib).Length

          if ($size -lt 1000) {
            throw "Native library looks suspiciously small: $size bytes"
          }

          Write-Host "Native library:"
          Write-Host $nativeLib
          Write-Host "Size: $size bytes"

      # ============================================================
      # 19. Prepare native library
      # ============================================================

      - name: Prepare native library
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Preparing native library"
          Write-Host "=========================================="

          $source = Join-Path `
            (Get-Location) `
            "src\runspace\native\libs\arm64-v8a\libpsl-android.so"

          $destinationDirectory = Join-Path `
            (Get-Location) `
            "src\runspace\libs\arm64-v8a"

          $destination = Join-Path `
            $destinationDirectory `
            "libpsl-android.so"

          if (-not (Test-Path $source)) {
            throw "Native library source not found: $source"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $destinationDirectory |
            Out-Null

          Copy-Item `
            -Path $source `
            -Destination $destination `
            -Force

          if (-not (Test-Path $destination)) {
            throw "Native library was not copied: $destination"
          }

          $size = (Get-Item $destination).Length

          Write-Host "Prepared native library:"
          Write-Host $destination
          Write-Host "Size: $size bytes"

      # ============================================================
      # 20. Final source sanity check
      #
      # No $destination variable is assumed from another step.
      # Everything is calculated locally.
      # ============================================================

      - name: Final source sanity check
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Final source sanity check"
          Write-Host "=========================================="

          $projectFile = Join-Path `
            (Get-Location) `
            "subsystem.master.csproj"

          $nativeSource = Join-Path `
            (Get-Location) `
            "src\runspace\native\libs\arm64-v8a\libpsl-android.so"

          $nativePrepared = Join-Path `
            (Get-Location) `
            "src\runspace\libs\arm64-v8a\libpsl-android.so"

          if (-not (Test-Path $projectFile)) {
            throw "Project file missing: $projectFile"
          }
          Write-Host "OK: $projectFile"

          if (-not (Test-Path $nativeSource)) {
            throw "Native source library missing: $nativeSource"
          }

          Write-Host "OK: $nativeSource"

          if (-not (Test-Path $nativePrepared)) {
            throw "Prepared native library missing: $nativePrepared"
          }

          Write-Host "OK: $nativePrepared"

          $sourceSize = (Get-Item $nativeSource).Length
          $preparedSize = (Get-Item $nativePrepared).Length

          Write-Host ""
          Write-Host "Native source size:   $sourceSize bytes"
          Write-Host "Prepared size:        $preparedSize bytes"

          if ($sourceSize -ne $preparedSize) {
            throw "Native library size changed during preparation."
          }

          Write-Host ""
          Write-Host "Final source sanity check passed."

      # ============================================================
      # 21. Build Android ARM64
      # ============================================================

      - name: Build Subsystem Android ARM64
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Building Subsystem for Android ARM64"
          Write-Host "=========================================="

          Write-Host "Minimum Android API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"
          Write-Host "Runtime: android-arm64"
          Write-Host "ABI: arm64-v8a"
          Write-Host ""
          Write-Host ".NET SDK:"
          dotnet --version

          $sdk = dotnet --version

          if ($sdk.Trim() -ne $env:DOTNET_VERSION) {
            throw "Wrong SDK during build. Expected $env:DOTNET_VERSION, got $sdk"
          }

          dotnet build `
            ".\subsystem.master.csproj" `
            --framework net11.0-android `
            --runtime android-arm64 `
            --configuration Release `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
            throw "Android ARM64 compilation failed."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Android ARM64 build succeeded"
          Write-Host "=========================================="

      # ============================================================
      # 22. Locate generated APK
      # ============================================================

      - name: Locate generated APK
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Locating generated APK"
          Write-Host "=========================================="
          $apks = Get-ChildItem `
            -Path . `
            -Recurse `
            -Filter "*.apk" `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $apks -or $apks.Count -eq 0) {
            Write-Host "No APK files found."

            Write-Host ""
            Write-Host "Searching for Android output directories..."

            Get-ChildItem `
              -Path . `
              -Recurse `
              -Directory `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match "bin|publish|apk"
              } |
              Select-Object -First 100 -ExpandProperty FullName

            throw "Android APK was not generated."
          }

          Write-Host ""
          Write-Host "Generated APK files:"
          foreach ($apk in $apks) {
            $size = $apk.Length

            Write-Host ""
            Write-Host "APK: $($apk.FullName)"
            Write-Host "Size: $size bytes"

            if ($size -lt 100000) {
              throw "APK looks suspiciously small: $($apk.FullName)"
            }
          }

      # ============================================================
      # 23. Upload APK artifacts
      # ============================================================

      - name: Upload Android ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: subsystem-android-arm64
          path: |
            subsystem/**/*.apk
          if-no-files-found: error
          
