name: Build GenieX Chat Android

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: geniex_chat_android

  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.1.0"

  ANDROID_API: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK_VERSION: "27.3.13750724"

jobs:
  build:
    name: Build GenieX Chat APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Download Qualcomm source
      # ============================================================
      - name: Checkout Qualcomm AI Hub Apps
        uses: actions/checkout@v4
        with:
          repository: qualcomm/ai-hub-apps
          ref: apps/v0.34.0
          fetch-depth: 1

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 3. Gradle 9.1.0
      # ============================================================
      - name: Setup Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ============================================================
      # 4. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 5. Install exact Qualcomm Android toolchain
      # ============================================================
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME}"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ============================================================
      # 6. Verify exact repository structure
      # ============================================================
      - name: Verify Qualcomm project structure
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================================"
          echo "Repository"
          echo "================================================"

          pwd
          ls -la

          echo
          echo "================================================"
          echo "GenieX Chat directory"
          echo "================================================"

          test -d "${APP_DIR}"

          ls -la "${APP_DIR}"

          echo
          echo "================================================"
          echo "Required files"
          echo "================================================"

          test -f "${APP_DIR}/build.gradle"
          test -f "${APP_DIR}/settings.gradle"
          test -f "${APP_DIR}/gradle.properties"

          test -f "${APP_DIR}/_shared/android/common.gradle"

          test -d "${APP_DIR}/src"

          echo
          echo "All required files exist."

      # ============================================================
      # 7. Verify Qualcomm versions.env
      # ============================================================
      - name: Verify Qualcomm build versions
        shell: bash
        run: |
          set -euxo pipefail

          echo "Qualcomm versions.env:"
          cat "${APP_DIR}/scripts/versions.env"

          echo
          echo "Expected versions:"

          grep -F 'JAVA_SDK_VERSION="17.0.16-ms"' \
            "${APP_DIR}/scripts/versions.env"

          grep -F 'GRADLE_VERSION="9.1.0"' \
            "${APP_DIR}/scripts/versions.env"

          grep -F 'ANDROID_NDK_VERSION="27.3.13750724"' \
            "${APP_DIR}/scripts/versions.env"

          grep -F 'ANDROID_COMPILE_API="34"' \
            "${APP_DIR}/scripts/versions.env"

          grep -F 'ANDROID_TARGET_API="34"' \
            "${APP_DIR}/scripts/versions.env"

          grep -F 'ANDROID_MIN_API="31"' \
            "${APP_DIR}/scripts/versions.env"

      # ============================================================
      # 8. Verify Gradle configuration
      # ============================================================
      - name: Verify Gradle configuration
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "Gradle:"
          gradle --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Gradle tasks:"

          gradle \
            --no-daemon \
            --stacktrace \
            tasks

      # ============================================================
      # 9. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            assembleDebug

      # ============================================================
      # 10. List generated APKs
      # ============================================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "Generated APK files:"

          find "${APP_DIR}/build" \
            -type f \
            -name "*.apk" \
            -print

      # ============================================================
      # 11. Verify final APK
      # ============================================================
      - name: Verify final APK
        shell: bash
        run: |
          set -euxo pipefail

          APK="${APP_DIR}/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "APK successfully generated:"
          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

      # ============================================================
      # 12. Upload APK
      # ============================================================
      - name: Upload GenieX Chat APK
        uses: actions/upload-artifact@v4
        with:
          name: geniex-chat-android-debug
          path: geniex_chat_android/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 13. Upload complete build outputs
      # ============================================================
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: geniex-chat-android-build-outputs
          path: |
            geniex_chat_android/build/outputs/**
          if-no-files-found: warn
          retention-days: 7