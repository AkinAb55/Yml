name: Build Subsystem Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  DOTNET_VERSION: 11.0.100-preview.5.26302.115
  ANDROID_NDK_VERSION: 27.2.12479018
  MIN_ANDROID_API: 31
  TARGET_ANDROID_API: 36

jobs:
  build-android-arm64:
    name: Build Subsystem Android ARM64
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      # ============================================================
      # Diagnose repository layout
      # ============================================================

      - name: Inspect repository
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Repository inspection"
          Write-Host "=========================================="

          $repoRoot = Join-Path $env:GITHUB_WORKSPACE "repo"

          Write-Host "GITHUB_WORKSPACE:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Repository root:"
          Write-Host $repoRoot

          if (-not (Test-Path $repoRoot)) {
            throw "Repository checkout directory does not exist: $repoRoot"
          }

          Write-Host ""
          Write-Host "Top-level repository entries:"
          Get-ChildItem `
            -Path $repoRoot `
            -Force |
            Select-Object Mode, Name, FullName |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "All project files:"
          $projects = @(
            Get-ChildItem `
              -Path $repoRoot `
              -Recurse `
              -Filter "*.csproj" `
              -File `
              -ErrorAction SilentlyContinue
          )

          if ($projects.Count -eq 0) {
            Write-Host "NO .csproj files found."
          }
          else {
            $projects |
              Select-Object -ExpandProperty FullName
          }

          Write-Host ""
          Write-Host "Searching specifically for subsystem.master.csproj:"

          $subsystemProjects = @(
            Get-ChildItem `
              -Path $repoRoot `
              -Recurse `
              -Filter "subsystem.master.csproj" `
              -File `
              -ErrorAction SilentlyContinue
          )

          if ($subsystemProjects.Count -eq 0) {
            Write-Host "subsystem.master.csproj NOT FOUND."
            throw "The checked-out repository does not contain subsystem.master.csproj."
          }

          foreach ($project in $subsystemProjects) {
            Write-Host "FOUND: $($project.FullName)"
          }

          $projectFile = $subsystemProjects[0].FullName
          $projectDirectory = Split-Path $projectFile -Parent

          Write-Host ""
          Write-Host "Selected project:"
          Write-Host $projectFile

          Write-Host ""
          Write-Host "Project directory:"
          Write-Host $projectDirectory

          "SUBSYSTEM_PROJECT=$projectFile" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "SUBSYSTEM_DIR=$projectDirectory" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "SUBSYSTEM_REPO_ROOT=$repoRoot" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      # ============================================================
      # .NET
      # ============================================================

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ============================================================
      # Java
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      # ============================================================
      # Android SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # Android SDK / NDK
      # ============================================================

      - name: Install Android SDK and NDK
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Installing Android toolchain"
          Write-Host "=========================================="

          Write-Host "ANDROID_HOME: $env:ANDROID_HOME"
          Write-Host "NDK version: $env:ANDROID_NDK_VERSION"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"

          if (-not $env:ANDROID_HOME) {
            throw "ANDROID_HOME is not defined."
          }

          sdkmanager --version

          sdkmanager `
            "platform-tools" `
            "platforms;android-$env:TARGET_ANDROID_API" `
            "build-tools;36.0.0" `
            "ndk;$env:ANDROID_NDK_VERSION"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK/NDK installation failed."
          }

      # ============================================================
      # Validate NDK
      # ============================================================

      - name: Validate Android NDK
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Validating Android NDK"
          Write-Host "=========================================="

          $ndk = Join-Path `
            $env:ANDROID_HOME `
            "ndk\$env:ANDROID_NDK_VERSION"

          Write-Host "Expected NDK:"
          Write-Host $ndk

          if (-not (Test-Path $ndk)) {
            Write-Host ""
            Write-Host "Available NDK installations:"

            $ndkRoot = Join-Path $env:ANDROID_HOME "ndk"

            if (Test-Path $ndkRoot) {
              Get-ChildItem `
                $ndkRoot `
                -Directory |
                Select-Object -ExpandProperty FullName
            }
            else {
              Write-Host "NDK directory does not exist: $ndkRoot"
            }

            throw "Android NDK directory was not found: $ndk"
          }

          Write-Host "NDK found."

          "ANDROID_NDK_HOME=$ndk" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "SS_NDK=$ndk" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      # ============================================================
      # Project XML validation
      # ============================================================

      - name: Validate subsystem.master.csproj
        working-directory: ${{ env.SUBSYSTEM_DIR }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Validating subsystem.master.csproj"
          Write-Host "=========================================="

          Write-Host "Project:"
          Write-Host $env:SUBSYSTEM_PROJECT

          if (-not (Test-Path $env:SUBSYSTEM_PROJECT)) {
            throw "Project does not exist: $env:SUBSYSTEM_PROJECT"
          }

          try {
            [xml]$projectXml = Get-Content `
              -Path $env:SUBSYSTEM_PROJECT `
              -Raw
          }
          catch {
            throw "subsystem.master.csproj is not valid XML: $($_.Exception.Message)"
          }

          Write-Host "Project XML is valid."

          $targetFrameworks = `
            $projectXml.Project.PropertyGroup.TargetFrameworks

          if (-not $targetFrameworks) {
            throw "TargetFrameworks element was not found."
          }

          Write-Host "TargetFrameworks:"
          Write-Host $targetFrameworks

          if ($targetFrameworks -notmatch "net11\.0-android") {
            throw "net11.0-android target framework is missing."
          }

          $androidPropertyGroups = @(
            $projectXml.Project.PropertyGroup |
              Where-Object {
                $_.Condition -eq "'`$(TargetFramework)' == 'net11.0-android'"
              }
          )

          if ($androidPropertyGroups.Count -eq 0) {
            throw "Android PropertyGroup was not found."
          }

          Write-Host "Android PropertyGroup confirmed."

      # ============================================================
      # Check diagnostics source files
      #
      # IMPORTANT:
      # We only verify physical files here.
      # We do NOT add explicit Compile items.
      # ============================================================

      - name: Verify Diagnostics source files
        working-directory: ${{ env.SUBSYSTEM_DIR }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Checking Diagnostics source files"
          Write-Host "=========================================="

          $requiredFiles = @(
            "src\runspace\Diagnostics\Dg.cs",
            "src\runspace\Diagnostics\AgentSettings.cs",
            "src\runspace\Diagnostics\PackageInfoDb.cs",
            "src\runspace\Diagnostics\SqliteProbe.cs"
          )

          foreach ($relativePath in $requiredFiles) {
            $fullPath = Join-Path `
              $env:SUBSYSTEM_DIR `
              $relativePath

            if (-not (Test-Path $fullPath)) {
              throw "Required source file is missing: $relativePath"
            }

            Write-Host "FOUND: $relativePath"
          }

          Write-Host ""
          Write-Host "All Diagnostics source files are present."

      # ============================================================
      # Restore
      # ============================================================

      - name: Restore Android dependencies
        working-directory: ${{ env.SUBSYSTEM_DIR }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Restoring Android dependencies"
          Write-Host "=========================================="

          dotnet restore .\subsystem.master.csproj `
            -p:TargetFramework=net11.0-android `
            -r android-arm64 `
            -p:SupportedOSPlatformVersion=31.0 `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"

          if ($LASTEXITCODE -ne 0) {
            throw "Android dependency restore failed."
          }

      # ============================================================
      # MSBuild Compile inspection
      # ============================================================

      - name: Verify MSBuild Compile items
        working-directory: ${{ env.SUBSYSTEM_DIR }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Checking MSBuild Compile items"
          Write-Host "=========================================="

          $compileList = dotnet msbuild `
            .\subsystem.master.csproj `
            -p:TargetFramework=net11.0-android `
            -p:SupportedOSPlatformVersion=31.0 `
            -getItem:Compile

          if ($LASTEXITCODE -ne 0) {
            throw "Could not query MSBuild Compile items."
          }

          $compileText = $compileList | Out-String

          $requiredCompileFiles = @(
            "Dg.cs",
            "AgentSettings.cs",
            "PackageInfoDb.cs",
            "SqliteProbe.cs"
          )

          foreach ($name in $requiredCompileFiles) {
            if ($compileText -notmatch [regex]::Escape($name)) {
              throw "$name is NOT part of the Android Compile items."
            }

            Write-Host "Compile item confirmed: $name"
          }

          Write-Host ""
          Write-Host "All required Compile items are present."
          Write-Host "No explicit duplicate Compile entries are being added."

      # ============================================================
      # Build
      # ============================================================

      - name: Build Subsystem for Android ARM64
        working-directory: ${{ env.SUBSYSTEM_DIR }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Building Subsystem for Android ARM64"
          Write-Host "=========================================="

          Write-Host "Minimum Android API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"
          Write-Host "Runtime: android-arm64"
          Write-Host "ABI: arm64-v8a"

          dotnet build .\subsystem.master.csproj `
            -c Release `
            -f net11.0-android `
            -r android-arm64 `
            --no-restore `
            -p:SubsystemRelease=true `
            -p:SupportedOSPlatformVersion=31.0 `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"

          if ($LASTEXITCODE -ne 0) {
            throw "Android ARM64 compilation failed."
          }

          Write-Host ""
          Write-Host "Android ARM64 compilation succeeded."

      # ============================================================
      # Output
      # ============================================================

      - name: Locate Android output
        working-directory: ${{ env.SUBSYSTEM_DIR }}
        if: always()
        run: |
          Write-Host "=========================================="
          Write-Host "Android build output"
          Write-Host "=========================================="

          $files = @(
            Get-ChildItem `
              -Path . `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Extension -in @(
                  ".apk",
                  ".aab",
                  ".dll"
                ) -and
                $_.FullName -match "\\bin\\"
              }
          )

          if ($files.Count -eq 0) {
            Write-Host "No Android output files found."
          }
          else {
            $files |
              Select-Object FullName, Length |
              Format-Table -AutoSize
          }

      # ============================================================
      # Artifacts
      # ============================================================

      - name: Upload Android artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: subsystem-android-arm64
          path: |
            repo/**/bin/**/*.apk
            repo/**/bin/**/*.aab
            repo/**/bin/**/*.dll
          if-no-files-found: warn
