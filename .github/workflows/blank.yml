name: Build Subsystem Android 12 ARM64

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  DOTNET_VERSION: 11.0.100-preview.5.26302.115
  ANDROID_NDK_VERSION: 27.2.12479018

  # Android 12
  MIN_ANDROID_API: 31

  # Modern Android SDK
  TARGET_ANDROID_API: 36

jobs:
  build:
    name: Build Subsystem ARM64 APK for Android 12+
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Checkout workflow repository
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. Clone official Subsystem
      # ============================================================

      - name: Clone official Subsystem
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Cloning Subsystem"
          Write-Host "=========================================="

          if (Test-Path ".\subsystem") {
            Remove-Item ".\subsystem" -Recurse -Force
          }

          git clone --depth 1 `
            https://github.com/MansfieldPlumbing/Subsystem.git `
            subsystem

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Subsystem."
          }

          if (-not (Test-Path ".\subsystem")) {
            throw "Subsystem directory was not created."
          }

          Write-Host "Subsystem cloned successfully."

      # ============================================================
      # 3. Setup exact .NET SDK
      # ============================================================

      - name: Setup .NET 11 Preview
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ============================================================
      # 4. Setup JDK 17
      #
      # The current .NET Android toolchain works correctly with the
      # JDK supplied by the Windows runner.
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "17"

      # ============================================================
      # 5. Setup Android SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 6. Install Android SDK / Build Tools / NDK
      # ============================================================

      - name: Install Android SDK components
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Installing Android SDK components"
          Write-Host "=========================================="

          $sdkRoot = $env:ANDROID_HOME

          if (-not $sdkRoot) {
            $sdkRoot = $env:ANDROID_SDK_ROOT
          }

          if (-not $sdkRoot) {
            throw "ANDROID_HOME / ANDROID_SDK_ROOT is not defined."
          }

          Write-Host "ANDROID_HOME: $sdkRoot"

          $sdkmanager = Join-Path `
            $sdkRoot `
            "cmdline-tools\latest\bin\sdkmanager.bat"

          if (-not (Test-Path -LiteralPath $sdkmanager)) {
            throw "sdkmanager not found: $sdkmanager"
          }

          & $sdkmanager `
            "platform-tools" `
            "platforms;android-${env:TARGET_ANDROID_API}" `
            "build-tools;36.0.0" `
            "ndk;${env:ANDROID_NDK_VERSION}"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK/NDK installation failed."
          }

          Write-Host ""
          Write-Host "Android SDK components installed successfully."

      # ============================================================
      # 7. Accept Android licenses
      # ============================================================

      - name: Accept Android SDK licenses
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdkRoot = $env:ANDROID_HOME

          if (-not $sdkRoot) {
            $sdkRoot = $env:ANDROID_SDK_ROOT
          }

          $sdkmanager = Join-Path `
            $sdkRoot `
            "cmdline-tools\latest\bin\sdkmanager.bat"

          if (-not (Test-Path -LiteralPath $sdkmanager)) {
            throw "sdkmanager not found: $sdkmanager"
          }

          1..100 | ForEach-Object {
            "y"
          } | & $sdkmanager --licenses

          if ($LASTEXITCODE -ne 0) {
            throw "Android license acceptance failed."
          }

          Write-Host "Android licenses accepted."

      # ============================================================
      # 8. Configure Android NDK
      # ============================================================

      - name: Configure Android NDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Android toolchain"
          Write-Host "=========================================="

          $sdkRoot = $env:ANDROID_HOME

          if (-not $sdkRoot) {
            $sdkRoot = $env:ANDROID_SDK_ROOT
          }

          $ndk = Join-Path `
            $sdkRoot `
            "ndk\${env:ANDROID_NDK_VERSION}"

          Write-Host "ANDROID_HOME: $sdkRoot"
          Write-Host "NDK: $ndk"
          Write-Host "Minimum API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"

          if (-not (Test-Path -LiteralPath $ndk -PathType Container)) {
            Write-Host ""
            Write-Host "Installed NDK directories:"

            $ndkRoot = Join-Path $sdkRoot "ndk"

            if (Test-Path $ndkRoot) {
              Get-ChildItem `
                -Path $ndkRoot `
                -Directory |
                Select-Object -ExpandProperty FullName
            }

            throw "Android NDK directory was not found: $ndk"
          }

          "ANDROID_NDK_HOME=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "SS_NDK=$ndk" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "ANDROID_NDK_HOME=$ndk"
          Write-Host "SS_NDK=$ndk"

      # ============================================================
      # 9. Show complete toolchain
      # ============================================================

      - name: Show toolchain
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host ".NET"
          Write-Host "=========================================="

          dotnet --info

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Java"
          Write-Host "=========================================="

          java -version

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Android"
          Write-Host "=========================================="

          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
          Write-Host "ANDROID_NDK_HOME=$env:ANDROID_NDK_HOME"
          Write-Host "SS_NDK=$env:SS_NDK"

          if (-not (Test-Path -LiteralPath $env:ANDROID_NDK_HOME)) {
            throw "Configured Android NDK does not exist."
          }

      # ============================================================
      # 10. Verify Subsystem source tree
      # ============================================================

      - name: Verify Subsystem source tree
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Verifying Subsystem source tree"
          Write-Host "=========================================="

          $projectFile = Join-Path $PWD "subsystem.master.csproj"

          if (-not (Test-Path -LiteralPath $projectFile -PathType Leaf)) {
            Write-Host ""
            Write-Host "Repository root:"
            Write-Host $PWD

            Write-Host ""
            Write-Host "Available project files:"

            Get-ChildItem `
              -Path $PWD `
              -Recurse `
              -Filter "*.csproj" `
              -File `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "subsystem.master.csproj was not found."
          }

          Write-Host "OK: subsystem.master.csproj"

          $requiredFiles = @(
            ".\src\runspace\Diagnostics\Dg.cs",
            ".\src\runspace\Diagnostics\AgentSettings.cs",
            ".\src\runspace\Diagnostics\PackageInfoDb.cs",
            ".\src\runspace\Diagnostics\SqliteProbe.cs",
            ".\src\runspace\native\build-native.ps1"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required source file is missing: $file"
            }

            Write-Host "OK: $file"
          }

      # ============================================================
      # 11. Validate project XML
      #
      # IMPORTANT:
      # We deliberately do NOT modify subsystem.master.csproj.
      #
      # SDK-style .NET projects already include .cs files
      # automatically. Adding explicit Compile entries causes
      # NETSDK1022 duplicate Compile errors.
      # ============================================================

      - name: Validate subsystem.master.csproj
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Validating subsystem.master.csproj"
          Write-Host "=========================================="

          $projectFile = Join-Path $PWD "subsystem.master.csproj"

          [xml]$projectXml = Get-Content `
            -LiteralPath $projectFile `
            -Raw

          Write-Host "Project XML is valid."

          $targetFrameworks = @(
            $projectXml.Project.PropertyGroup.TargetFrameworks
          ) -join ";"

          $targetFramework = @(
            $projectXml.Project.PropertyGroup.TargetFramework
          ) -join ";"

          Write-Host "TargetFrameworks: $targetFrameworks"
          Write-Host "TargetFramework:  $targetFramework"

          $allFrameworks = "$targetFrameworks;$targetFramework"

          if ($allFrameworks -notmatch "net11\.0-android") {
            throw "net11.0-android target framework is missing."
          }

          Write-Host "Android target confirmed."

          Write-Host ""
          Write-Host "Diagnostics sources:"

          @(
            ".\src\runspace\Diagnostics\Dg.cs",
            ".\src\runspace\Diagnostics\AgentSettings.cs",
            ".\src\runspace\Diagnostics\PackageInfoDb.cs",
            ".\src\runspace\Diagnostics\SqliteProbe.cs"
          ) | ForEach-Object {
            Write-Host "  $_ = $(Test-Path -LiteralPath $_)"
          }

          Write-Host ""
          Write-Host "Project validation succeeded."

      # ============================================================
      # 12. Install .NET Android workload
      # ============================================================

      - name: Install .NET Android workload
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Installing .NET Android workload"
          Write-Host "=========================================="

          dotnet workload install android --skip-manifest-update

          if ($LASTEXITCODE -ne 0) {
            throw "Android workload installation failed."
          }

          dotnet workload list

      # ============================================================
      # 13. Build native PowerShell Android library
      # ============================================================

      - name: Build native PowerShell Android library
        shell: pwsh
        working-directory: subsystem\src\runspace\native
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Building native PowerShell Android library"
          Write-Host "=========================================="

          if (-not (Test-Path -LiteralPath ".\build-native.ps1" -PathType Leaf)) {
            throw "build-native.ps1 was not found."
          }

          & .\build-native.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "Native PowerShell build failed."
          }

          $nativeLib = Join-Path `
            $PWD `
            "libs\arm64-v8a\libpsl-android.so"

          if (-not (Test-Path -LiteralPath $nativeLib -PathType Leaf)) {
            throw "Native library was not created: $nativeLib"
          }

          $size = (Get-Item -LiteralPath $nativeLib).Length

          if ($size -lt 1000) {
            throw "Native library looks suspiciously small: $size bytes"
          }

          Write-Host "Native library created."
          Write-Host "Path: $nativeLib"
          Write-Host "Size: $size bytes"

      # ============================================================
      # 14. Prepare native library for the managed project
      # ============================================================

      - name: Prepare native library
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          $source = Join-Path `
            $PWD `
            "src\runspace\native\libs\arm64-v8a\libpsl-android.so"

          $destinationDirectory = Join-Path `
            $PWD `
            "src\runspace\libs\arm64-v8a"

          $destination = Join-Path `
            $destinationDirectory `
            "libpsl-android.so"

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Native library source not found: $source"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $destinationDirectory |
            Out-Null

          Copy-Item `
            -LiteralPath $source `
            -Destination $destination `
            -Force

          if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) {
            throw "Native library was not copied: $destination"
          }

          $sourceSize = (Get-Item -LiteralPath $source).Length
          $destinationSize = (Get-Item -LiteralPath $destination).Length

          if ($destinationSize -ne $sourceSize) {
            throw "Native library copy size mismatch."
          }

          Write-Host "Prepared native library."
          Write-Host "Source:"
          Write-Host "  $source"

          Write-Host "Destination:"
          Write-Host "  $destination"

          Write-Host "Size:"
          Write-Host "  $destinationSize bytes"

      # ============================================================
      # 15. Apply CI compatibility fixes
      #
      # No modification of subsystem.master.csproj.
      # No explicit Compile Include entries.
      # ============================================================

      - name: Apply CI compatibility fixes
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Applying CI compatibility fixes"
          Write-Host "=========================================="

          # --------------------------------------------------------
          # A. NotificationService immutable collection compatibility
          # --------------------------------------------------------

          $notificationFile = Join-Path `
            $PWD `
            "src\runspace\Services\NotificationService.cs"

          if (Test-Path -LiteralPath $notificationFile -PathType Leaf) {

            $notification = Get-Content `
              -LiteralPath $notificationFile `
              -Raw

            $notification = $notification.Replace(
              'Notifications.TryRemove(sbn.Key, out _);',
              'Notifications = Notifications.Remove(sbn.Key);'
            )

            $notification = $notification.Replace(
              'Notifications[n.Key] = n;',
              'Notifications = Notifications.SetItem(n.Key, n);'
            )

            Set-Content `
              -LiteralPath $notificationFile `
              -Value $notification `
              -Encoding UTF8

            Write-Host "NotificationService.cs checked/patched."
          }
          else {
            Write-Host "NotificationService.cs not present; skipping."
          }

          # --------------------------------------------------------
          # B. Android compatibility bridge
          #
          # This file is intentionally placed inside src/runspace.
          # SDK-style project discovery automatically includes it.
          # --------------------------------------------------------

          
          $compatFile = Join-Path `
            $PWD `
            "src\runspace\AndroidDiagnosticsCompat.cs"

          $compatLines = @(
            '#if ANDROID'
            ''
            'using Android.Content;'
            ''
            'namespace Subsystem;'
            ''
            '/// <summary>'
            '/// Android compatibility bridge for legacy callers.'
            '/// </summary>'
            'public static class Dg'
            '{'
            '    public static void Initialize(Context context)'
            '        => Diagnostics.Dg.Initialize(context);'
            ''
            '    public static void Log(string source, string message)'
            '        => Diagnostics.Dg.Log(source, message);'
            ''
            '    public static void Trace(string source, string message)'
            '        => Diagnostics.Dg.Trace(source, message);'
            ''
            '    public static void Debug(string source, string message)'
            '        => Diagnostics.Dg.Debug(source, message);'
            ''
            '    public static void Info(string source, string message)'
            '        => Diagnostics.Dg.Info(source, message);'
            ''
            '    public static void Warn(string source, string message)'
            '        => Diagnostics.Dg.Warn(source, message);'
            ''
            '    public static void Warn(string source, System.Exception exception)'
            '        => Diagnostics.Dg.Warn(source, exception);'
            ''
            '    public static void Error(string source, string message)'
            '        => Diagnostics.Dg.Error(source, message);'
            ''
            '    public static void Error(string source, System.Exception exception)'
            '        => Diagnostics.Dg.Error(source, exception);'
            ''
            '    public static string Snapshot()'
            '        => Diagnostics.Dg.Snapshot();'
            ''
            '    public static string[] Recent(int count)'
            '        => Diagnostics.Dg.Recent(count);'
            ''
            '    public static void RefreshStateTexture()'
            '        => Diagnostics.Dg.RefreshStateTexture();'
            '}'
            ''
            'public static class SqliteProbe'
            '{'
            '    public static object SmokeTest()'
            '        => Diagnostics.SqliteProbe.SmokeTest();'
            '}'
            ''
            '#endif'
          )

          [System.IO.File]::WriteAllText(
            $compatFile,
            ($compatLines -join [Environment]::NewLine),
            [System.Text.UTF8Encoding]::new($false)
          )

          if (-not (Test-Path -LiteralPath $compatFile -PathType Leaf)) {
            throw "Android diagnostics compatibility file was not created."
          }

          Write-Host "AndroidDiagnosticsCompat.cs created."

          # --------------------------------------------------------
          # C. Global using for diagnostics namespace
          # --------------------------------------------------------

          $globalUsingsFile = Join-Path `
            $PWD `
            "src\runspace\AndroidDiagnosticsGlobalUsings.cs"

          $globalUsingLines = @(
            '#if ANDROID'
            'global using Subsystem.Diagnostics;'
            '#endif'
          )

          [System.IO.File]::WriteAllText(
            $globalUsingsFile,
            ($globalUsingLines -join [Environment]::NewLine),
            [System.Text.UTF8Encoding]::new($false)
          )

          if (-not (Test-Path -LiteralPath $globalUsingsFile -PathType Leaf)) {
            throw "Android diagnostics global using file was not created."
          }

          Write-Host "AndroidDiagnosticsGlobalUsings.cs created."

          Write-Host ""
          Write-Host "CI compatibility fixes completed."

      # ============================================================
      # 16. Verify compatibility sources
      # ============================================================

      - name: Verify Android diagnostics sources
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Verifying Android diagnostics sources"
          Write-Host "=========================================="

          $files = @(
            ".\src\runspace\Diagnostics\Dg.cs",
            ".\src\runspace\Diagnostics\AgentSettings.cs",
            ".\src\runspace\Diagnostics\PackageInfoDb.cs",
            ".\src\runspace\Diagnostics\SqliteProbe.cs",
            ".\src\runspace\AndroidDiagnosticsCompat.cs",
            ".\src\runspace\AndroidDiagnosticsGlobalUsings.cs"
          )

          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required diagnostics source is missing: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "No explicit Compile Include entries are injected."
          Write-Host "SDK default Compile discovery remains enabled."

      # ============================================================
      # 17. Verify Android build configuration
      # ============================================================

      - name: Verify Android build configuration
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Android build configuration"
          Write-Host "=========================================="

          $projectFile = Join-Path `
            $PWD `
            "subsystem.master.csproj"

          if (-not (Test-Path -LiteralPath $projectFile -PathType Leaf)) {
            throw "Project file not found: $projectFile"
          }

          $project = Get-Content `
            -LiteralPath $projectFile `
            -Raw

          if ($project -notmatch "net11\.0-android") {
            throw "Android target framework not found."
          }

          $nativeLib = Join-Path `
            $PWD `
            "src\runspace\libs\arm64-v8a\libpsl-android.so"

          if (-not (Test-Path -LiteralPath $nativeLib -PathType Leaf)) {
            throw "Prepared ARM64 native library is missing: $nativeLib"
          }

          $nativeSize = (Get-Item -LiteralPath $nativeLib).Length

          Write-Host "Target framework: net11.0-android"
          Write-Host "Minimum Android API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"
          Write-Host "Runtime: android-arm64"
          Write-Host "ABI: arm64-v8a"
          Write-Host "Native library: present"
          Write-Host "Native library size: $nativeSize bytes"

      # ============================================================
      # 18. Restore Android project
      # ============================================================

      - name: Restore Subsystem Android
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Restoring Subsystem Android"
          Write-Host "=========================================="

          dotnet restore `
            ".\subsystem.master.csproj" `
            --framework net11.0-android

          if ($LASTEXITCODE -ne 0) {
            throw "Android restore failed."
          }

          Write-Host ""
          Write-Host "Android restore completed successfully."

      # ============================================================
      # 19. Build Android ARM64
      # ============================================================

      - name: Build Subsystem Android ARM64
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Building Subsystem for Android ARM64"
          Write-Host "=========================================="

          Write-Host "Minimum Android API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"
          Write-Host "Runtime: android-arm64"
          Write-Host "ABI: arm64-v8a"

          dotnet build `
            ".\subsystem.master.csproj" `
            --configuration Release `
            --framework net11.0-android `
            --runtime android-arm64 `
            -p:AndroidSupportedAbis=arm64-v8a `
            -p:AndroidMinSdkVersion=$env:MIN_ANDROID_API `
            -p:AndroidTargetSdkVersion=$env:TARGET_ANDROID_API `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
            throw "Android ARM64 compilation failed."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "ANDROID ARM64 BUILD SUCCEEDED"
          Write-Host "=========================================="

      # ============================================================
      # 20. Locate generated APK
      # ============================================================

      - name: Locate generated APK
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "Locating generated APK"
          Write-Host "=========================================="

          $apkFiles = @(
            Get-ChildItem `
              -Path $PWD `
              -Recurse `
              -Filter "*.apk" `
              -File `
              -ErrorAction SilentlyContinue
          )

          if ($apkFiles.Count -eq 0) {
            Write-Host ""
            Write-Host "No APK files found."

            Write-Host ""
            Write-Host "Searching for Android build output:"
            Get-ChildItem `
              -Path $PWD `
              -Recurse `
              -Directory `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match "bin|publish|apk"
              } |
              Select-Object -First 100 -ExpandProperty FullName

            throw "Android ARM64 build completed but no APK was found."
          }

          Write-Host ""
          Write-Host "Generated APK files:"

          foreach ($apk in $apkFiles) {
            $size = $apk.Length

            Write-Host ""
            Write-Host "APK:"
            Write-Host "  $($apk.FullName)"
            Write-Host "  Size: $size bytes"

            if ($size -lt 10000) {
              Write-Warning "APK looks unusually small: $size bytes"
            }
          }

          # Select the largest APK as the primary artifact.
          $primaryApk = $apkFiles |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $primaryApk) {
            throw "Unable to select primary APK."
          }

          "PRIMARY_APK=$($primaryApk.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "Primary APK:"
          Write-Host $primaryApk.FullName

      # ============================================================
      # 21. Upload APK artifact
      # ============================================================

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: subsystem-android-arm64
          path: |
            subsystem/**/*.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 22. Final summary
      # ============================================================

      - name: Final build summary
        shell: pwsh
        working-directory: subsystem
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "BUILD COMPLETE"
          Write-Host "=========================================="

          Write-Host "Project:"
          Write-Host "  subsystem.master.csproj"

          Write-Host ""
          Write-Host "Target:"
          Write-Host "  net11.0-android"

          Write-Host ""
          Write-Host "Runtime:"
          Write-Host "  android-arm64"

          Write-Host ""
          Write-Host "ABI:"
          Write-Host "  arm64-v8a"

          Write-Host ""
          Write-Host "Minimum Android API:"
          Write-Host "  $env:MIN_ANDROID_API"

          Write-Host ""
          Write-Host "Compile SDK:"
          Write-Host "  $env:TARGET_ANDROID_API"

          Write-Host ""
          Write-Host "NDK:"
          Write-Host "  $env:ANDROID_NDK_HOME"

          Write-Host ""
          Write-Host "Primary APK:"
          Write-Host "  $env:PRIMARY_APK"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "SUCCESS"
          Write-Host "=========================================="
