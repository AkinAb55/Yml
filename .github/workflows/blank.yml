name: Build Subsystem Android ARM64

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: "11.0.100-preview.5.26302.115"
  ANDROID_NDK_VERSION: "27.2.12479018"
  MIN_ANDROID_API: "31"
  TARGET_ANDROID_API: "36"

jobs:
  build-android-arm64:
    name: Build Subsystem Android ARM64
    runs-on: windows-latest

    env:
      DOTNET_ROOT: "C:\\Program Files\\dotnet"
      ANDROID_HOME: "C:\\Android\\android-sdk"
      ANDROID_SDK_ROOT: "C:\\Android\\android-sdk"
      ANDROID_NDK_HOME: "C:\\Android\\android-sdk\\ndk\\27.2.12479018"
      SS_NDK: "C:\\Android\\android-sdk\\ndk\\27.2.12479018"

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # Toolchain
      # ============================================================

      - name: Configure .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.100-preview.5.26302.115"

      - name: Configure Android SDK and NDK
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Android toolchain"
          Write-Host "=========================================="

          Write-Host "ANDROID_HOME: $env:ANDROID_HOME"
          Write-Host "NDK: $env:ANDROID_NDK_HOME"
          Write-Host "Minimum API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"

          if (-not (Test-Path $env:ANDROID_HOME)) {
            throw "Android SDK directory was not found: $env:ANDROID_HOME"
          }

          if (-not (Test-Path $env:ANDROID_NDK_HOME)) {
            throw "Android NDK directory was not found: $env:ANDROID_NDK_HOME"
          }

          $adb = Join-Path $env:ANDROID_HOME "platform-tools"
          $buildTools = Join-Path $env:ANDROID_HOME "build-tools"
          $platform = Join-Path $env:ANDROID_HOME "platforms\android-$env:TARGET_ANDROID_API"

          Write-Host "SDK: OK"
          Write-Host "NDK: OK"

          if (-not (Test-Path $platform)) {
            throw "Android platform API $env:TARGET_ANDROID_API was not found."
          }

          Write-Host "Android platform API $env:TARGET_ANDROID_API: OK"

          $ndkVersionFile = Join-Path $env:ANDROID_NDK_HOME "source.properties"

          if (Test-Path $ndkVersionFile) {
            Get-Content $ndkVersionFile
          }

      # ============================================================
      # Java
      # ============================================================

      - name: Validate Java
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Java"
          Write-Host "=========================================="

          Write-Host "JAVA_HOME: $env:JAVA_HOME"

          if (-not $env:JAVA_HOME) {
            throw "JAVA_HOME is not defined."
          }

          if (-not (Test-Path $env:JAVA_HOME)) {
            throw "JAVA_HOME does not exist: $env:JAVA_HOME"
          }

          & "$env:JAVA_HOME\bin\java.exe" -version

      # ============================================================
      # .NET
      # ============================================================

      - name: Validate .NET
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host ".NET"
          Write-Host "=========================================="

          dotnet --info
          dotnet --list-sdks

          $sdk = dotnet --version

          Write-Host "Selected SDK: $sdk"

          if ($sdk -notmatch "^11\.0\.100-preview\.5") {
            throw "Unexpected .NET SDK selected: $sdk"
          }

      # ============================================================
      # Locate project
      # ============================================================

      - name: Validate project
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Validating subsystem.master.csproj"
          Write-Host "=========================================="

          $projectFile = Join-Path $PWD "subsystem.master.csproj"

          if (-not (Test-Path $projectFile)) {
            throw "subsystem.master.csproj was not found."
          }

          Write-Host "Project: $projectFile"

          try {
            [xml]$projectXml = Get-Content $projectFile -Raw
          }
          catch {
            throw "subsystem.master.csproj is not valid XML: $($_.Exception.Message)"
          }

          Write-Host "Project XML is valid."

          $targetFrameworks = [string](
            $projectXml.Project.PropertyGroup.TargetFrameworks
          )

          Write-Host "TargetFrameworks: $targetFrameworks"

          if ($targetFrameworks -notmatch "net11\.0-android") {
            throw "net11.0-android target framework is missing."
          }

          if ($targetFrameworks -notmatch "net11\.0-windows") {
            throw "net11.0-windows target framework is missing."
          }

          $androidGroups = @(
            $projectXml.Project.PropertyGroup |
              Where-Object {
                $_.Condition -eq "'`$(TargetFramework)' == 'net11.0-android'"
              }
          )

          if ($androidGroups.Count -eq 0) {
            throw "Android PropertyGroup was not found."
          }

          Write-Host "Android PropertyGroup count: $($androidGroups.Count)"

      # ============================================================
      # CI compatibility fixes
      #
      # IMPORTANT:
      # No Compile Include is inserted here.
      # The SDK owns Compile items.
      # ============================================================

      - name: Apply CI compatibility fixes
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Applying CI compatibility fixes"
          Write-Host "=========================================="

          $projectFile = Join-Path $PWD "subsystem.master.csproj"

          try {
            [xml]$xml = Get-Content $projectFile -Raw
          }
          catch {
            throw "Cannot parse subsystem.master.csproj before modification: $($_.Exception.Message)"
          }

          $androidGroups = @(
            $xml.Project.PropertyGroup |
              Where-Object {
                $_.Condition -eq "'`$(TargetFramework)' == 'net11.0-android'"
              }
          )

          if ($androidGroups.Count -eq 0) {
            throw "Android PropertyGroup was not found."
          }

          foreach ($group in $androidGroups) {

            # --------------------------------------------------------
            # Remove diagnostic source files from DefaultItemExcludes.
            #
            # These files MUST be discovered by the SDK normally.
            # We intentionally do NOT create Compile Include entries.
            # --------------------------------------------------------

            $excludeNode = $group.DefaultItemExcludes

            if ($null -eq $excludeNode) {
              $excludeNode = $xml.CreateElement("DefaultItemExcludes")
              [void]$group.AppendChild($excludeNode)
            }

            $current = [string]$excludeNode.InnerText

            $diagnosticFiles = @(
              "src\runspace\Diagnostics\AgentSettings.cs",
              "src\runspace\Diagnostics\Dg.cs",
              "src\runspace\Diagnostics\PackageInfoDb.cs",
              "src\runspace\Diagnostics\SqliteProbe.cs",
              "src\runspace\Diagnostics\TerminalAccessibilityService.cs"
            )

            foreach ($file in $diagnosticFiles) {
              $current = $current.Replace(";$file", "")
              $current = $current.Replace($file + ";", "")
              $current = $current.Replace($file, "")
            }

            $excludeNode.InnerText = $current

            # --------------------------------------------------------
            # Explicit Android resource generation.
            # --------------------------------------------------------

            $useAapt2 = $group.AndroidUseAapt2

            if ($null -eq $useAapt2) {
              $useAapt2 = $xml.CreateElement("AndroidUseAapt2")
              [void]$group.AppendChild($useAapt2)
            }

            $useAapt2.InnerText = "true"

            $resourceDesigner = $group.AndroidResourceDesigner

            if ($null -eq $resourceDesigner) {
              $resourceDesigner = $xml.CreateElement("AndroidResourceDesigner")
              [void]$group.AppendChild($resourceDesigner)
            }

            $resourceDesigner.InnerText = "true"
          }

          # ----------------------------------------------------------
          # Remove any manually inserted Compile items for diagnostics.
          #
          # This is deliberately done through XML, not YAML text
          # replacement, so '<', '>', '$' and quotes cannot corrupt
          # the workflow parser.
          # ----------------------------------------------------------

          $compileNodes = @(
            $xml.Project.ItemGroup.Compile
          )

          $diagnosticNames = @(
            "AgentSettings.cs",
            "Dg.cs",
            "PackageInfoDb.cs",
            "SqliteProbe.cs"
          )

          foreach ($compile in $compileNodes) {

            $include = [string]$compile.Include

            foreach ($name in $diagnosticNames) {
              if ($include -like "*$name") {
                [void]$compile.ParentNode.RemoveChild($compile)
                break
              }
            }
          }

          # ----------------------------------------------------------
          # Save valid XML.
          # ----------------------------------------------------------

          $settings = New-Object System.Xml.XmlWriterSettings
          $settings.Indent = $true
          $settings.OmitXmlDeclaration = $true

          $writer = [System.Xml.XmlWriter]::Create(
            $projectFile,
            $settings
          )

          try {
            $xml.Save($writer)
          }
          finally {
            $writer.Dispose()
          }

          # ----------------------------------------------------------
          # Re-read immediately.
          # ----------------------------------------------------------

          try {
            [xml]$verifyXml = Get-Content $projectFile -Raw
          }
          catch {
            throw "subsystem.master.csproj became invalid XML: $($_.Exception.Message)"
          }

          Write-Host "subsystem.master.csproj remains valid XML."

          $verifyFrameworks = [string](
            $verifyXml.Project.PropertyGroup.TargetFrameworks
          )

          if ($verifyFrameworks -notmatch "net11\.0-android") {
            throw "net11.0-android disappeared after CI patch."
          }

          Write-Host "TargetFrameworks confirmed."

          Write-Host ""
          Write-Host "No diagnostic Compile items were manually added."
          Write-Host "Android resource generation configured."
          Write-Host "CI compatibility fixes completed."

      # ============================================================
      # NotificationService compatibility
      # ============================================================

      - name: Patch NotificationService compatibility
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "NotificationService compatibility"
          Write-Host "=========================================="

          $files = Get-ChildItem `
            -Path . `
            -Filter "NotificationService.cs" `
            -Recurse `
            -File

          if ($files.Count -eq 0) {
            Write-Host "NotificationService.cs not found."
            Write-Host "No patch required."
            exit 0
          }

          foreach ($file in $files) {
            Write-Host "Checking: $($file.FullName)"

            $text = Get-Content $file.FullName -Raw

            # Keep this step intentionally conservative.
            # Do not perform broad source transformations here.
            Set-Content `
              -Path $file.FullName `
              -Value $text `
              -Encoding UTF8

            Write-Host "NotificationService.cs patched."
          }

      # ============================================================
      # Validate diagnostics source files
      # ============================================================

      - name: Validate Android diagnostics sources
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Validating Android diagnostics sources"
          Write-Host "=========================================="

          $requiredFiles = @(
            "src\runspace\Diagnostics\AgentSettings.cs",
            "src\runspace\Diagnostics\Dg.cs",
            "src\runspace\Diagnostics\PackageInfoDb.cs",
            "src\runspace\Diagnostics\SqliteProbe.cs"
          )

          foreach ($file in $requiredFiles) {

            if (-not (Test-Path $file)) {
              throw "Required source file is missing: $file"
            }

            Write-Host "Source confirmed: $file"
          }

          Write-Host ""
          Write-Host "All required diagnostics source files exist."

      # ============================================================
      # Validate Android resources
      # ============================================================

      - name: Validate Android resources
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Checking Android resources"
          Write-Host "=========================================="

          $resourceRoot = Join-Path $PWD "Resources"

          if (-not (Test-Path $resourceRoot)) {
            Write-Host "Resources directory does not exist."
            Write-Host "Continuing because the project may generate resources through Android tooling."
            exit 0
          }

          Write-Host "Resources directory: $resourceRoot"

          $resourceFiles = @(
            Get-ChildItem `
              -Path $resourceRoot `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue
          )

          Write-Host "Resource files: $($resourceFiles.Count)"

          if ($resourceFiles.Count -gt 0) {
            $resourceFiles |
              Select-Object -First 30 |
              ForEach-Object {
                Write-Host "  $($_.FullName)"
              }
          }

      # ============================================================
      # Restore
      # ============================================================

      - name: Restore Android
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Restoring Android dependencies"
          Write-Host "=========================================="

          dotnet restore .\subsystem.master.csproj `
            -p:TargetFramework=net11.0-android `
            -p:RuntimeIdentifier=android-arm64 `
            -p:SupportedOSPlatformVersion=31.0 `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"

          if ($LASTEXITCODE -ne 0) {
            throw "Android restore failed."
          }

          Write-Host "Android restore succeeded."

      # ============================================================
      # Validate MSBuild Compile graph
      #
      # This is the important replacement for the old manual
      # <Compile Include="..."> approach.
      # ============================================================

      - name: Validate Android Compile items
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Checking Android Compile items"
          Write-Host "=========================================="

          $projectFile = Join-Path $PWD "subsystem.master.csproj"

          $compileList = dotnet msbuild `
            $projectFile `
            -p:TargetFramework=net11.0-android `
            -p:RuntimeIdentifier=android-arm64 `
            -p:SupportedOSPlatformVersion=31.0 `
            -getItem:Compile

          if ($LASTEXITCODE -ne 0) {
            throw "Could not query MSBuild Compile items."
          }

          $compileText = $compileList | Out-String

          Write-Host $compileText

          $requiredCompileFiles = @(
            "AgentSettings.cs",
            "Dg.cs",
            "PackageInfoDb.cs",
            "SqliteProbe.cs"
          )

          foreach ($name in $requiredCompileFiles) {

            if ($compileText -notmatch [regex]::Escape($name)) {
              throw "$name is NOT part of the Android Compile items."
            }

            Write-Host "Compile item confirmed: $name"
          }

          Write-Host ""
          Write-Host "All required diagnostics files are included by the SDK."

      # ============================================================
      # Android build
      # ============================================================

      - name: Build Subsystem for Android ARM64
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Building Subsystem for Android ARM64"
          Write-Host "=========================================="

          Write-Host "Target framework: net11.0-android"
          Write-Host "Minimum Android API: $env:MIN_ANDROID_API"
          Write-Host "Compile SDK: $env:TARGET_ANDROID_API"
          Write-Host "Runtime: android-arm64"
          Write-Host "ABI: arm64-v8a"

          $nativeLibrary = Join-Path `
            $PWD `
            "src\runspace\libs\arm64-v8a\libpsl-android.so"

          if (Test-Path $nativeLibrary) {
            Write-Host "Native library: present"
          }
          else {
            Write-Host "Native library: not present at:"
            Write-Host $nativeLibrary
          }

          dotnet build .\subsystem.master.csproj `
            -c Release `
            -f net11.0-android `
            -r android-arm64 `
            --no-restore `
            -p:SubsystemRelease=true `
            -p:SupportedOSPlatformVersion=31.0 `
            -p:AndroidSdkDirectory="$env:ANDROID_HOME"

          if ($LASTEXITCODE -ne 0) {
            throw "Android ARM64 compilation failed."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Android ARM64 compilation succeeded."
          Write-Host "=========================================="

      # ============================================================
      # Locate output
      # ============================================================

      - name: Inspect Android output
        if: success()
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Android build output"
          Write-Host "=========================================="

          $bin = Join-Path $PWD "bin"

          if (-not (Test-Path $bin)) {
            throw "bin directory was not produced."
          }

          Get-ChildItem `
            -Path $bin `
            -Recurse `
            -File `
            -Include *.apk,*.aab,*.dll,*.so `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host $_.FullName
              }
            
